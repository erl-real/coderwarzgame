<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Pager Duty</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><link rel="stylesheet" href="/style.css">
  </head>

  <body>
    <button class="sound" id="sound" aria-pressed="false">🔈 Sound off</button>

<div class="stage">
  <div class="pager" id="pager">
    <img class="photo" src="pager.png" alt="Retro alphanumeric pager">
    <div class="lcd" id="lcd">
      <div class="flashlayer"></div>
      <div class="head">
        <span class="stat"><span class="batt low"><i></i></span></span>
        <span class="env">✉</span>
        <span class="date" id="date">--</span>
      </div>
      <div class="body" id="lcdBody"></div>
    </div>
    <button class="btn prev" id="prev" aria-label="Previous line"></button>
    <button class="btn next" id="next" aria-label="Next line"><span class="glow"></span></button>
  </div>
</div>
    <script src="/script.js"></script>
  </body>

</html>
