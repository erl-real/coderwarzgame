<style>
@import url('https://fonts.googleapis.com/css2?family=Pirata+One&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ios-bg:#ffffff;
  --ios-bg-2:#f2f2f7;
  --ios-ink:#000000;
  --ios-ink-2:#8a8a8e;
  --ios-line:#d4d4d9;
  --ios-accent:#007aff;
  --ios-accent-ink:#ffffff;

  --bg:var(--ios-bg);
  --bg2:var(--ios-bg-2);
  --ink:var(--ios-ink);
  --ink2:var(--ios-ink-2);
  --line:var(--ios-line);
  --accent:var(--ios-accent);
  --accent-ink:var(--ios-accent-ink);
  --glow:0 0 0 rgba(0,0,0,0);

  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Helvetica,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --display:"Pirata One",serif;

  --spring:cubic-bezier(.19,1.42,.38,1);
  --ease:cubic-bezier(.32,.72,0,1);
}

/* the crypt takeover */
.screen.spooked{
  --bg:#06090a;
  --bg2:#0c1412;
  --ink:#e8ffe4;
  --ink2:#5f8a6d;
  --line:#173226;
  --accent:#7cff4f;
  --accent-ink:#04150a;
  --glow:0 0 22px rgba(124,255,79,.35);
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}

/* MODULE: transparent page so the phone composites inside the main game
   as the smaller player's device (embed via iframe). No backdrop, no grain. */
body{
  font-family:var(--sys);
  background:transparent;
  display:grid;
  place-items:center;
  padding:0;
  margin:0;
  overflow:hidden;
}

/* ── bat exodus (fired at the end) ──────────────────────── */
.burst-layer{position:fixed;inset:0;z-index:150;pointer-events:none;overflow:hidden}
.burstbat{
  position:fixed;width:34px;margin-left:-17px;margin-top:-12px;
  color:#0d0a12;filter:drop-shadow(0 0 10px rgba(124,255,79,.6));
  will-change:transform,opacity;
}
.burstbat svg{display:block;animation:flap .18s ease-in-out infinite alternate}

/* ── ambient bats (only after corruption) ───────────────── */
.bats{position:fixed;inset:0;pointer-events:none;z-index:1;opacity:0;transition:opacity 1.2s ease}
body.haunted .bats{opacity:.5}
.bat{position:absolute;width:26px;color:#2a1b3d;animation:flit linear infinite;will-change:transform}
.bat svg{display:block;animation:flap .32s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleY(.55) scaleX(1.05)}to{transform:scaleY(1.15) scaleX(.9)}}
@keyframes flit{
  0%{transform:translate(-12vw,18vh) rotate(-6deg)}
  50%{transform:translate(52vw,-14vh) rotate(8deg)}
  100%{transform:translate(114vw,26vh) rotate(-4deg)}
}

/* ── stage / phone shell ────────────────────────────────── */
.stage{
  position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:34px;
  perspective:1700px;perspective-origin:50% 42%;
}

/* the 15° left / 10° up rig — quake stays on .phone so the tilt survives */
.tilt3d{
  --tiltY:-15deg;--tiltX:10deg;
  transform-style:preserve-3d;
  transform:rotateX(var(--tiltX)) rotateY(var(--tiltY));
  transition:transform 1.1s var(--ease);
  animation:hover3d 9s ease-in-out infinite;
  filter:drop-shadow(-38px 46px 46px rgba(0,0,0,.62));
}
@keyframes hover3d{
  0%,100%{transform:rotateX(var(--tiltX)) rotateY(var(--tiltY)) translateY(0)}
  50%{transform:rotateX(calc(var(--tiltX) - 1.6deg)) rotateY(calc(var(--tiltY) + 2deg)) translateY(-9px)}
}
body.haunted .tilt3d{--tiltY:-17deg;--tiltX:12deg}

.phone{
  position:relative;width:392px;height:812px;border-radius:58px;
  padding:11px;
  background:linear-gradient(160deg,#4a4a52,#17171b 30%,#2c2c33 55%,#0e0e11 78%,#3d3d45);
  box-shadow:
    0 2px 0 rgba(255,255,255,.14) inset,
    0 50px 90px -30px rgba(0,0,0,.9),
    0 0 0 1px #000;
  transition:box-shadow .9s ease, transform .5s var(--ease);
}
body.haunted .phone{
  box-shadow:
    0 2px 0 rgba(255,255,255,.1) inset,
    0 50px 90px -28px rgba(0,0,0,.95),
    0 0 0 1px #000,
    0 0 90px -10px rgba(124,255,79,.35);
}
.phone.quake{animation:quake .5s ease}
@keyframes quake{
  0%,100%{transform:translate(0,0) rotate(0)}
  20%{transform:translate(-4px,2px) rotate(-.35deg)}
  40%{transform:translate(5px,-3px) rotate(.4deg)}
  60%{transform:translate(-3px,-1px) rotate(-.25deg)}
  80%{transform:translate(3px,2px) rotate(.15deg)}
}

.screen{
  position:relative;width:100%;height:100%;border-radius:48px;overflow:hidden;
  background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;
  transition:background .8s var(--ease), color .8s var(--ease);
}
.screen::after{ /* glass glare */
  content:"";position:absolute;inset:0;pointer-events:none;z-index:60;
  background:linear-gradient(118deg,rgba(255,255,255,.11) 0 18%,transparent 34%);
  mix-blend-mode:screen;
}
.screen.spooked::before{ /* vignette + fog */
  content:"";position:absolute;inset:0;pointer-events:none;z-index:55;
  background:
    radial-gradient(120% 70% at 50% 0%,rgba(124,255,79,.10),transparent 55%),
    radial-gradient(100% 60% at 50% 100%,rgba(177,75,255,.14),transparent 60%),
    radial-gradient(140% 100% at 50% 50%,transparent 45%,rgba(0,0,0,.85));
  animation:fogIn 1.4s var(--ease) both;
}
@keyframes fogIn{from{opacity:0}to{opacity:1}}

.island{
  position:absolute;top:22px;left:50%;transform:translateX(-50%);
  width:118px;height:33px;border-radius:20px;background:#000;z-index:70;
  transition:width .5s var(--spring), background .6s ease;
}
.phone.alarmed .island{width:172px;background:#000;box-shadow:0 0 26px rgba(124,255,79,.5)}

/* ── status bar ─────────────────────────────────────────── */
.statusbar{
  height:56px;flex:0 0 56px;display:flex;align-items:center;justify-content:space-between;
  padding:14px 30px 0;font-size:15px;font-weight:600;letter-spacing:.2px;position:relative;z-index:40;
}
.statusbar .icons{display:flex;align-items:center;gap:6px}
.bars{display:flex;align-items:flex-end;gap:2px;height:11px}
.bars i{width:3px;background:currentColor;border-radius:1px;display:block}
.bars i:nth-child(1){height:4px}.bars i:nth-child(2){height:6px}
.bars i:nth-child(3){height:8px}.bars i:nth-child(4){height:11px}
.batt{width:25px;height:12px;border:1.6px solid currentColor;border-radius:4px;position:relative;opacity:.9}
.batt::after{content:"";position:absolute;right:-4px;top:3.4px;width:2px;height:5px;background:currentColor;border-radius:0 2px 2px 0}
.batt i{position:absolute;inset:1.6px;width:70%;background:currentColor;border-radius:2px;transition:width .6s ease,background .6s ease}
.screen.spooked .batt i{width:13%;background:#ff4d4d;animation:battFlick 1.1s steps(2) infinite}
@keyframes battFlick{50%{opacity:.35}}
.screen.spooked .statusbar{text-shadow:var(--glow);animation:flicker 4.2s infinite}
@keyframes flicker{
  0%,96%,100%{opacity:1}
  97%{opacity:.35}98%{opacity:.9}99%{opacity:.5}
}

/* ── nav bar ────────────────────────────────────────────── */
.nav{
  position:relative;z-index:40;flex:0 0 auto;
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  padding:6px 18px 12px;border-bottom:.5px solid var(--line);
  background:color-mix(in srgb,var(--bg) 82%,transparent);
  backdrop-filter:blur(18px);
  transition:border-color .8s ease,background .8s ease;
}
.nav .title{font-size:16px;font-weight:600;letter-spacing:-.2px;white-space:nowrap}
.screen.spooked .nav .title{font-family:var(--display);font-size:24px;font-weight:400;letter-spacing:.6px;text-shadow:var(--glow)}
.nav .left{font-size:16px;color:var(--accent);justify-self:start}
.nav .right{justify-self:end}

.sendbtn{
  position:relative;border:0;cursor:pointer;border-radius:999px;
  padding:8px 20px 9px;font-family:var(--sys);font-size:15.5px;font-weight:600;letter-spacing:-.1px;
  background:var(--accent);color:var(--accent-ink);
  display:inline-flex;align-items:center;gap:7px;
  animation:breathe 2.6s ease-in-out infinite;
  transition:background .5s ease;
}
.sendbtn svg{width:14px;height:14px;transform:translateY(-.5px)}
.sendbtn::after{ /* breathing halo */
  content:"";position:absolute;inset:-3px;border-radius:999px;pointer-events:none;
  border:1.5px solid var(--accent);opacity:0;
  animation:halo 2.6s ease-out infinite;
}
@keyframes breathe{
  0%,100%{transform:scale(1);box-shadow:0 4px 14px -6px color-mix(in srgb,var(--accent) 80%,transparent)}
  50%{transform:scale(1.065);box-shadow:0 8px 26px -6px color-mix(in srgb,var(--accent) 95%,transparent)}
}
@keyframes halo{
  0%{opacity:.55;transform:scale(1)}
  70%{opacity:0;transform:scale(1.35)}
  100%{opacity:0;transform:scale(1.35)}
}
.sendbtn:hover{filter:brightness(1.08)}
.sendbtn:active{animation:none;transform:scale(.92)}
.sendbtn[disabled]{opacity:.32;pointer-events:none;animation:none}
.sendbtn[disabled]::after{display:none}

/* ── compose view ───────────────────────────────────────── */
.view{position:absolute;inset:56px 0 0;display:flex;flex-direction:column;z-index:30}
.view.hidden{pointer-events:none}

.fields{padding:0 18px;flex:0 0 auto}
.row{
  display:flex;gap:8px;align-items:flex-start;padding:11px 0;
  border-bottom:.5px solid var(--line);font-size:15px;flex-wrap:wrap;
  transition:border-color .8s ease;
}
.row .lbl{color:var(--ink2);flex:0 0 auto;transition:color .8s ease}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{
  background:color-mix(in srgb,var(--accent) 15%,transparent);
  color:var(--accent);border-radius:11px;padding:2px 9px;font-size:13.5px;font-weight:500;
  transition:background .6s ease,color .6s ease,transform .3s var(--spring);
}
.chip.more{background:transparent;color:var(--ink2)}
.subject{font-weight:600}

.body{
  padding:18px;font-size:15.5px;line-height:1.52;overflow-y:auto;flex:1 1 auto;
  -webkit-mask-image:linear-gradient(180deg,#000 92%,transparent);
}
.body p{margin-bottom:13px}
.body .sig{color:var(--ink2);font-size:13.5px;line-height:1.45;border-top:.5px solid var(--line);padding-top:11px;margin-top:4px}
.body .pumpkin{font-size:17px}

/* send lift-off */
.view.launch{animation:launch .72s var(--ease) forwards}
@keyframes launch{
  0%{transform:translateY(0) scale(1);opacity:1;filter:blur(0)}
  35%{transform:translateY(-14px) scale(.985)}
  100%{transform:translateY(-120%) scale(.72);opacity:0;filter:blur(7px)}
}

/* ── sending state ──────────────────────────────────────── */
.progress{
  position:absolute;top:0;left:0;height:2.5px;width:0;z-index:45;
  background:linear-gradient(90deg,var(--accent),color-mix(in srgb,var(--accent) 45%,#fff));
  box-shadow:0 0 12px color-mix(in srgb,var(--accent) 70%,transparent);
}
.progress.run{animation:fill 5s linear forwards}
@keyframes fill{to{width:100%}}

.sending{
  position:absolute;inset:56px 0 0;z-index:20;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:20px;text-align:center;padding:0 44px;
  opacity:0;pointer-events:none;transition:opacity .5s ease;
}
.sending.on{opacity:1}
.ring{width:74px;height:74px;position:relative}
.ring svg{transform:rotate(-90deg);overflow:visible}
.ring circle{fill:none;stroke-width:3.5;stroke-linecap:round}
.ring .track{stroke:var(--line)}
.ring .fill{stroke:var(--accent);stroke-dasharray:207;stroke-dashoffset:207;filter:drop-shadow(0 0 6px color-mix(in srgb,var(--accent) 60%,transparent))}
.ring.run .fill{animation:sweep 5s linear forwards}
@keyframes sweep{to{stroke-dashoffset:0}}
.ring .count{
  position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:19px;font-weight:600;
}
.sending h3{font-size:17px;font-weight:600;letter-spacing:-.2px}
.sending p{font-size:13.5px;color:var(--ink2);line-height:1.5;font-family:var(--mono)}
.dots::after{content:"";animation:dots 1.3s steps(4,end) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* ── daemon inbox list ──────────────────────────────────── */
.inbox{
  position:absolute;inset:56px 0 0;z-index:15;overflow:hidden;
  display:flex;flex-direction:column;opacity:0;transition:opacity .6s ease;
}
.inbox.on{opacity:1}
.inbox .scroll{overflow:hidden;flex:1 1 auto;padding-top:6px}
.mailrow{
  display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:start;
  padding:12px 18px;border-bottom:.5px solid var(--line);
  animation:rowIn .55s var(--spring) both;
}
@keyframes rowIn{
  from{opacity:0;transform:translateX(-26px) scale(.97)}
  to{opacity:1;transform:none}
}
.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);margin-top:6px;box-shadow:var(--glow)}
.mailrow .from{font-size:15px;font-weight:600;display:flex;align-items:center;gap:6px}
.mailrow .subj{font-size:13.5px;margin-top:2px;color:var(--ink);opacity:.92}
.mailrow .prev{font-size:12.5px;color:var(--ink2);margin-top:2px;font-family:var(--mono);line-height:1.35}
.mailrow .time{font-size:12px;color:var(--ink2);white-space:nowrap;font-family:var(--mono)}

/* ── TOASTS — the main event ────────────────────────────── */
.toasts{
  position:absolute;top:64px;left:0;right:0;z-index:50;
  padding:0 12px;display:flex;flex-direction:column;gap:9px;pointer-events:none;
  perspective:900px;
}
.toast{
  --tint:#ff4d4d;
  position:relative;transform-origin:50% 0%;
  background:rgba(26,26,30,.74);
  backdrop-filter:blur(26px) saturate(180%);
  border:.5px solid rgba(255,255,255,.13);
  border-radius:20px;padding:11px 13px 12px;
  color:#fff;
  box-shadow:0 18px 40px -18px rgba(0,0,0,.95), 0 0 0 .5px rgba(0,0,0,.4);
  display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:start;
  animation:toastIn .78s var(--spring) both;
  will-change:transform,opacity;
}
@keyframes toastIn{
  0%{opacity:0;transform:translateY(-118%) scale(.74) rotateX(-38deg)}
  55%{opacity:1}
  70%{transform:translateY(5px) scale(1.02) rotateX(2deg)}
  100%{opacity:1;transform:translateY(0) scale(1) rotateX(0)}
}
/* toast delivered by the slap sequence: no entrance anim, just a settle */
.toast.noanim{animation:none}
.toast.settle{animation:settle .5s var(--spring) both}
@keyframes settle{
  0%{transform:scale(1.06) rotate(-1.2deg);filter:blur(1.4px)}
  100%{transform:scale(1) rotate(0);filter:blur(0)}
}

/* ── SLAP LAYER — toast hits YOUR monitor first ─────────── */
.slap-layer{position:fixed;inset:0;z-index:200;pointer-events:none;perspective:1400px}
.slapper{
  position:fixed;left:50%;top:44%;margin:0;
  width:min(520px,86vw);
  transform:translate(-50%,-50%);
  transform-origin:50% 50%;
  will-change:transform,opacity,filter;
  box-shadow:0 40px 90px -30px rgba(0,0,0,.95), 0 0 0 .5px rgba(0,0,0,.5);
}
.slapper .ico{width:44px;height:44px;font-size:23px;border-radius:12px}
.slapper{grid-template-columns:44px 1fr auto;padding:15px 17px 16px;border-radius:24px}
.slapper .head{font-size:12.5px}
.slapper .code{font-size:13px}
.slapper .msg{font-size:17.5px}
.slapper.absurd .msg{font-size:26px}
.slapper .addr{font-size:12.5px}

/* ── red flash across the backdrop, once per bounce ─────── */
.redflash{
  position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;mix-blend-mode:screen;
  background:
    radial-gradient(58% 52% at 50% 44%, rgba(255,46,46,.66), rgba(150,0,0,.30) 46%, transparent 74%),
    linear-gradient(180deg, rgba(190,10,10,.22), transparent 42%, rgba(190,10,10,.22));
}
.redflash.on{animation:redpulse .62s cubic-bezier(.1,.9,.3,1)}
@keyframes redpulse{
  0%{opacity:0}
  9%{opacity:1}
  30%{opacity:.38}
  44%{opacity:.82}
  100%{opacity:0}
}
body.impact{animation:impact .34s ease}
@keyframes impact{
  0%,100%{transform:translate(0,0)}
  25%{transform:translate(6px,-5px)}
  55%{transform:translate(-5px,4px)}
  80%{transform:translate(3px,-2px)}
}

.toast.out{animation:toastOut .42s var(--ease) forwards}
@keyframes toastOut{to{opacity:0;transform:translateY(-40px) scale(.9);filter:blur(4px)}}

.toast .ico{
  width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-size:18px;
  background:linear-gradient(160deg,var(--tint),color-mix(in srgb,var(--tint) 45%,#000));
  box-shadow:0 5px 14px -6px var(--tint);
  animation:icoPulse 2.2s ease-in-out infinite;
}
@keyframes icoPulse{50%{transform:scale(1.06) rotate(-3deg)}}
.toast .head{
  font-size:11.5px;font-weight:700;letter-spacing:.85px;text-transform:uppercase;
  color:rgba(255,255,255,.62);display:flex;align-items:center;gap:6px;
}
.toast .code{
  font-family:var(--mono);font-size:11.5px;font-weight:600;letter-spacing:.3px;
  color:var(--tint);margin-top:3px;
}
.toast .msg{font-size:13.8px;line-height:1.38;margin-top:3px;letter-spacing:-.1px}
.toast .addr{
  font-family:var(--mono);font-size:11.5px;color:rgba(255,255,255,.48);
  margin-top:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.toast .ago{font-size:11.5px;color:rgba(255,255,255,.42);font-family:var(--mono)}
.toast.absurd{border-color:color-mix(in srgb,var(--tint) 40%,transparent)}
.toast.absurd .msg{font-family:var(--display);font-size:19px;line-height:1.22;letter-spacing:.4px}
.toast.peak{animation:jitter 2.6s ease-in-out infinite}
@keyframes jitter{
  0%,92%,100%{transform:translate(0,0) rotate(0)}
  94%{transform:translate(-2px,1px) rotate(-.5deg)}
  96%{transform:translate(2px,-1px) rotate(.6deg)}
  98%{transform:translate(-1px,0) rotate(-.3deg)}
}
/* stacked depth for older toasts */
.toast[data-depth="1"]{transform:scale(.965) translateY(-3px);opacity:.86}
.toast[data-depth="2"]{transform:scale(.93) translateY(-6px);opacity:.6}
.toast[data-depth="3"]{transform:scale(.895) translateY(-9px);opacity:.32}

/* ── failure verdict card ───────────────────────────────── */
.verdict{
  position:absolute;left:16px;right:16px;bottom:34px;z-index:52;
  background:rgba(10,14,11,.82);backdrop-filter:blur(26px) saturate(160%);
  border:.5px solid color-mix(in srgb,var(--accent) 34%,transparent);
  border-radius:26px;padding:20px 20px 17px;text-align:center;
  box-shadow:0 26px 60px -24px #000, 0 0 60px -22px var(--accent);
  transform:translateY(140%);opacity:0;
  transition:transform .78s var(--spring),opacity .5s ease;
}
.verdict.on{transform:translateY(0);opacity:1}
.verdict h2{font-family:var(--display);font-size:33px;font-weight:400;line-height:1;letter-spacing:.8px;color:var(--accent);text-shadow:var(--glow)}
.verdict .tally{font-family:var(--mono);font-size:12.5px;color:var(--ink2);margin-top:9px;letter-spacing:.4px}
.verdict .tally b{color:var(--ink)}
.reset{
  margin-top:15px;width:100%;border:0;cursor:pointer;border-radius:15px;padding:13px;
  font-family:var(--sys);font-size:15.5px;font-weight:600;letter-spacing:-.2px;
  background:var(--accent);color:var(--accent-ink);
  transition:transform .2s var(--spring),filter .2s ease;
}
.reset:hover{filter:brightness(1.12)}
.reset:active{transform:scale(.96)}

/* ── home bar ───────────────────────────────────────────── */
.homebar{
  position:absolute;bottom:9px;left:50%;transform:translateX(-50%);
  width:138px;height:5px;border-radius:3px;background:var(--ink);opacity:.28;z-index:58;
  transition:background .8s ease;
}

/* ── caption under phone ────────────────────────────────── */
.caption{
  text-align:center;color:#6f6a80;font-family:var(--mono);font-size:11.5px;
  letter-spacing:1.4px;text-transform:uppercase;max-width:392px;line-height:1.7;
}
.caption b{color:#7cff4f;font-weight:500}

@media (max-height:960px){
  .stage{transform:scale(.84);transform-origin:top center;margin-bottom:-150px}
}
@media (max-width:520px){
  .stage{transform:scale(.74);transform-origin:top center;margin-bottom:-230px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

/* ══ DOPE WARS · iOS reskin (uses phone vars) ══ */
#app{
  position:absolute;inset:56px 0 0;z-index:30;
  overflow-y:auto;overflow-x:hidden;
  padding:0 14px 40px;margin:0;max-width:none;left:0;right:0;
  transform:none;background:var(--bg);color:var(--ink);
  font-family:var(--sys);font-size:14px;line-height:1.45;

<script>

const $ = id => document.getElementById(id);
const phone=$("phone"), screen=$("screen"), toasts=$("toasts"),
      slapLayer=$("slapLayer"), redflash=$("redflash"), burstLayer=$("burstLayer"),
      notiBtn=$("notiBtn"), noticenter=$("noticenter"), ncList=$("ncList"),
      ncBadge=$("ncBadge"), ncClear=$("ncClear");
let timers=[];
const wait=(fn,ms)=>timers.push(setTimeout(fn,ms));

const BAT_SVG=`<svg viewBox="0 0 64 28" fill="currentColor"><path d="M32 6c3-5 9-6 13-3 3 2 4 6 9 4 4-2 8-6 10-7-3 6-4 12-9 15-6 4-13 2-17 7-1 1-2 4-6 4s-5-3-6-4c-4-5-11-3-17-7C4 12 3 6 0 0c2 1 6 5 10 7 5 2 6-2 9-4 4-3 10-2 13 3z"/></svg>`;
(function makeBats(){
  const wrap=$("bats");
  for(let i=0;i<7;i++){
    const b=document.createElement("div");
    b.className="bat"; b.innerHTML=BAT_SVG;
    b.style.top=(Math.random()*80)+"%";
    b.style.animationDuration=(16+Math.random()*16)+"s";
    b.style.animationDelay=(-Math.random()*20)+"s";
    b.style.width=(16+Math.random()*26)+"px";
    b.style.color=["#2a1b3d","#1d2b22","#3a2450"][i%3];
    wrap.appendChild(b);
  }
})();
/* status bar shows the IN-GAME date, updated on every render + interval */
window.phoneDate=function(){
  const el=$("gamedate");
  if(!el) return;
  if(window.G && window.G.month){
    const M=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    el.textContent=M[window.G.month-1]+" "+window.G.mday+", "+String(window.G.year).slice(-2);
  }else{
    el.textContent=new Date().toLocaleDateString([],{month:"short",day:"numeric"});
  }
};
window.phoneDate(); setInterval(window.phoneDate,5000);

function buildToast(b){
  const el=document.createElement("div");
  el.className="toast"+(b.absurd?" absurd":"");
  el.style.setProperty("--tint",b.tint);
  el.innerHTML=`
    <div class="ico">${b.ico}</div>
    <div>
      <div class="head">${b.head||"Dope Wars"}</div>
      <div class="code">${b.code||""}</div>
      <div class="msg">${b.msg}</div>
      <div class="addr">${b.addr||""}</div>
    </div>
    <div class="ago">${b.ago||"now"}</div>`;
  return el;
}
function pushToast(b){
  /* feed notification center history */
  window._notis.unshift({ico:b.ico,tint:b.tint,head:b.head||"Dope Wars",msg:b.msg,when:ncTime()});
  if(window._notis.length>10) window._notis.length=10;
  window._ncUnread=(window._ncUnread||0)+1; ncUpdateBadge();
  if(noticenter.classList.contains("on")) ncRender();
  const slot=buildToast(b);
  slot.classList.add("noanim");
  slot.style.visibility="hidden";
  toasts.prepend(slot);
  restack();
  const target=slot.getBoundingClientRect();
  const flyer=buildToast(b);
  flyer.classList.add("slapper","noanim");
  slapLayer.appendChild(flyer);
  const from=flyer.getBoundingClientRect();
  const base="translate(-50%,-50%) ";
  const s=target.width/from.width;
  const dx=(target.left+target.width/2)-(from.left+from.width/2);
  const dy=(target.top+target.height/2)-(from.top+from.height/2);
  const anim=flyer.animate([
    {offset:0,    opacity:0, filter:"blur(16px)", transform:base+"scale(2.35) rotate(-7deg) translateZ(340px)"},
    {offset:.14,  opacity:1, filter:"blur(0px)",  transform:base+"scale(1.05) rotate(1.6deg)"},
    {offset:.20,             transform:base+"scale(.955) rotate(-.9deg) skewX(3deg)"},
    {offset:.27,             transform:base+"scale(1.01) rotate(.3deg)"},
    {offset:.34,             transform:base+"scale(1) rotate(0)"},
    {offset:.52,             transform:base+`translate(${dx*.22}px,${dy*.22}px) scale(${1-(1-s)*.22}) skewX(11deg) skewY(-3deg) rotateY(-26deg)`},
    {offset:.68,             transform:base+`translate(${dx*.52}px,${dy*.52}px) scale(${1-(1-s)*.55}) skewX(-8deg) skewY(4deg) rotateY(18deg) rotateX(-12deg)`},
    {offset:.84,             transform:base+`translate(${dx*.82}px,${dy*.82}px) scale(${1-(1-s)*.86}) skewX(5deg) rotateY(-22deg) rotateX(14deg)`},
    {offset:1,    opacity:1, transform:base+`translate(${dx}px,${dy}px) scale(${s}) rotateY(-15deg) rotateX(10deg)`}
  ],{duration:1150,easing:"cubic-bezier(.22,1,.3,1)",fill:"forwards"});
  if(b.flash){
    wait(()=>{
      redflash.classList.remove("on");
      void redflash.offsetWidth;
      redflash.classList.add("on");
      document.body.classList.add("impact");
      setTimeout(()=>document.body.classList.remove("impact"),340);
    },160);
  }
  if(navigator.vibrate) navigator.vibrate(b.flash?[45,60,45]:22);
  anim.finished.then(()=>{
    flyer.remove();
    slot.style.visibility="";
    slot.classList.add("settle");
  }).catch(()=>{ flyer.remove(); slot.style.visibility=""; });
  wait(()=>{ slot.classList.add("out"); setTimeout(()=>slot.remove(),420); }, 4200);
}
function restack(){
  [...toasts.children].forEach((t,i)=>{
    if(i>3){ t.classList.add("out"); setTimeout(()=>t.remove(),420); }
    else t.dataset.depth = i>1 ? Math.min(i-1,3) : "";
  });
}
/* ── notification center (top-right dropdown) ── */
window._notis=[]; window._ncUnread=0;
function ncTime(){ return new Date().toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}); }
function ncRender(){
  if(!ncList) return;
  if(!window._notis.length){ ncList.innerHTML=`<div class="nc-empty">No notifications yet.</div>`; return; }
  ncList.innerHTML=window._notis.map(n=>`
    <div class="nc-item" style="--tint:${n.tint}">
      <div class="ico">${n.ico}</div>
      <div><div class="nhead">${n.head}</div><div class="nmsg">${n.msg}</div><div class="nwhen">${n.when}</div></div>
    </div>`).join("");
}
function ncUpdateBadge(){
  if(!ncBadge) return;
  const u=window._ncUnread||0;
  ncBadge.style.display=u>0?"block":"none";
  ncBadge.textContent=u>9?"9+":u;
}
function ncOpen(){ ncRender(); noticenter.classList.add("on"); window._ncUnread=0; ncUpdateBadge(); }
function ncClose(){ if(noticenter) noticenter.classList.remove("on"); }
if(notiBtn) notiBtn.addEventListener("click",e=>{ e.stopPropagation(); noticenter.classList.contains("on")?ncClose():ncOpen(); });
if(ncClear) ncClear.addEventListener("click",e=>{ e.stopPropagation(); window._notis=[]; ncRender(); });
screen.addEventListener("click",()=>{ if(noticenter.classList.contains("on")) ncClose(); });
/* game log -> phone notification */
window.pushGameLog=function(msg,type){
  const map={good:{ico:"✅",tint:"#34c759",head:"Dope Wars"},bad:{ico:"🚨",tint:"#ff3b30",head:"Dope Wars"},neutral:{ico:"💬",tint:"#007aff",head:"Dope Wars"}};
  const m=map[type]||map.neutral;
  pushToast({ico:m.ico,tint:m.tint,head:m.head,code:type?String(type).toUpperCase():"LOG",msg:msg,addr:"",ago:"now",flash:type==="bad"});
};

const DRUGS = [
  { name: "Weed",      base: 60,   min: 30,   max: 180  },
  { name: "Shrooms",   base: 100,  min: 50,   max: 300  },
  { name: "Speed",     base: 250,  min: 120,  max: 750  },
  { name: "Ecstasy",   base: 120,  min: 60,   max: 360  },
  { name: "Heroin",    base: 400,  min: 200,  max: 1200 },
  { name: "Cocaine",   base: 2000, min: 1000, max: 6000 },
  { name: "Acid",      base: 250,  min: 120,  max: 750  }

const CITIES = [

];

const TRAVEL_DAYS = {};
function distKey(a, b) { return a < b ? a + "," + b : b + "," + a; }
function calcDist(c1, c2) {
  return Math.sqrt(Math.pow(c1.x - c2.x, 2) + Math.pow(c1.y - c2.y, 2));
}
for (let i = 0; i < CITIES.length; i++) {
  for (let j = i + 1; j < CITIES.length; j++) {
    const d = calcDist(CITIES[i], CITIES[j]);
    const days = Math.max(1, Math.round(d / 200));
    TRAVEL_DAYS[distKey(i, j)] = days;
  }
}

function randomizePrices() {
  G.prices = DRUGS.map(d => {
    let variance = 0.4 + Math.random() * 1.2;
    let price = Math.round(d.base * variance);
    return Math.max(d.min, Math.min(d.max, price));
  });
  // sometimes a drug becomes unavailable
  if (Math.random() < 0.15) {
    let idx = Math.floor(Math.random() * DRUGS.length);
    G.prices[idx] = 0;
  }
}

function advanceDate(days) {
  for (let i = 0; i < days; i++) {
    G.mday++;
    const daysInMonth = [31,28,31,30,31,30,31,31,30,31,30,31];
    if (G.mday > daysInMonth[G.month - 1]) {
      G.mday = 1;
      G.month++;
      if (G.month > 12) { G.month = 1; G.year++; }
    }
    G.day++;
  }
}

function addLog(msg, type) {
  G.log.unshift({ msg, type });
  if (G.log.length > 50) G.log.pop();
  // Push to phone toast notifications
  if (window.pushGameLog) {
    window.pushGameLog(msg, type);
  }
}

function getDateString() {
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return months[G.month - 1] + " " + G.mday + ", " + G.year;
}

function totalDrugs() {
  return G.inventory.reduce((a, b) => a + b, 0);
}

function netWorth() {
  let invValue = G.inventory.reduce((sum, qty, i) => sum + qty * G.prices[i], 0);
  return G.cash + G.bank + invValue - G.debt;
}

    return;

  G.tab = tab;

}

function hqCrateCap() {
  if (G.hq === "Small HQ") return 4;
  if (G.hq === "Medium HQ") return 8;
  if (G.hq === "Large HQ") return 15;
  return 0;
}

function hqCapacity() {
  const base = G.hq === "Small HQ" ? 100 : G.hq === "Medium HQ" ? 220 : G.hq === "Large HQ" ? 500 : G.maxCapacity;
  return base + Math.min(G.hqCrates || 0, hqCrateCap()) * 10;
}

function bagCapacity() {
  return 100 + (G.bag ? G.bag.slots : 0);
}

function rollTrunkStock() {
  G.trunkStock = {};
  const pool = TRUNK_GEAR.filter(g => !g.cities || g.requiresHQ || g.damage || g.armor || g.mask || g.crate || g.bagSlots || g.device);
  const count = Math.floor(Math.random() * 5);
  const available = pool.filter(g => !g.cities || g.cities.includes(G.city));
  const picked = new Set();

  // Devices use weighted stocking. The low-tech phone is deliberately common
  // because a phone/PC is the entry point to HACK. Other items remain normal.
  const weight = g => g.device === "phone" && g.tech === "low" ? 5 : (g.device ? 2 : 1);
  while (picked.size < count && picked.size < available.length) {
    const choices = available.filter(g => !picked.has(g.name));
    const total = choices.reduce((sum, g) => sum + weight(g), 0);
    let roll = Math.random() * total;
    let chosen = choices[choices.length - 1];
    for (const g of choices) {
      roll -= weight(g);
      if (roll <= 0) { chosen = g; break; }
    }
    picked.add(chosen.name);
    G.trunkStock[chosen.name] = true;
  }
}

function trunkAvailable(g) {
  return G.trunkStock[g.name] === true && (!g.cities || g.cities.includes(G.city));
}

function hasHackDevice() {
  return Array.isArray(G.devices) && G.devices.length > 0;
}

function hasPcDevice() {
  return Array.isArray(G.devices) && G.devices.some(d => d.device === "pc");
}

function hackQueueMax() {
  return 10 + (G.devices || []).reduce((sum, d) => sum + (d.queueBonus || 0), 0);
}

function rollLotStock() {
  G.lotStock = {};
  CARS.forEach((car, i) => { G.lotStock[i] = Math.random() >= car.emptyChance; });
}

function lotAvailable(i) {
  if (G.lotStock[i] === undefined) rollLotStock();
  return G.lotStock[i];
}

function gunLabel(g) {
  return `${g.name} — ${g.status === "stolen" ? "STOLEN" : "NEW"}`;
}

function renderTrap() {
  const c = document.getElementById("content");
  const localGear = TRUNK_GEAR.filter(g => (!g.cities || g.cities.includes(G.city)) && trunkAvailable(g));
  const trunkRows = localGear.length > 0
    ? localGear.map(g => {
        const idx = TRUNK_GEAR.indexOf(g);
        const discount = G.eventDiscounts.trunk || 0;
        const cost = Math.round(g.cost * (1 - discount));
        const isGun = !!g.damage;
        const isBag = !!g.bagSlots;
        const isDevice = !!g.device;
        const ownedDevice = isDevice && G.devices.some(d => d.name === g.name);
        const owned = isBag ? (G.bag && G.bag.name === g.name) : (!isGun && !g.armor && !g.mask && !g.crate && G.gear.some(x => x.name === g.name));
        const button = isGun
          ? `<button class="menu-btn" style="width:auto;padding:2px 8px;margin:0;font-size:10px" onclick="buyGear(${idx})">BUY</button>`
          : `<button class="menu-btn" style="width:auto;padding:2px 8px;margin:0;font-size:10px;${owned || ownedDevice ? 'opacity:0.3' : ''}" ${owned || ownedDevice ? 'disabled' : ''} onclick="buyGear(${idx})">${ownedDevice ? "OWNED" : owned ? "EQUIPPED" : (isBag && G.bag ? "UPGRADE" : "BUY")}</button>`;
        return `<div class="file-row">
          <span class="file-type text" style="min-width:110px;font-weight:bold">${g.name}</span>
          <span style="flex:1;color:#aaa;font-size:10px">${g.desc}</span>
          <span style="font-size:10px;color:#ffcc00;margin:0 6px">$${cost.toLocaleString()}${discount ? ' <span style="color:#00ff41;font-size:9px">SALE</span>' : ""}</span>
          ${button}
        </div>`;
      }).join("")
    : '<div style="color:#888;font-size:11px;padding:6px">Trunk is empty today.</div>';

  const crateText = G.hq ? ` Crates: ${G.hqCrates || 0}/${hqCrateCap()} (+${Math.min(G.hqCrates || 0, hqCrateCap()) * 10} slots).` : "";
  const lot = G.hq && G.crew.length > 0 ? `<div class="title" style="margin-top:8px">LOT</div>${renderLotRows()}` : "";

  c.innerHTML = `
    <div class="title">TRAP</div>
    <button class="menu-btn" onclick="renderDrugMenu('buy')">BUY DRUGS</button>
    <button class="menu-btn" onclick="renderDrugMenu('sell')">SELL DRUGS</button>
    ${G.debt > 0 ? `<button class="menu-btn" onclick="renderLoanShark()">LOAN SHARK</button>` : ""}
    <button class="menu-btn" onclick="doTrain()">TRAIN (-5hp, +fitness/str XP)</button>
    <div class="title" style="margin-top:8px">TRUNK — GEAR</div>
    <div class="info-box">${G.hq ? `HQ capacity: ${hqCapacity()} slots. ${crateText}` : "Get an HQ to unlock the expanded trunk."} ${G.bag ? `Bag: ${G.bag.name}` : "No bag equipped"}.</div>
    ${trunkRows}
    ${lot}`;
}

function buyGear(idx) {
  const g = TRUNK_GEAR[idx];
  if (!trunkAvailable(g)) { addLog("That item is not in the trunk today.", "bad"); renderTrap(); return; }
  if (g.requiresHQ && !G.hq) { addLog("You need an HQ for that item.", "bad"); renderTrap(); return; }
  const discount = G.eventDiscounts.trunk || 0;
  const cost = Math.round(g.cost * (1 - discount));
  if (G.cash < cost) { addLog("Not enough cash!", "bad"); renderTrap(); return; }

  if (g.crate) {
    if ((G.hqCrates || 0) >= hqCrateCap()) { addLog("Your HQ has reached its crate limit.", "bad"); renderTrap(); return; }
    G.cash -= cost;
    G.hqCrates = (G.hqCrates || 0) + 1;
    G.maxCapacity = hqCapacity();
    addLog(`Bought an HQ crate for $${cost.toLocaleString()}. Capacity is now ${G.maxCapacity}.`, "good");
    refreshStats(); renderTrap(); return;
  }

  if (g.device) {
    if (hasHackDevice()) { addLog("You already own a phone or PC.", "bad"); renderTrap(); return; }
    G.cash -= cost;
    G.devices.push({ name: g.name, type: g.device, tech: g.tech, queueBonus: g.queueBonus });
    addLog(`Bought ${g.name} for $${cost.toLocaleString()}. HACK unlocked with +${g.queueBonus} scan queue slots.`, "good");
    refreshStats(); renderTrap(); return;
  }

  if (g.bagSlots) {
    if (G.bag && G.bag.name === g.name) { addLog("Already equipped!", "bad"); renderTrap(); return; }
    const newCapacity = 100 + g.bagSlots;
    if (newCapacity < totalDrugs()) { addLog("You have too much in your current bag to downgrade right now.", "bad"); renderTrap(); return; }
    G.cash -= cost;
    G.bag = { name: g.name, slots: g.bagSlots };
    G.maxCapacity = newCapacity;
    addLog(`Equipped ${g.name}. Capacity is now ${newCapacity} slots.`, "good");
    refreshStats(); renderTrap(); return;
  }

  if (g.damage) {
    G.cash -= cost;
    const status = g.stolenOnly ? "stolen" : (Math.random() < 0.5 ? "stolen" : "new");
    const gun = { name: g.name, desc: g.desc, damage: g.damage, status, assignedTo: null };
    G.guns.push(gun);
    addLog(`Bought ${gunLabel(gun)} for $${cost.toLocaleString()}.`, "good");
    if (G.crew.length > 0) renderGunAssignment(G.guns.length - 1);
    else { gun.assignedTo = "player"; syncGunGear(); addLog(`${gunLabel(gun)} assigned to you.`, "neutral"); refreshStats(); renderTrap(); }
    return;
  }

  if (g.armor) {
    G.cash -= cost;
    G.gear = G.gear.filter(x => !x.armor);
    G.gear.push({ name: g.name, desc: g.desc, armor: g.armor });
    G.armor = g.armor; G.maxArmor = g.armor;
    addLog(`Equipped ${g.name} for $${cost.toLocaleString()}.`, "good");
    refreshStats(); renderTrap(); return;
  }

  if (g.mask) {
    if (G.gear.some(x => x.mask)) { addLog("Already equipped a mask.", "bad"); renderTrap(); return; }
    G.cash -= cost; G.gear.push({ name: g.name, desc: g.desc, mask: true, escapeBonus: g.escapeBonus });
    addLog(`Equipped ${g.name} for $${cost.toLocaleString()}.`, "good"); refreshStats(); renderTrap(); return;
  }

  if (G.gear.some(x => x.name === g.name)) { addLog("Already owned!", "bad"); renderTrap(); return; }
  G.cash -= cost; G.gear.push({ name: g.name, desc: g.desc });
  addLog(`Bought ${g.name} for $${cost.toLocaleString()}${discount ? " (event discount)" : ""}.`, "good");
  refreshStats(); renderTrap();
}

function renderLotRows() {
  return CARS.map((car, i) => {
    const owned = G.playerCar && G.playerCar.name === car.name;
    const available = lotAvailable(i);
    if (!available) return `<div class="file-row"><span style="color:#666">LOT #${i + 1}</span><span style="flex:1;color:#666">EMPTY</span></div>`;
    return `<div class="file-row"><span class="file-type text" style="min-width:100px;font-weight:bold">${car.name}</span><span style="flex:1;color:#aaa;font-size:10px">${car.desc} | ${car.seats} seats | ${car.gearSlots} gear slots | -${Math.round(car.travelReduction * 100)}% travel</span><span style="font-size:10px;color:#ffcc00;margin:0 6px">$${car.cost.toLocaleString()}</span><button class="menu-btn" style="width:auto;padding:2px 7px;margin:0;font-size:9px" onclick="buyCar(${i})">${owned ? "SELECTED" : "BUY / ASSIGN"}</button></div>`;
  }).join("") + `<div style="color:#888;font-size:10px;padding:6px">Crew members need a car for missions. You can assign cars to crew or keep one for yourself.</div>`;
}

function buyCar(idx) {
  const car = CARS[idx];
  if (!G.hq || G.crew.length < 1) { addLog("You need an HQ and at least one crew member to use the lot.", "bad"); renderTrap(); return; }
  if (!lotAvailable(idx)) { addLog("That lot is empty today.", "bad"); renderTrap(); return; }
  if (G.cash < car.cost) { addLog("Not enough cash!", "bad"); renderTrap(); return; }
  const c = document.getElementById("content");
  const choices = ["player", ...G.crew];
  c.innerHTML = `<div class="title">BUY ${car.name}</div><div class="info-box">Choose who gets this car. Crew cars will be used for future missions; your car reduces your travel time.</div>${choices.map(target => { const q=target === "player" ? G.playerCar : getCrewGear(target).car; return `<button class="menu-btn" ${q ? "disabled style=\"opacity:0.35\"" : ""} onclick="confirmCarPurchase(${idx}, '${target.replace(/'/g,"\'")}')">${target === "player" ? "YOU" : target.toUpperCase()}${q ? ` — HAS ${q.name}` : ""}</button>`; }).join("")}<button class="menu-btn back-btn" onclick="renderTrap()">BACK</button>`;
}

function confirmCarPurchase(idx, target) {
  const car = CARS[idx];
  if (G.cash < car.cost) { addLog("Not enough cash!", "bad"); renderTrap(); return; }
  if (target === "player" ? G.playerCar : getCrewGear(target).car) { addLog("That person already has a car.", "bad"); renderTrap(); return; }
  G.cash -= car.cost;
  const carObj = { ...car };
  if (target === "player") G.playerCar = carObj;
  else getCrewGear(target).car = carObj;
  addLog(`${car.name} bought and assigned to ${target === "player" ? "you" : target}.`, "good");
  refreshStats(); renderTrap();
}

function assignBagToCrew(name) {
  if (!G.bag) { addLog("You do not have a bag to assign.", "bad"); renderCrewMembers(); return; }
  const q = getCrewGear(name);
  if (q.bag) { addLog(`${name} already has a bag.`, "bad"); renderCrewMembers(); return; }
  q.bag = G.bag;
  G.bag = null;
  G.maxCapacity = 100;
  addLog(`${q.bag.name} assigned to ${name}.`, "good");
  refreshStats(); renderCrewMembers();
}

function assignArmorToCrew(name) {
  const armor = G.gear.find(x => x.armor);
  if (!armor) { addLog("You do not have body armor to assign.", "bad"); renderCrewMembers(); return; }
  const q = getCrewGear(name);
  if (q.armor) { addLog(`${name} already has body armor.`, "bad"); renderCrewMembers(); return; }
  q.armor = { ...armor };
  G.gear = G.gear.filter(x => !x.armor);
  G.armor = 0; G.maxArmor = 0;
  addLog(`${armor.name} assigned to ${name}.`, "good");
  refreshStats(); renderCrewMembers();
}

function getCrewGear(name) {
  if (!G.crewGear[name]) G.crewGear[name] = { gun: null, car: null, bag: null, armor: null };
  return G.crewGear[name];
}

function renderGunAssignment(gunIdx) {
  const c = document.getElementById("content");
  const gun = G.guns[gunIdx];
  if (!gun) { renderTrap(); return; }
  const choices = ["player", ...G.crew];
  c.innerHTML = `
    <div class="title">ASSIGN ${gun.name}</div>

}

function gunHQCount() {
  return G.guns.filter(g => !g.assignedTo).length;
}

function assignGun(gunIdx, target) {
  const gun = G.guns[gunIdx];
  if (!gun) return;
  if (target !== "player" && !G.crew.includes(target)) return;
  gun.assignedTo = target;
  if (target !== "player") getCrewGear(target).gun = gun;
  syncGunGear();
  addLog(`${gun.name} assigned to ${target === "player" ? "you" : target}.`, "good");
  refreshStats();
  renderTrap();
}

function storeGunInHQ(gunIdx) {
  const gun = G.guns[gunIdx];
  if (!gun) return;
  if (!G.hq) { addLog("You need an HQ to store an unused gun.", "bad"); renderGunAssignment(gunIdx); return; }
  if (totalHQDrugs() + gunHQCount() >= G.maxCapacity) { addLog("HQ is full!", "bad"); renderGunAssignment(gunIdx); return; }
  gun.assignedTo = null;
  syncGunGear();
  addLog(`${gun.name} stored in HQ.`, "neutral");
  refreshStats();
  renderTrap();
}

function syncGunGear() {
  G.gear = G.gear.filter(g => !g.gunId);
  Object.keys(G.crewGear || {}).forEach(name => { if (G.crewGear[name]) G.crewGear[name].gun = null; });
  G.guns.forEach((gun, i) => {
    if (gun.assignedTo === "player") G.gear.push({ name: gunLabel(gun), desc: gun.desc, damage: gun.damage, gunId: i, status: gun.status });
    else if (gun.assignedTo && gun.assignedTo !== "seized") getCrewGear(gun.assignedTo).gun = gun;
  });
}

function doTrain() {
  if (G.hp <= 5) { addLog("Too weak to train!", "bad"); renderTrap(); return; }
  G.hp -= 5;
  const stat = Math.random() < 0.5 ? "fitness" : "strength";
  G.stats[stat] += 1;
  addLog(`Trained hard. -5 HP. Gained +1 ${stat} XP. (${G.stats[stat]})`, "neutral");
  refreshStats();
  renderTrap();
}

// ===== HACK TAB =====
const FILE_TYPES = [
  { name: "text",  label: "TXT", baseSize: 20,  baseValue: 2,   color: "#4fc3f7" },
  { name: "image", label: "IMG", baseSize: 80,  baseValue: 5,   color: "#ce93d8" },
  { name: "sound", label: "SND", baseSize: 200, baseValue: 10,  color: "#ffb74d" },
  { name: "video", label: "VID", baseSize: 500, baseValue: 200, color: "#ef5350" }
];

const HACK_UPGRADES = [
  { key: "dlSpeed",       name: "Download Speed", desc: "Files per scan",  baseCost: 25,   costMult: 1.8 },
  { key: "cpuSpeed",      name: "CPU Clock",       desc: "+1 enhance/compress/scan", baseCost: 40,   costMult: 2.0 },
  { key: "enhancerLv",    name: "Enhancer",        desc: "+50% value/lv", baseCost: 60,   costMult: 2.5 },
  { key: "compressorLv",  name: "Compressor",      desc: "Half size/lv",   baseCost: 50,   costMult: 2.2 },
  { key: "scannerLv",     name: "Virus Scanner",   desc: "Detect viruses", baseCost: 100,  costMult: 3.0 },
  { key: "quarantineLv",  name: "Quarantine Lab",  desc: "Fix infected files (research only, 2x RP)", baseCost: 200, costMult: 3.5 }
];

function hackState() { return G.hack; }

function hackUpgradeCost(key) {
  const u = HACK_UPGRADES.find(x => x.key === key);
  const lv = G.hack[key];
  return Math.round(u.baseCost * Math.pow(u.costMult, lv));
}

function buyHackUpgrade(key) {
  const h = hackState();
  const cost = hackUpgradeCost(key);
  if (h.research < cost) return;
  h.research -= cost;
  h[key]++;
  renderHack();
}

function processSpeed() {
  return Math.max(1, 1 + hackState().cpuSpeed);
}

function updateHackQueueUI() {
  const h = hackState();
  const q = document.getElementById("hack-scan-queue");
  const p = document.getElementById("hack-scan-progress");
  const bar = document.getElementById("hack-scan-progress-bar");
  if (q) q.textContent = `QUEUE: ${h.scanQueue}/${hackQueueMax()}${h.downloading ? ` · DOWNLOADING ${h.dlCount} FILE${h.dlCount > 1 ? "S" : ""}` : ""}`;
  if (p && bar) {
    const pct = h.downloading ? Math.min(100, Math.round((h.dlProgress / h.dlDuration) * 100)) : 0;
    p.textContent = h.downloading ? `CURRENT ${pct}%` : "";
    bar.style.width = pct + "%";
    bar.parentElement.style.display = h.downloading ? "block" : "none";
  }
}

function scanNetwork() {
  const h = hackState();
  // Do NOT re-render the HACK panel here. Replacing the button's DOM node
  // during a click can swallow rapid follow-up clicks. Queue every click
  // synchronously, up to the 10-scan cap, then update only the queue display.
  if (h.scanQueue >= hackQueueMax()) return;
  h.scanQueue++;
  if (!h.downloading) startNextScan();
  updateHackQueueUI();
}

function startNextScan() {
  const h = hackState();
  if (h.downloading || h.scanQueue <= 0) return;
  h.scanQueue--;
  const count = Math.max(1, h.dlSpeed);
  h.downloading = true;
  h.dlProgress = 0;
  h.dlCount = count;
  h.dlDuration = Math.max(500, count * 2400 / h.dlSpeed / processSpeed());
}

function finishDownload() {
  const h = hackState();
  const count = h.dlCount;
  for (let i = 0; i < count; i++) {
    const typeIdx = Math.floor(Math.random() * FILE_TYPES.length);
    const t = FILE_TYPES[typeIdx];
    const variance = 0.5 + Math.random();
    h.files.push({
      id: h.totalFiles++,
      type: typeIdx,
      size: Math.round(t.baseSize * variance),
      baseValue: t.baseValue,
      value: Math.round(t.baseValue * variance)
    });
  }
  h.downloading = false;
  h.dlProgress = 0;
  h.dlCount = 0;
  startNextScan();
}

function startFileProcess(f, action) {
  const h = hackState();
  if (f.processing) return;
  f.processing = action;
  f.processProgress = 0;

  const speed = processSpeed();
  if (action === "enhance") {
    // Higher-value files take longer; CPU upgrades reduce the timer.
    f.processDuration = Math.max(700, 900 + f.value * 45 / speed);
  } else if (action === "compress") {
    // Bigger files take longer to compress; CPU upgrades reduce the timer.
    f.processDuration = Math.max(700, 700 + f.size * 10 / speed);
  } else if (action === "sell" || action === "research") {
    // Selling/researching simulates an upload before the file leaves the queue.
    f.processDuration = Math.max(800, 900 + f.size * 5 / speed);
  }
}

function finishFileProcess(f) {
  const h = hackState();
  const action = f.processing;
  f.processing = null;
  f.processProgress = 0;

  if (action === "enhance") {
    f.value = Math.round(f.value * (1 + h.enhancerLv * 0.5));
    f.enhanced = true;
  } else if (action === "compress") {
    f.size = Math.max(1, Math.round(f.size * Math.pow(0.5, Math.max(1, h.compressorLv))));
    f.compressed = true;
  } else if (action === "sell") {
    if (f.infected) return;
    G.cash += f.value;
    h.totalEarned += f.value;
    h.files = h.files.filter(x => x.id !== f.id);
  } else if (action === "research") {
    if (f.infected) return;
    const mult = f.fixed ? 2 : 1;
    const rp = Math.max(1, Math.round(f.value * 0.15 * mult));
    h.research += rp;
    h.totalResearch += rp;
    h.files = h.files.filter(x => x.id !== f.id);
  }
}

function processFile(id, action) {
  const h = hackState();
  const f = h.files.find(x => x.id === id);
  if (!f || f.processing) return;

  if (action === "enhance") {
    if (f.enhanced || h.enhancerLv <= 0) return;
    startFileProcess(f, action);
  } else if (action === "compress") {
    if (f.compressed || h.compressorLv <= 0) return;
    startFileProcess(f, action);
  } else if (action === "scan") {
    if (f.scanned || f.scanning || h.scannerLv <= 0) return;
    f.scanning = true;
    f.scanProgress = 0;
    f.scanDuration = Math.max(500, f.size * 15 / processSpeed());
  } else if (action === "fix") {
    if (!f.infected || h.quarantineLv < 1) return;
    f.infected = false;
    f.fixed = true;
  } else if (action === "sell") {
    if (f.infected) return;
    startFileProcess(f, action);
  } else if (action === "research") {
    if (f.infected) return;
    startFileProcess(f, action);
  } else if (action === "trash") {
    h.files = h.files.filter(x => x.id !== id);
  }
  renderHack();
}

function finishScan(f) {
  f.scanning = false;
  f.scanned = true;
  if (f.infected) {
    // already infected
  } else if (Math.random() < 0.3) {
    f.infected = true;
  } else {
    f.value = Math.round(f.value * 1.5);
    f.clean = true;
  }
}

function updateHackFileProgressUI() {
  const h = hackState();
  h.files.forEach(f => {
    const row = document.getElementById(`hack-file-${f.id}`);
    if (!row) return;
    const bar = row.querySelector('[data-file-progress]');
    const label = row.querySelector('[data-file-progress-label]');
    if (f.scanning || f.processing) {
      const progress = f.scanning ? f.scanProgress : f.processProgress;
      const duration = f.scanning ? f.scanDuration : f.processDuration;
      const pct = Math.min(100, Math.round((progress / Math.max(1, duration)) * 100));
      if (bar) bar.style.width = pct + '%';
      if (label) label.textContent = `${f.scanning ? 'SCANNING' : String(f.processing).toUpperCase()} ${pct}%`;
    }
  });
}

// Background hack work runs independently of rendering. The timer only
// advances game state and patches existing progress elements; the full HACK
// panel is rebuilt only when a completed operation actually changes the file
// list/state that needs new buttons or rows.
let lastHackTick = performance.now();

function scanTick(now = performance.now()) {
  const h = hackState();
  const elapsed = Math.min(250, Math.max(0, now - lastHackTick));
  lastHackTick = now;
  if (!elapsed) return;

  let needsHackRender = false;

  if (h.downloading) {
    h.dlProgress += elapsed;
    if (h.dlProgress >= h.dlDuration) {
      finishDownload();
      needsHackRender = true;
    }
  } else if (h.scanQueue > 0) {
    startNextScan();
    needsHackRender = true;
  }

  h.files.slice().forEach(f => {
    if (f.scanning) {
      f.scanProgress += elapsed;
      if (f.scanProgress >= f.scanDuration) {
        finishScan(f);
        needsHackRender = true;
      }
    }
    if (f.processing) {
      f.processProgress += elapsed;
      if (f.processProgress >= f.processDuration) {
        finishFileProcess(f);
        needsHackRender = true;
      }
    }
  });

  if (G.tab === "hack") {
    if (needsHackRender) renderHack();
    else {
      updateHackQueueUI();
      updateHackFileProgressUI();
    }
  }
}

function sellAllFiles() {
  const h = hackState();
  h.files.forEach(f => {
    if (!f.infected && !f.processing) startFileProcess(f, "sell");
  });
  renderHack();
}

function researchAllFiles() {
  const h = hackState();
  h.files.forEach(f => {
    if (!f.infected && !f.processing) startFileProcess(f, "research");
  });
  renderHack();
}

function renderHack() {
  if (!hasHackDevice()) {
    G.tab = "trap";
    renderTrap();
    return;
  }
  const h = hackState();
  const c = document.getElementById("content");

  const upgrades = HACK_UPGRADES.map(u => {
    const cost = hackUpgradeCost(u.key);
    const lv = G.hack[u.key];
    const canBuy = h.research >= cost;
    return `<div class="upgrade-row">
      <div class="upgrade-info">
        <div class="upgrade-name">${u.name}</div>
        <div class="upgrade-desc">${u.desc}</div>
      </div>
      <span class="upgrade-lv">Lv.${lv}</span>
      <button class="menu-btn" style="width:auto;padding:4px 10px;margin:0;${canBuy ? '' : 'opacity:0.3'}"
        onclick="buyHackUpgrade('${u.key}')">RP ${cost.toLocaleString()}</button>
    </div>`;
  }).join("");

  let fileList = "";
  const showFiles = h.files.slice(0, 20);
  if (showFiles.length > 0) {
    fileList = showFiles.map(f => {
      const t = FILE_TYPES[f.type];
      let badges = [];
      if (f.enhanced) badges.push("E");
      if (f.compressed) badges.push("C");
      if (f.scanned) badges.push(f.clean ? "CLEAN" : f.fixed ? "FIXED" : "SCN");
      if (f.infected) badges.push("VIRUS");

      let pipeline = "";
      if (f.scanning || f.processing) {
        const pct = f.scanning
          ? Math.min(100, Math.round((f.scanProgress / f.scanDuration) * 100))
          : Math.min(100, Math.round((f.processProgress / f.processDuration) * 100));
        const label = f.scanning ? "SCANNING" : String(f.processing || "WORKING").toUpperCase();
        pipeline = `<div style="flex:1;min-width:100px"><div data-file-progress-label style="font-size:10px;color:#ffcc00;margin-bottom:2px">${label} ${pct}%</div><div class="scan-bar"><div data-file-progress class="scan-bar-fill" style="width:${pct}%"></div></div></div>`;
      } else {
        if (!f.scanned && h.scannerLv > 0) pipeline += `<button class="menu-btn" style="width:auto;padding:2px 6px;margin:0;font-size:10px" onclick="processFile(${f.id},'scan')">SCAN</button>`;
        if (!f.enhanced && h.enhancerLv > 0) pipeline += `<button class="menu-btn" style="width:auto;padding:2px 6px;margin:0;font-size:10px" onclick="processFile(${f.id},'enhance')">ENH</button>`;
        if (!f.compressed && h.compressorLv > 0) pipeline += `<button class="menu-btn" style="width:auto;padding:2px 6px;margin:0;font-size:10px" onclick="processFile(${f.id},'compress')">CMP</button>`;
        if (f.infected && h.quarantineLv > 0 && !f.fixed) pipeline += `<button class="menu-btn" style="width:auto;padding:2px 6px;margin:0;font-size:10px;border-color:#ff4444" onclick="processFile(${f.id},'fix')">FIX</button>`;
      }

      let trade = "";
      if (f.scanning || f.processing) {
        trade = `<span style="color:#888;font-size:10px">UPLOADING...</span>`;
      } else if (f.infected && !f.fixed) {
        trade = `<span style="color:#ff4444;font-size:10px">BLOCKED</span>`;
      } else {
        trade = `<button class="menu-btn" style="width:auto;padding:2px 6px;margin:0;font-size:10px" onclick="processFile(${f.id},'sell')">$</button>
                 <button class="menu-btn" style="width:auto;padding:2px 6px;margin:0;font-size:10px" onclick="processFile(${f.id},'research')">RP</button>`;
      }

      return `<div id="hack-file-${f.id}" class="file-row" style="${f.infected ? 'border-color:#ff4444' : ''}">
        <span class="file-type ${t.name}">${t.label}</span>
        <span class="file-stat">${f.size}KB</span>
        <span class="file-stat" style="color:#ffcc00">${badges.join(" ") || "NEW"}</span>
        <span class="file-value">$${f.value}</span>
        ${pipeline}
        ${trade}
        <button class="menu-btn" style="width:auto;padding:2px 4px;margin:0;font-size:9px;opacity:0.4" onclick="processFile(${f.id},'trash')">X</button>
      </div>`;
    }).join("");
    if (h.files.length > 20) {
      fileList += `<div style="color:#888;font-size:10px;padding:4px">...and ${h.files.length - 20} more</div>`;
    }
  }

  c.innerHTML = `
    <div class="title">FILE PROCESSING</div>
    <div style="border:1px solid #00ff41;padding:6px;margin-bottom:4px;text-align:center">

const VIRUS_STATS = [
  { key: "speed", name: "Speed" },
  { key: "strength", name: "Strength" },
  { key: "reach", name: "Reach" },
  { key: "lifespan", name: "Lifespan" }
];

function virusLevel(xp) {
  if (xp >= 200) return 5;
  if (xp >= 100) return 4;
  if (xp >= 50) return 3;
  if (xp >= 20) return 2;
  if (xp >= 5) return 1;
  return 0;
}

function virusDaysSinceFed() {
  return Math.max(0, G.day - G.virus.lastFedDay);
}

function updateVirusStatus() {
  if (!G.virus.alive) return;
  const days = virusDaysSinceFed();
  G.virus.weakened = days >= 7;
  if (days >= 14) {
    G.virus.alive = false;
    G.virus.weakened = false;
    addLog("Your virus died after going unfed for 2 weeks. You need a new virus.", "bad");
  }
}

function virusFoodCount() {
  return G.hack.files.filter(f => f.infected && !f.fixed).length;
}

function feedVirus(amount) {
  updateVirusStatus();
  if (!G.virus.alive) { renderVirus(); return; }
  const available = virusFoodCount();
  if (available <= 0) { addLog("No viruses available to feed.", "bad"); renderVirus(); return; }
  let count = amount === "all" ? available : Math.max(0, Math.min(available, Math.floor(amount)));
  if (count <= 0) return;

  const infected = G.hack.files.filter(f => f.infected && !f.fixed).slice(0, count);
  if (infected.length) {
    const fedIds = new Set(infected.map(f => f.id));
    infected.forEach(f => {
      const stat = VIRUS_STATS[Math.floor(Math.random() * VIRUS_STATS.length)];
      G.virus.stats[stat.key].xp += 1;
      G.virus.totalFed++;
    });
    G.hack.files = G.hack.files.filter(f => !fedIds.has(f.id));
  }

  G.virus.lastFedDay = G.day;
  G.virus.weakened = false;
  // XP changes are persisted directly above.
  addLog(`Fed your virus ${infected.length} virus${infected.length === 1 ? "" : "es"}.`, "good");
  renderVirus();
}

function createNewVirus() {
  if (G.virus.alive) return;
  G.virus = {
    alive: true,
    bornDay: G.day,
    lastFedDay: G.day,
    weakened: false,
    totalFed: 0,
    stats: {
      speed: { xp: 0 },
      strength: { xp: 0 },
      reach: { xp: 0 },
      lifespan: { xp: 0 }
    }
  };
  addLog("A new blank virus has been created.", "good");
  renderVirus();
}

function drawVirusOrb() {
  const canvas = document.getElementById("virusOrb");
  if (!canvas) return;
  const ctx = canvas.getContext("2d");
  const w = canvas.width = Math.max(280, Math.min(720, canvas.clientWidth * 2));
  const h = canvas.height = 520;
  ctx.clearRect(0, 0, w, h);

  const cx = w / 2, cy = h / 2, r = Math.min(w, h) * 0.30;
  ctx.fillStyle = "#020202";
  ctx.fillRect(0, 0, w, h);

  // Static 3D-style orb: no animation and no shaders.
  const g = ctx.createRadialGradient(cx - r * 0.35, cy - r * 0.45, r * 0.08, cx, cy, r);
  g.addColorStop(0, "#b8ffd0");
  g.addColorStop(0.18, "#35ff75");
  g.addColorStop(0.58, "#00a83c");
  g.addColorStop(0.86, "#00451c");
  g.addColorStop(1, "#001b0b");
  ctx.beginPath();
  ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.fillStyle = g;
  ctx.fill();
  ctx.strokeStyle = "#00ff41";
  ctx.lineWidth = Math.max(2, w / 300);
  ctx.stroke();

  ctx.globalAlpha = 0.18;
  ctx.strokeStyle = "#9dffb7";
  ctx.lineWidth = 2;
  for (let i = -2; i <= 2; i++) {
    ctx.beginPath();
    ctx.ellipse(cx, cy, r * (0.35 + Math.abs(i) * 0.13), r, 0, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

function renderVirus() {
  const c = document.getElementById("content");
  updateVirusStatus();
  const v = G.virus;
  const food = virusFoodCount();
  const fedAgo = virusDaysSinceFed();

  const statRows = VIRUS_STATS.map(s => {
    const xp = v.stats[s.key].xp;
    return `<div class="virus-stat">
      <span class="name">${s.name}</span><span class="level">Lv.${virusLevel(xp)}</span>
      <span class="xp">XP ${xp}</span>
    </div>`;
  }).join("");

  let status = v.alive
    ? (v.weakened ? `WEAKENED — unfed for ${fedAgo} day${fedAgo === 1 ? "" : "s"}` : `HEALTHY — last fed ${fedAgo} day${fedAgo === 1 ? "" : "s"} ago`)
    : "DEAD — this virus cannot be fed";

  c.innerHTML = `
    <div class="title">VIRUS</div>
    <div class="virus-window">
      <canvas id="virusOrb" class="virus-canvas"></canvas>
      <div class="virus-status ${v.alive ? (v.weakened ? "weak" : "") : "dead"}">${status}</div>
    </div>

    <div class="title">FEEDING</div>
    <div class="virus-food">
      <div class="virus-food-count">VIRUSES AVAILABLE: <strong style="color:#ff4444">${food}</strong><br><span style="color:#888;font-size:10px">Get infected viruses from the HACK tab.</span></div>
      <button class="menu-btn" style="width:auto;padding:6px 9px;margin:0" ${!v.alive || food < 1 ? "disabled" : ""} onclick="feedVirus(1)">1</button>
      <button class="menu-btn" style="width:auto;padding:6px 9px;margin:0" ${!v.alive || food < 1 ? "disabled" : ""} onclick="feedVirus(5)">5</button>
      <button class="menu-btn" style="width:auto;padding:6px 9px;margin:0" ${!v.alive || food < 1 ? "disabled" : ""} onclick="feedVirus('all')">ALL</button>
    </div>

    <div class="info-box">
      <strong>VIRUS STATUS</strong><br>
      Born: Day ${v.bornDay}<br>
      Last Fed: Day ${v.lastFedDay}<br>
      Total Fed: ${v.totalFed}<br>
      ${v.alive ? "7 days unfed = weakened. 14 days unfed = death." : "Create a new blank virus to start again."}
    </div>

    <div class="title">STATS</div>
    <div class="virus-stat-grid">${statRows}</div>
    ${!v.alive ? `<button class="menu-btn" onclick="createNewVirus()" style="text-align:center;border-color:#ffcc00;color:#ffcc00">CREATE NEW VIRUS</button>` : ""}
  `;
  drawVirusOrb();
}

function makeMarketAsset(a, historyIndex) {
  const multipliers = MARKET_HISTORY[historyIndex % MARKET_HISTORY.length];
  const history = multipliers.map(x => a.base * x);
  const price = history[history.length - 1];
  const prev = history[history.length - 2] || price;
  const change = prev > 0 ? ((price - prev) / prev * 100) : 0;
  return { ...a, price, prev, change, history, preGameHistory: [...history], eventAffected: false, lastDayChange: change };
}

function initMarket() {
  const m = G.market;
  m.stocks = STOCKS.map((s, i) => makeMarketAsset(s, i));
  m.crypto = CRYPTOS.map((c, i) => makeMarketAsset(c, i + STOCKS.length));
  m.portfolio = { stocks: {}, crypto: { DOGE: 6 } };
  m.watchlist = [];
  m._selected = null;
  m._tab = "overview";
}

function updateMarket() {
  const m = G.market;
  const move = asset => {
    asset.prev = asset.price;
    const drift = (Math.random() - 0.48) * asset.vol * asset.base;
    const spike = Math.random() < (asset.vol > 0.2 ? 0.10 : 0.05) ? (Math.random() - 0.5) * asset.base * asset.vol : 0;
    asset.price = Math.max(asset.base >= 1 ? 1 : 0.01, +(asset.price + drift + spike).toFixed(asset.base >= 1 ? 0 : 4));
    asset.change = asset.prev > 0 ? ((asset.price - asset.prev) / asset.prev * 100) : 0;
    asset.lastDayChange = asset.change;
    asset.history.push(asset.price);
    if (asset.history.length > 30) asset.history.shift();
    asset.eventAffected = false;
  };
  m.stocks.forEach(move);
  m.crypto.forEach(move);
}

function allMarketAssets() { return [...G.market.stocks, ...G.market.crypto]; }
function findMarketAsset(ticker) { return allMarketAssets().find(a => a.ticker === ticker); }
function money(v) { return v >= 1 ? "$" + Math.round(v).toLocaleString() : "$" + Number(v).toFixed(4); }
function marketPct(v) { return `${v >= 0 ? "+" : ""}${v.toFixed(1)}%`; }
function marketArrow(v) { return v > 0 ? "▲" : v < 0 ? "▼" : "—"; }
function volatilityLevel(a) { return a.vol < 0.12 ? "LOW" : a.vol < 0.25 ? "MEDIUM" : "HIGH"; }
function sentimentFor(a) {
  const h = a.history;
  const recent = h.slice(-7);
  const first = recent[0] || a.price;
  const delta = first ? (a.price - first) / first : 0;
  if (delta > 0.025) return "Bullish";
  if (delta < -0.025) return "Bearish";
  return "Neutral";
}
function primaryRiskFor(a) {
  if (a.sector === "Crypto") return "Social sentiment";
  if (a.vol >= 0.15) return "Macro";
  if (a.sector === "Tech" || a.sector === "AI") return "Earnings";
  return "Sector";
}
function riskMetrics(a) {
  const macro = a.vol >= 0.20 ? "↑↑" : a.vol >= 0.12 ? "↑" : "↓";
  const sector = a.vol >= 0.12 ? "↑" : "↓";
  const liquidity = a.volume >= 10e6 || a.sector === "Crypto" ? "↓" : "↑";
  const earnings = a.sector === "Tech" || a.sector === "AI" ? "↑↑↑" : a.vol >= 0.12 ? "↑↑" : "↑";
  const social = a.sector === "Crypto" ? (a.vol >= 0.30 ? "↑↑↑" : "↑↑") : "—";
  return { macro, sector, liquidity, earnings, social };
}
function spark(values, width) {
  const chars = "▁▂▃▄▅▆▇█";
  const vals = values.slice(-width);
  if (!vals.length) return "";
  const lo = Math.min(...vals), hi = Math.max(...vals);
  if (hi === lo) return chars[3].repeat(vals.length);
  return vals.map(v => chars[Math.max(0, Math.min(chars.length - 1, Math.round((v - lo) / (hi - lo) * (chars.length - 1))))]).join("");
}
function trendArrow(values) {
  let up = 0, down = 0;
  for (let i = 1; i < values.length; i++) {
    if (values[i] > values[i - 1]) up++; else if (values[i] < values[i - 1]) down++;
  }
  return up > down ? `↑↑↑ (${Math.min(3, up)}-day uptrend)` : down > up ? `↓↓↓ (${Math.min(3, down)}-day downtrend)` : "→ Neutral trend";
}
function sectorBoard() {
  const groups = {};
  allMarketAssets().forEach(a => {
    if (!groups[a.sector]) groups[a.sector] = [];
    groups[a.sector].push(a.change);
  });
  return Object.entries(groups).map(([sector, vals]) => {
    const avg = vals.reduce((s, v) => s + v, 0) / vals.length;
    const color = avg > 0 ? "#00ff41" : avg < 0 ? "#ff4444" : "#888";
    return `<div class="market-sector"><span>${sector}</span><span style="color:${color}">${marketArrow(avg)} ${marketPct(avg)}</span></div>`;
  }).join("");
}
function portfolioSummary() {
  const m = G.market;
  let invested = 0, value = 0, daily = 0;
  const exposure = {};
  const add = (a, qty) => {
    const cost = a.base * qty;
    invested += cost; value += a.price * qty; daily += (a.price - a.prev) * qty;
    exposure[a.sector] = (exposure[a.sector] || 0) + a.price * qty;
  };
  Object.entries(m.portfolio.stocks).forEach(([t,q]) => { const a=findMarketAsset(t); if(a) add(a,q); });
  Object.entries(m.portfolio.crypto).forEach(([t,q]) => { const a=findMarketAsset(t); if(a) add(a,q); });
  const pnl = value - invested;
  const stockVal = Object.entries(m.portfolio.stocks).reduce((s,[t,q]) => { const a=findMarketAsset(t); return s+(a?a.price*q:0); },0);
  const cryptoVal = value - stockVal;
  const ratio = value > 0 ? Math.round(stockVal / value * 100) : 0;
  const sectors = Object.entries(exposure).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`${s} ${Math.round(v/value*100)}%`).join(" · ") || "None";
  return { invested, value, pnl, daily, sectors, ratio, cryptoRatio: 100-ratio };
}

function toggleWatchlist(ticker) {

function buyStock(ticker, qty) {
  const m = G.market;
  const s = m.stocks.find(x => x.ticker === ticker);
  if (!s || qty <= 0) return;
  const cost = Math.round(s.price * qty * 100) / 100;
  if (cost > G.bank) { addLog("Not enough in bank!", "bad"); renderMarket(); return; }
  G.bank -= cost;
  m.portfolio.stocks[ticker] = (m.portfolio.stocks[ticker] || 0) + qty;
  addLog(`Bought ${qty} ${ticker} @ $${s.price.toLocaleString()}`, "good");
  renderMarket();
}

function sellStock(ticker, qty) {
  const m = G.market;
  const s = m.stocks.find(x => x.ticker === ticker);
  if (!s || qty <= 0) return;
  const held = m.portfolio.stocks[ticker] || 0;
  if (qty > held) { addLog("Not enough shares!", "bad"); renderMarket(); return; }
  const revenue = Math.round(s.price * qty * 100) / 100;
  G.bank += revenue;
  m.portfolio.stocks[ticker] -= qty;
  if (m.portfolio.stocks[ticker] <= 0) delete m.portfolio.stocks[ticker];
  addLog(`Sold ${qty} ${ticker} @ $${s.price.toLocaleString()}`, "good");
  renderMarket();

function sellCrypto(ticker, qty) {

function marketPortfolioValue() {
  const m = G.market;
  let val = 0;
  for (const [t, q] of Object.entries(m.portfolio.stocks || {})) {
    const s = m.stocks.find(x => x.ticker === t);
    if (s) val += s.price * q;
  }
  for (const [t, q] of Object.entries(m.portfolio.crypto || {})) {
    const c = m.crypto.find(x => x.ticker === t);
    if (c) val += c.price * q;
  }
  return Math.round(val * 100) / 100;
}

function doTrade(mode, drugIdx) {
  const qtyInput = document.getElementById("qty" + drugIdx);
  const qty = parseInt(qtyInput.value) || 0;
  if (qty <= 0) return;

  if (mode === "buy") {
    const atHome = G.city === G.homeCity;
    const cityLocks = G.cityDrugLocks[G.city] || [];
    if (cityLocks.includes(drugIdx)) { addLog("Drug is locked in this city today!", "bad"); renderDrugMenu(mode); refreshStats(); return; }
    const price = atHome ? Math.round(G.prices[drugIdx] * 0.9) : G.prices[drugIdx];
    const cost = qty * price;
    if (cost > G.cash) { addLog("Not enough cash!", "bad"); renderDrugMenu(mode); refreshStats(); return; }
    if (totalDrugs() + qty > G.maxCapacity) { addLog("Not enough pocket space!", "bad"); renderDrugMenu(mode); refreshStats(); return; }
    G.cash -= cost;
    G.inventory[drugIdx] += qty;
    if (atHome) G.boughtToday[drugIdx] = true;
    addLog(`Bought ${qty} ${DRUGS[drugIdx].name} for $${cost.toLocaleString()}${atHome ? " (home discount)" : ""}.`, "good");
  } else {
    if (qty > G.inventory[drugIdx]) { addLog("You don't have that many!", "bad"); renderDrugMenu(mode); refreshStats(); return; }
    if (G.boughtToday[drugIdx] && G.city === G.homeCity) { addLog("Can't sell today — bought at home today!", "bad"); renderDrugMenu(mode); refreshStats(); return; }
    if (G.unsellable.includes(drugIdx)) { addLog("Can't sell today — streets are clean!", "bad"); renderDrugMenu(mode); refreshStats(); return; }
    const atHome = G.city === G.homeCity;
    const sellPrice = atHome ? Math.round(G.prices[drugIdx] * 1.1) : G.prices[drugIdx];
    const revenue = qty * sellPrice;
    G.cash += revenue;
    G.inventory[drugIdx] -= qty;
    addLog(`Sold ${qty} ${DRUGS[drugIdx].name} for $${revenue.toLocaleString()}${atHome ? " (home bonus)" : ""}.`, "good");
  }
  renderDrugMenu(mode);
  refreshStats();
}
