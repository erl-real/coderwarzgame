<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Component Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      height: 100%;
      overflow: auto;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #ffffff;
      color: #000000;
    }
    .component-wrapper {
      width: 100%;
      height: 100%;
      padding: 0;
      box-sizing: border-box;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div class="component-wrapper">
    <html><head></head><body><div class="shader-container absolute inset-0 -z-10">
  <script type="module">
    import { Renderer, Program, Mesh, Color, Triangle } from 'https://cdn.skypack.dev/ogl';

    const vertexShader = `
    attribute vec2 uv;
    attribute vec2 position;
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position, 0, 1);
    }`;

    const fragmentShader = `
    precision highp float;
    uniform float uTime;
    uniform vec3 uColor;
    uniform vec3 uResolution;
    uniform vec2 uMouse;
    uniform float uAmplitude;
    uniform float uSpeed;
    varying vec2 vUv;
    void main() {
      float mr = min(uResolution.x, uResolution.y);
      vec2 uv = (vUv.xy * 2.0 - 1.0) * uResolution.xy / mr;
      uv += (uMouse - vec2(0.5)) * uAmplitude;
      float d = -uTime * 0.5 * uSpeed;
      float a = 0.0;
      for (float i = 0.0; i < 8.0; ++i) {
        a += cos(i - d - a * uv.x);
        d += sin(uv.y * i + a);
      }
      d += uTime * 0.5 * uSpeed;
      vec3 col = vec3(cos(uv * vec2(d, a)) * 0.6 + 0.4, cos(a + d) * 0.5 + 0.5);
      col = cos(col * cos(vec3(d, a, 2.5)) * 0.5 + 0.5) * uColor;
      gl_FragColor = vec4(col, 1.0);
    }`;

    class IridescenceShader {
        constructor(container, options = {}) {
            this.container = container;
            this.color = options.color || [1, 0.8, 0.9];
            this.speed = options.speed || 1.0;
            this.amplitude = options.amplitude || 0.15;
            this.mouseReact = options.mouseReact !== false;
            this.mousePos = { x: 0.5, y: 0.5 };
            this.init();
        }

        init() {
            this.renderer = new Renderer();
            this.gl = this.renderer.gl;
            this.gl.clearColor(0, 0, 0, 1);
            
            this.setupGeometry();
            this.setupEventListeners();
            this.resize();
            this.animate();
            
            this.container.appendChild(this.gl.canvas);
        }

        setupGeometry() {
            const geometry = new Triangle(this.gl);
            this.program = new Program(this.gl, {
                vertex: vertexShader,
                fragment: fragmentShader,
                uniforms: {
                    uTime: { value: 0 },
                    uColor: { value: new Color(...this.color) },
                    uResolution: { value: new Color(1, 1, 1) },
                    uMouse: { value: new Float32Array([0.5, 0.5]) },
                    uAmplitude: { value: this.amplitude },
                    uSpeed: { value: this.speed },
                },
            });
            this.mesh = new Mesh(this.gl, { geometry, program: this.program });
        }

        setupEventListeners() {
            this.handleResize = this.resize.bind(this);
            this.handleMouseMove = this.onMouseMove.bind(this);
            
            window.addEventListener('resize', this.handleResize);
            if (this.mouseReact) {
                this.container.addEventListener('mousemove', this.handleMouseMove);
            }
        }

        resize() {
            const rect = this.container.getBoundingClientRect();
            this.renderer.setSize(rect.width, rect.height);
            if (this.program) {
                this.program.uniforms.uResolution.value = new Color(
                    this.gl.canvas.width,
                    this.gl.canvas.height,
                    this.gl.canvas.width / this.gl.canvas.height
                );
            }
        }

        onMouseMove(e) {
            const rect = this.container.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = 1.0 - (e.clientY - rect.top) / rect.height;
            this.mousePos = { x, y };
            this.program.uniforms.uMouse.value[0] = x;
            this.program.uniforms.uMouse.value[1] = y;
        }

        animate(t = 0) {
            this.animationId = requestAnimationFrame(this.animate.bind(this));
            this.program.uniforms.uTime.value = t * 0.001;
            this.renderer.render({ scene: this.mesh });
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const container = document.querySelector('.shader-container');
        new IridescenceShader(container, {
            color: [0.8, 0.4, 1],
            speed: 0.6,
            amplitude: 0.12
        });
    });
  </script>
</div></body></html>
  </div>
  
    <script>
      (function() {
        function checkAndCenter() {
          // Use double requestAnimationFrame to ensure DOM is fully painted and layout is stable
          requestAnimationFrame(function() {
            requestAnimationFrame(function() {
              const wrapper = document.querySelector('.component-wrapper');
              if (!wrapper) return;
              
              // Get all child elements
              const children = Array.from(wrapper.children);
              if (children.length === 0) return;
              
              // Temporarily override wrapper styles to shrink-wrap for measurement
              // Set inline styles to shrink-wrap (inline styles override CSS)
              wrapper.style.display = 'inline-block';
              wrapper.style.width = 'auto';
              wrapper.style.height = 'auto';
              wrapper.style.overflow = 'visible';
              wrapper.style.boxSizing = 'content-box';
              
              // Force multiple reflows to ensure styles are fully applied
              void wrapper.offsetHeight;
              void wrapper.offsetWidth;
              void wrapper.offsetHeight;
              
              // Measure the wrapper's content size
              const contentWidth = wrapper.offsetWidth;
              const contentHeight = wrapper.offsetHeight;
              
              // Restore original styles by removing inline styles we added
              wrapper.style.removeProperty('display');
              wrapper.style.removeProperty('width');
              wrapper.style.removeProperty('height');
              wrapper.style.removeProperty('overflow');
              wrapper.style.removeProperty('box-sizing');
              
              // If content is less than 500x500, center it
              if (contentWidth > 0 && contentHeight > 0 && contentWidth < 500 && contentHeight < 500) {
                wrapper.style.display = 'flex';
                wrapper.style.alignItems = 'center';
                wrapper.style.justifyContent = 'center';
              }
            });
          });
        }
        
        // Check immediately and after delays to ensure content is rendered and styled
        function runChecks() {
          checkAndCenter();
          setTimeout(checkAndCenter, 50);
          setTimeout(checkAndCenter, 150);
          setTimeout(checkAndCenter, 300);
          setTimeout(checkAndCenter, 500);
          setTimeout(checkAndCenter, 1000);
        }
        
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', runChecks);
        } else {
          runChecks();
        }
        
        // Also check when images or other resources load
        window.addEventListener('load', () => {
          setTimeout(checkAndCenter, 100);
          setTimeout(checkAndCenter, 300);
        });
        
        // Use ResizeObserver to detect size changes
        if (window.ResizeObserver) {
          setTimeout(() => {
            const wrapper = document.querySelector('.component-wrapper');
            if (wrapper) {
              const observer = new ResizeObserver(() => {
                setTimeout(checkAndCenter, 50);
              });
              observer.observe(wrapper);
            }
          }, 500);
        }
      })();
    </script>
  
</body>
</html>
