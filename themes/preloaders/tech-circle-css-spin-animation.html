<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <title>Tech Circle CSS Spin Animation</title>
    <style>
.container{
  width:60%;
  height:60%;
  margin:auto;
  margin-top:2%;

}

#last_circle{
  animation-name: spin;
  animation-duration: 5000ms;
  animation-iteration-count: infinite;
  animation-timing-function: linear; 
  transform-origin: center ;
}

#n-1_circle{
  animation-name: spinRev;
  animation-duration: 5000ms;
  animation-iteration-count: infinite;
  animation-timing-function: linear; 
  transform-origin: center ;
}

#n-2_circle{
  animation-name: spinRev;
  animation-duration: 3s;
  animation-iteration-count: infinite;
  animation-timing-function: linear; 
  transform-origin: center ;
}

#inner_circles{
  animation-name: spin;
  animation-duration: 15s;
  animation-iteration-count: infinite;
  animation-timing-function: linear; 
  transform-origin: center ;
}

@keyframes spin {
    from {
        transform:rotate(0deg);
    }
    to {
        transform:rotate(360deg);
    }
}

@keyframes spinRev {
    from {
        transform:rotate(360deg);
    }
    to {
        transform:rotate(0deg);
    }
}
</style>
