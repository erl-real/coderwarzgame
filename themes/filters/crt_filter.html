<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CRT Scanline Filter</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #000;
            overflow: hidden;
        }

        .crt {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .crt::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03));
            z-index: 50;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        /* Preview Text */
        .preview-content {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #0f0;
            font-family: monospace;
            font-size: 2rem;
            text-shadow: 0 0 5px #0f0;
        }
    </style>
</head>
<body>
    <div class="crt">
        <div class="preview-content">
            CRT_FILTER_ACTIVE
        </div>
    </div>
</body>
</html>
