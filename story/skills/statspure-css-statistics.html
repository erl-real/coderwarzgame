#stats {

#stats:hover::before, #stats:hover::after {display:block;}

#i1sb, #v1sb, #i2sb, #v2sb, #i3sb, #v3sb, #i4sb, #v4sb, #i5sb, #v5sb, #i6sb, #v6sb {
position:absolute;
clip:rect(0 0 0 0);
-webkit-user-select:none;
-khtml-user-select:none;
-moz-user-select:none;
-o-user-select:none;
}
#stats > label {
width:20px;
float:left;
position:absolute;
bottom:0;
cursor:pointer;
-webkit-border-top-left-radius: 5px;
-webkit-border-top-right-radius: 5px;
-moz-border-radius-topleft: 5px;
-moz-border-radius-topright: 5px;
border-top-left-radius: 5px;
border-top-right-radius: 5px;
-webkit-transition:.5s ease-out;
-moz-transition:.5s ease-out;
-o-transition:.5s ease-out;
-ms-transition:.5s ease-out;
transition:.5s ease-out;
box-shadow:5px 15px 3px rgba(0,0,0,0.1);
}
#stats > label:hover {
width:35px;
}
input[type=checkbox]:checked + label {
height:100%!important;
width:35px!important;
}
input[type=checkbox]:checked + label span:nth-child(1) {
opacity:0;
-webkit-transition-delay:0;
transition-delay:0;
}
input[type=checkbox]:checked + label span:nth-child(2) {
opacity:1;
}
.ifr,.vfr {border-bottom:0;}
.ifr {border:solid 1px #ED8029;}
.vfr {border:solid 1px;}
label::before {position:absolute;margin:-20px 0px 0px -1px;}
