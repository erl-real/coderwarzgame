<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Neural Link – Advanced Tech Tree</title>
  <style>
    :root {
      --bg: #0a0b10;
      --grid: #161821;
      --panel: #11131a;
      --border: #2d2f3f;
      --fg: #e1e1e6;
      
      /* Sector Colors */
      --color-research: #ffcc33;
      --color-banking: #00d2ff;
      --color-security: #9d50bb;
      --color-virus: #ff4b2b;
      --color-transport: #8e9eab;
      --color-energy: #00ff87;
      --color-market: #f09819;
      --color-life: #ed008d;
      --color-mobility: #3efcad;
      --color-property: #ff512f;
      --color-space: #7303c0;
      --color-karma: #ffffff;

      --locked: #1a1c26;
      --available: #2c2e3f;
      --bought: #ffffff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--fg);
      font-family: 'JetBrains Mono', 'Fira Code', monospace;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* Background Grid */
    #app {
      position: relative;
      width: 100vw;
      height: 100vh;
      background-image: 
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 40px 40px;
      cursor: grab;
    }

    #app:active { cursor: grabbing; }

    /* UI Overlay */
    .ui-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1000;
    }

    .hud-top {
      padding: 30px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .stat-box {
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 15px 25px;
      pointer-events: auto;
    }

    .points-val {
      font-size: 28px;
      font-weight: 900;
      color: var(--color-research);
    }

    .points-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 2px;
      opacity: 0.5;
    }

    .karma-box {
      text-align: right;
    }

    .karma-val {
      font-size: 20px;
      font-weight: 700;
    }

    /* Viewport */
    .viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 6000px;
      height: 4000px;
      transform-origin: 0 0;
    }

    .node-connections {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .connection-line {
      stroke: rgba(255,255,255,0.02);
      stroke-width: 1.5;
      fill: none;
      transition: all 0.4s ease;
    }

    .connection-line.available {
      stroke: rgba(255,255,255,0.15);
      stroke-width: 2;
      stroke-dasharray: 5, 5;
      animation: dash-flow 2s linear infinite;
    }

    .connection-line.unlocked {
      stroke: rgba(255,255,255,0.4);
      stroke-width: 2.5;
    }

    @keyframes dash-flow {
      from { stroke-dashoffset: 10; }
      to { stroke-dashoffset: 0; }
    }

    /* Skill Nodes */
    .node {
      position: absolute;
      width: 220px;
      height: 60px;
      background: #08090d;
      border: 1px solid #1a1c26;
      padding: 10px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      cursor: not-allowed;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: auto;
      z-index: 10;
      opacity: 0.15;
      filter: grayscale(1) blur(0.5px);
    }

    .node:hover {
      z-index: 100;
    }

    .node.available {
      opacity: 1;
      filter: grayscale(0.2);
      border-color: rgba(255,255,255,0.5);
      background: #11131a;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(255,255,255,0.1);
      animation: pulse-border 2s infinite;
    }

    @keyframes pulse-border {
      0% { border-color: rgba(255,255,255,0.3); box-shadow: 0 0 0px rgba(255,255,255,0); }
      50% { border-color: rgba(255,255,255,0.8); box-shadow: 0 0 15px rgba(255,255,255,0.1); }
      100% { border-color: rgba(255,255,255,0.3); box-shadow: 0 0 0px rgba(255,255,255,0); }
    }

    .node.available:hover {
      filter: grayscale(0);
      border-color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 5px 25px rgba(0,0,0,0.9);
    }

    .node.bought {
      opacity: 1;
      filter: grayscale(0);
      background: #161821;
      border-left: 6px solid var(--bought);
      border-right: 1px solid rgba(255,255,255,0.1);
      border-top: 1px solid rgba(255,255,255,0.1);
      border-bottom: 1px solid rgba(255,255,255,0.1);
      cursor: default;
      box-shadow: 0 0 30px rgba(255,255,255,0.05);
    }

    .node.bought .node-meta {
      color: var(--color-energy);
      font-weight: 900;
    }

    .node-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: rgba(255,255,255,0.4);
    }

    .node.available .node-title,
    .node.bought .node-title {
      color: #fff;
    }

    .node-meta {
      font-size: 9px;
      opacity: 0.3;
      margin-top: 4px;
      text-transform: uppercase;
    }

    .node.available .node-meta,
    .node.bought .node-meta {
      opacity: 0.7;
    }

    /* Category Headers */
    .category-label {
      position: absolute;
      left: 40px;
      font-size: 24px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 5px;
      opacity: 0.1;
      transform: translateY(-50%);
      pointer-events: none;
    }

    /* Tooltip */
    .tooltip {
      position: fixed;
      width: 320px;
      background: var(--panel);
      border: 1px solid var(--border);
      padding: 20px;
      z-index: 2000;
      display: none;
      pointer-events: none;
      box-shadow: 20px 20px 40px rgba(0,0,0,0.6);
    }

    .tt-name { font-weight: 900; text-transform: uppercase; margin-bottom: 5px; font-size: 14px; }
    .tt-cost { color: var(--color-research); font-size: 12px; margin-bottom: 10px; }
    .tt-desc { font-size: 11px; color: rgba(255,255,255,0.7); line-height: 1.5; margin-bottom: 15px; }
    .tt-reqs { font-size: 9px; text-transform: uppercase; opacity: 0.6; border-top: 1px solid var(--border); padding-top: 10px; }

    /* Footer Controls */
    .hud-bottom {
      position: absolute;
      bottom: 30px;
      left: 30px;
      display: flex;
      gap: 15px;
      pointer-events: auto;
    }

    .btn {
      background: var(--panel);
      border: 1px solid var(--border);
      color: #fff;
      padding: 10px 20px;
      font-family: inherit;
      font-size: 10px;
      text-transform: uppercase;
      cursor: pointer;
    }

    .btn:hover { background: #fff; color: #000; }

  </style>
</head>

    const svg = document.getElementById('connections-svg');
    const pointsDisplay = document.getElementById('points-display');
    const karmaDisplay = document.getElementById('karma-display');
    const tooltip = document.getElementById('tooltip');

    function init() {
      // Setup Pan/Zoom
      let isDragging = false;
      let startPos = { x: 0, y: 0 };
      
      window.addEventListener('mousedown', (e) => {
        if (e.target.closest('.node, .btn')) return;
        isDragging = true;
        startPos = { x: e.clientX - state.pan.x, y: e.clientY - state.pan.y };
      });

      window.addEventListener('mousemove', (e) => {
        if (isDragging) {
          state.pan.x = e.clientX - startPos.x;
          state.pan.y = e.clientY - startPos.y;
          updateTransform();
        }
        if (tooltip.style.display === 'block') {
          tooltip.style.left = (e.clientX + 20) + 'px';
          tooltip.style.top = (e.clientY + 20) + 'px';
        }
      });

      window.addEventListener('mouseup', () => isDragging = false);
      window.addEventListener('wheel', (e) => {
        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        state.zoom = Math.max(0.3, Math.min(1.5, state.zoom * delta));
        updateTransform();
      });

      // Controls
      document.getElementById('btn-cheat').onclick = () => { state.rp += 50000; updateUI(); render(); };
      document.getElementById('btn-evil').onclick = () => { state.karma -= 20; updateUI(); render(); };
      document.getElementById('btn-good').onclick = () => { state.karma += 20; updateUI(); render(); };
      document.getElementById('btn-recenter').onclick = () => { state.pan = { x: 50, y: 50 }; state.zoom = 0.8; updateTransform(); };

      render();
      updateUI();
      updateTransform();
    }

    function canUnlock(node) {
      if (state.unlocked.includes(node.id)) return false;
      
      const reqsMet = node.requires.every(id => state.unlocked.includes(id));
      if (!reqsMet) return false;

      if (node.karma !== undefined) {
        if (node.karma < 0 && state.karma > node.karma) return false;
        if (node.karma > 0 && state.karma < node.karma) return false;
      }

      return true;
    }

    function render() {
      nodesContainer.innerHTML = '';
      catsContainer.innerHTML = '';
      svg.innerHTML = '';

      const X_GAP = 300;
      const Y_GAP = 120;

      // Render Category Labels
      TREE_ORDER.forEach((tree, i) => {
        const label = document.createElement('div');
        label.className = 'category-label';
        label.textContent = tree;
        label.style.top = (i * Y_GAP + 150) + 'px';
        catsContainer.appendChild(label);
      });

      SKILLS.forEach(node => {
        const treeIndex = TREE_ORDER.indexOf(node.tree);
        const x = (node.tier - 1) * X_GAP + 100;
        const y = treeIndex * Y_GAP + 120;

        // Draw Connections
        node.requires.forEach(reqId => {
          const req = SKILLS.find(s => s.id === reqId);
          if (req) {
            const reqIdx = TREE_ORDER.indexOf(req.tree);
            const x1 = (req.tier - 1) * X_GAP + 320;
            const y1 = reqIdx * Y_GAP + 150;
            const x2 = x + 100;
            const y2 = y + 30;

            const line = document.createElementNS("http://www.w3.org/2000/svg", "path");
            // Curved "Sideways" connection
            const d = `M ${x1} ${y1} C ${x1 + 100} ${y1}, ${x2 - 100} ${y2}, ${x2} ${y2}`;
            line.setAttribute('d', d);
            
            let cls = 'connection-line';
            if (state.unlocked.includes(node.id)) cls += ' unlocked';
            else if (canUnlock(node)) cls += ' available';
            line.setAttribute('class', cls);
            svg.appendChild(line);
          }
        });

        // Hide Hidden nodes unless available or bought
        if (node.isHidden && !canUnlock(node) && !state.unlocked.includes(node.id)) return;

        // Render Node
        const el = document.createElement('div');
        el.className = `node ${state.unlocked.includes(node.id) ? 'bought' : ''} ${canUnlock(node) ? 'available' : ''}`;
        el.style.left = x + 'px';
        el.style.top = y + 'px';
        el.style.borderLeftColor = `var(--color-${node.tree.toLowerCase().split(' ')[0]})`;

        el.innerHTML = `
          <div class="node-title">${node.title}</div>
          <div class="node-meta">Tier ${node.tier} • ${node.cost} RP</div>
        `;

        el.onmouseenter = (e) => showTooltip(node, e);
        el.onmouseleave = hideTooltip;
        el.onclick = () => tryUnlock(node);

        nodesContainer.appendChild(el);
      });
    }

    function tryUnlock(node) {
      if (canUnlock(node) && state.rp >= node.cost) {
        state.rp -= node.cost;
        state.unlocked.push(node.id);
        render();
        updateUI();
      }
    }

    function updateUI() {
      pointsDisplay.textContent = state.rp.toLocaleString();
      let kText = state.karma === 0 ? "Neutral" : (state.karma > 0 ? "Honorable" : "Notorious");
      karmaDisplay.textContent = `${kText} (${state.karma})`;
      karmaDisplay.style.color = state.karma === 0 ? '#fff' : (state.karma > 0 ? 'var(--color-energy)' : 'var(--color-virus)');
    }

    function updateTransform() {
      viewport.style.transform = `translate(${state.pan.x}px, ${state.pan.y}px) scale(${state.zoom})`;
    }

    function showTooltip(node, e) {
      document.getElementById('tt-name').textContent = node.title;
      document.getElementById('tt-name').style.color = `var(--color-${node.tree.toLowerCase().split(' ')[0]})`;
      document.getElementById('tt-cost').textContent = `Cost: ${node.cost.toLocaleString()} RP`;
      document.getElementById('tt-desc').textContent = node.desc;
      
      const reqs = node.requires.length > 0 ? node.requires.map(id => SKILLS.find(s => s.id === id).title).join(', ') : 'None';
      const karmaText = node.karma !== undefined ? ` • Karma: ${node.karma}` : '';
      document.getElementById('tt-reqs').textContent = `Requires: ${reqs}${karmaText}`;

      tooltip.style.display = 'block';
    }

    function hideTooltip() {
      tooltip.style.display = 'none';
    }

    init();
  </script>
</body>
</html>
