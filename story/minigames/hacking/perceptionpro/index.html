<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PERCEPTION PRO // NEURAL_LINK_TEST</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap');
        body { font-family: 'JetBrains Mono', monospace; background: #020305; color: #fff; overflow: hidden; }
        .win-dark { background: #0a0b0e; border: 1px solid rgba(255,255,255,0.1); color: #fff; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
        .target-box { background: #000; border: 4px solid #3b82f6; box-shadow: 0 0 30px rgba(59, 130, 246, 0.2); }
        .tile { aspect-ratio: 1; background: #1a1b1e; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: all 0.1s; display: flex; items-center; justify-content: center; font-size: 32px; font-weight: 900; }
        .tile:hover { background: rgba(59, 130, 246, 0.1); border-color: #3b82f6; }
        .tile:active { transform: scale(0.95); }
        .crt::before { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.15) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); z-index: 50; background-size: 100% 2px, 3px 100%; pointer-events: none; }
        .stat-glow { text-shadow: 0 0 10px currentColor; }
    </style>
</head>
<body x-data="gameEngine()" x-init="init()" class="h-screen flex flex-col p-4 md:p-8 crt">

    <!-- Header HUD -->
    <div class="h-16 shrink-0 flex items-center justify-between px-6 win-dark border-b border-blue-500/20 mb-6 rounded-2xl bg-black/80 backdrop-blur-xl">
        <div class="flex items-center gap-8">
            <div class="flex items-center gap-4">
                <div class="w-10 h-10 rounded-xl bg-blue-500/10 border border-blue-500/20 flex items-center justify-center text-blue-400">
                    <i data-lucide="eye" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black italic tracking-tighter text-blue-400 uppercase">Perception_Pro</h1>
                    <p class="text-[8px] text-white/30 uppercase tracking-[0.4em]">Neural-Latency-v4.0</p>
                </div>
            </div>
            
            <div class="flex gap-10">
                <div class="flex flex-col">
                    <span class="text-[8px] uppercase font-black text-white/30">System_Score</span>
                    <span class="text-sm font-bold text-emerald-400 stat-glow" x-text="score">0</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-[8px] uppercase font-black text-white/30">Combo_Stream</span>
                    <span class="text-sm font-bold text-blue-400 stat-glow" x-text="combo + 'x'">0x</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-[8px] uppercase font-black text-white/30">Buffer_Time</span>
                    <div class="w-24 h-1.5 bg-white/5 rounded-full mt-1.5 overflow-hidden">
                        <div class="h-full bg-rose-500" :style="'width: ' + (time / 10 * 100) + '%'"></div>
                    </div>
                </div>
            </div>
        </div>

        <button @click="start()" class="h-10 px-8 bg-blue-500 text-black font-black text-[10px] uppercase tracking-widest hover:bg-blue-400 transition-all active:scale-95" x-show="!gameActive">
            START_TEST
        </button>
    </div>

    <!-- Main Game Area -->
    <div class="flex-1 flex flex-col items-center justify-center gap-12">
        
        <!-- Target Symbol -->
        <div class="target-box w-32 h-32 rounded-3xl flex items-center justify-center animate-in fade-in zoom-in duration-300">
            <span class="text-6xl font-black text-blue-400 stat-glow" x-text="target">?</span>
        </div>

        <!-- Grid of Options -->
        <div class="grid grid-cols-3 gap-4 w-full max-w-md">
            <template x-for="sym in options">
                <div class="tile rounded-2xl" @click="check(sym)" x-text="sym"></div>
            </template>
        </div>

    </div>

    <!-- Ticker Overlay -->
    <div class="h-8 shrink-0 flex items-center px-6 border-t border-white/5 bg-black/40 overflow-hidden">
        <div class="text-[9px] font-black text-blue-400/60 uppercase tracking-widest italic" x-text="tickerMsg">MONITORING_NEURAL_LATENCY...</div>
    </div>

    <script>
        function gameEngine() {
            return {
                data: { sets: [] },
                gameActive: false,
                score: 0,
                combo: 0,
                time: 10,
                target: '?',
                options: [],
                tickerMsg: "SYSTEM READY.",
                
                async init() {
                    const res = await fetch('gamedata.json');
                    this.data = await res.json();
                    lucide.createIcons();
                },

                start() {
                    this.gameActive = true;
                    this.score = 0;
                    this.combo = 0;
                    this.time = 10;
                    this.nextRound();
                    this.timer();
                },

                nextRound() {
                    const set = this.data.sets[Math.floor(Math.random() * this.data.sets.length)];
                    this.options = [...set.symbols].sort(() => Math.random() - 0.5).slice(0, 9);
                    this.target = this.options[Math.floor(Math.random() * this.options.length)];
                    this.tickerMsg = "NEW_TARGET_ACQUIRED.";
                },

                check(sym) {
                    if (!this.gameActive) return;
                    if (sym === this.target) {
                        this.score += 100 * (Math.floor(this.combo / 5) + 1);
                        this.combo++;
                        this.time = Math.min(10, this.time + 0.5);
                        this.nextRound();
                    } else {
                        this.combo = 0;
                        this.time -= 2;
                        this.tickerMsg = "INVALID_MATCH. BUFFER_LOSS.";
                    }
                },

                timer() {
                    if (!this.gameActive) return;
                    setTimeout(() => {
                        this.time -= 0.1;
                        if (this.time <= 0) this.gameOver();
                        else this.timer();
                    }, 100);
                },

                gameOver() {
                    this.gameActive = false;
                    alert("TEST COMPLETE // FINAL SCORE: " + this.score);
                    location.reload();
                }
            }
        }
    </script>
</body>
</html>
