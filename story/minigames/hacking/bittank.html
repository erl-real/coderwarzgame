<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4_ARENA // TANK_COMBAT</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: monospace; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { border: 2px solid #333; background: #050505; }
        .ui { margin-bottom: 10px; font-size: 14px; font-weight: bold; color: #fff; }
    </style>
</head>
<body>
    <div class="ui">UNIT_KILLS: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="600" height="400"></canvas>
    <div style="margin-top:10px; font-size:10px; color:#444">ARROWS TO STEER // SPACE TO FIRE</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        let score = 0;
        let player = { x: 300, y: 200, angle: 0, bullets: [] };
        let enemies = [];
        let keys = {};
        let gameOver = false;

        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function spawnEnemy() {
            if (enemies.length < 3 && !gameOver) {
                enemies.push({
                    x: Math.random() < 0.5 ? -20 : 620,
                    y: Math.random() * 400,
                    angle: Math.random() * Math.PI * 2
                });
            }
        }

        function update() {
            if (gameOver) return;

            if (keys['ArrowLeft']) player.angle -= 0.05;
            if (keys['ArrowRight']) player.angle += 0.05;
            if (keys['ArrowUp']) {
                player.x += Math.cos(player.angle) * 2;
                player.y += Math.sin(player.angle) * 2;
            }

            if (keys['Space'] && player.bullets.length < 3) {
                player.bullets.push({ x: player.x, y: player.y, angle: player.angle, life: 60 });
                keys['Space'] = false;
            }

            player.bullets.forEach((b, i) => {
                b.x += Math.cos(b.angle) * 5;
                b.y += Math.sin(b.angle) * 5;
                b.life--;
                if (b.life <= 0) player.bullets.splice(i, 1);

                enemies.forEach((e, ei) => {
                    const dx = b.x - e.x, dy = b.y - e.y;
                    if (Math.sqrt(dx*dx + dy*dy) < 20) {
                        enemies.splice(ei, 1);
                        player.bullets.splice(i, 1);
                        score++;
                        scoreEl.textContent = score;
                    }
                });
            });

            enemies.forEach(e => {
                const dx = player.x - e.x, dy = player.y - e.y;
                const ang = Math.atan2(dy, dx);
                e.angle += (ang - e.angle) * 0.02;
                e.x += Math.cos(e.angle) * 1;
                e.y += Math.sin(e.angle) * 1;

                if (Math.sqrt(dx*dx + dy*dy) < 20) gameOver = true;
            });

            if (Math.random() < 0.01) spawnEnemy();
        }

        function draw() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Player
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            ctx.fillStyle = '#3b82f6';
            ctx.fillRect(-10, -10, 20, 20);
            ctx.fillStyle = '#1e3a8a';
            ctx.fillRect(0, -2, 15, 4);
            ctx.restore();

            // Enemies
            enemies.forEach(e => {
                ctx.save();
                ctx.translate(e.x, e.y);
                ctx.rotate(e.angle);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(-10, -10, 20, 20);
                ctx.restore();
            });

            // Bullets
            ctx.fillStyle = '#fff';
            player.bullets.forEach(b => ctx.fillRect(b.x-2, b.y-2, 4, 4));

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, 600, 400);
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.fillText('UNIT_DESTROYED', 300, 200);
                ctx.fillText('CLICK TO RE-SPAWN', 300, 230);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        canvas.addEventListener('click', () => {
            if (gameOver) {
                gameOver = false; score = 0; scoreEl.textContent = '0';
                player = { x: 300, y: 200, angle: 0, bullets: [] };
                enemies = [];
            }
        });

        loop();
    </script>
</body>
</html>
