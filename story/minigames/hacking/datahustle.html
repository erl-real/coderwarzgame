<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DATA_HUSTLE // BIT_COLLECTOR</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: monospace; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        canvas { border: 2px solid #f59e0b; background: #0a0a0a; }
        .ui { margin-bottom: 10px; font-size: 14px; font-weight: bold; color: #f59e0b; }
    </style>
</head>
<body>
    <div class="ui">PACKETS_COLLECTED: <span id="score">0</span></div>
    <canvas id="gameCanvas" width="400" height="500"></canvas>
    <div style="margin-top:10px; font-size:10px; color:#444">MOUSE TO MOVE // CATCH ALL INCOMING BITS</div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');

        let score = 0;
        let player = { x: 200, y: 450, w: 60, h: 10 };
        let bits = [];
        let gameOver = false;

        canvas.addEventListener('mousemove', e => {
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left - player.w/2;
            player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
        });

        function spawnBit() {
            if (bits.length < 10 && !gameOver) {
                bits.push({
                    x: Math.random() * (canvas.width - 10),
                    y: -20,
                    speed: 2 + Math.random() * 3,
                    color: Math.random() < 0.1 ? '#f00' : '#f59e0b'
                });
            }
        }

        function update() {
            if (gameOver) return;

            bits.forEach((bit, i) => {
                bit.y += bit.speed;
                if (bit.y > 500) {
                    if (bit.color !== '#f00') gameOver = true; // Missed a good bit
                    bits.splice(i, 1);
                }

                if (bit.y + 10 > player.y && bit.x + 10 > player.x && bit.x < player.x + player.w) {
                    if (bit.color === '#f00') gameOver = true; // Caught a virus
                    else {
                        bits.splice(i, 1);
                        score++;
                        scoreEl.textContent = score;
                    }
                }
            });

            if (Math.random() < 0.05) spawnBit();
        }

        function draw() {
            ctx.fillStyle = '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Player
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(player.x, player.y, player.w, player.h);

            // Bits
            bits.forEach(b => {
                ctx.fillStyle = b.color;
                ctx.fillRect(b.x, b.y, 8, 8);
            });

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.8)';
                ctx.fillRect(0, 0, 400, 500);
                ctx.fillStyle = '#fff';
                ctx.textAlign = 'center';
                ctx.fillText('DATA_STREAM_CORRUPTED', 200, 250);
                ctx.fillText('CLICK TO RESET', 200, 280);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        canvas.addEventListener('click', () => {
            if (gameOver) {
                gameOver = false; score = 0; bits = [];
                scoreEl.textContent = '0';
            }
        });

        loop();
    </script>
</body>
</html>
