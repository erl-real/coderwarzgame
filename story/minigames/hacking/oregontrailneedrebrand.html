<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OREGON_TRAIL // DATA_MIGRATION</title>
    <style>
        body { margin: 0; background: #000; color: #fff; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        .console { width: 500px; height: 300px; background: #050505; border: 2px solid #333; padding: 20px; overflow-y: auto; font-size: 14px; }
        .stats { margin-bottom: 10px; width: 500px; display: flex; justify-content: space-between; font-weight: bold; color: #f59e0b; }
        .controls { margin-top: 20px; display: flex; gap: 10px; }
        .btn { background: #222; border: 1px solid #444; color: #fff; padding: 10px; cursor: pointer; }
        .btn:hover { border-color: #f59e0b; }
    </style>
</head>
<body>
    <div class="stats">
        <span>DIST: <span id="dist">2000</span>mi</span>
        <span>FOOD: <span id="food">500</span>lbs</span>
        <span>HEALTH: <span id="hp">100</span>%</span>
    </div>
    <div class="console" id="log">
        <div>INITIATING DATA MIGRATION TO OREGON SERVER...</div>
        <div>YOU HAVE 2000 MILES TO GO.</div>
    </div>
    <div class="controls">
        <button class="btn" onclick="takeStep()">Continue</button>
        <button class="btn" onclick="hunt()">Scavenge Data</button>
        <button class="btn" onclick="rest()">Rest Nodes</button>
    </div>

    <script>
        const logEl = document.getElementById('log');
        let dist = 2000, food = 500, hp = 100;

        function print(msg) {
            const div = document.createElement('div');
            div.textContent = msg;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function takeStep() {
            if (dist <= 0 || hp <= 0) return;
            const move = 30 + Math.floor(Math.random() * 50);
            dist -= move;
            food -= 20;
            hp -= Math.floor(Math.random() * 5);
            
            print(`Traveled ${move} miles. Current distance: ${dist}mi`);
            if (Math.random() < 0.1) {
                print("EVENT: Packet loss detected! Health decreased.");
                hp -= 10;
            }
            update();
        }

        function hunt() {
            const find = 50 + Math.floor(Math.random() * 100);
            food += find;
            print(`Scavenged ${find}lbs of food.`);
            takeStep();
        }

        function rest() {
            hp = Math.min(100, hp + 20);
            food -= 10;
            print("Resting nodes... Health restored.");
            update();
        }

        function update() {
            document.getElementById('dist').textContent = dist;
            document.getElementById('food').textContent = food;
            document.getElementById('hp').textContent = hp;

            if (dist <= 0) print("SUCCESS: OREGON SERVER REACHED. DATA SECURE.");
            if (hp <= 0) print("CRITICAL: SYSTEM TOTAL FAILURE. CONNECTION LOST.");
            if (food <= 0) { print("WARNING: Food depleted. Health dropping rapidly."); hp -= 20; }
        }
    </script>
</body>
</html>
