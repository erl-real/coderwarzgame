<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TANK-8 // ABANDONWARE</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', Courier, monospace; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        canvas { border: 2px solid #333; background: #050505; box-shadow: 0 0 20px rgba(0, 255, 0, 0.1); }
        .ui { position: absolute; top: 10px; left: 10px; pointer-events: none; }
        .controls { position: absolute; bottom: 10px; right: 10px; font-size: 10px; color: #555; }
    </style>
</head>
<body>
    <div class="ui">
        <div>SCORE: <span id="score">0000</span></div>
        <div>LIVES: <span id="lives">3</span></div>
    </div>
    <div class="controls">WASD TO MOVE // SPACE TO FIRE</div>
    <canvas id="gameCanvas" width="600" height="400"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');

        let score = 0;
        let lives = 3;
        let gameOver = false;

        const player = {
            x: 300, y: 350, w: 20, h: 20, angle: 0, speed: 0, 
            rotateSpeed: 0.05, maxSpeed: 3, friction: 0.95,
            bullets: []
        };

        const enemies = [];
        const particles = [];

        const keys = {};
        window.addEventListener('keydown', e => keys[e.code] = true);
        window.addEventListener('keyup', e => keys[e.code] = false);

        function spawnEnemy() {
            if (enemies.length < 5) {
                enemies.push({
                    x: Math.random() * canvas.width,
                    y: -20,
                    w: 20, h: 20,
                    speed: 1 + Math.random() * 2,
                    health: 1
                });
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 10; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 5,
                    vy: (Math.random() - 0.5) * 5,
                    life: 1,
                    color
                });
            }
        }

        function update() {
            if (gameOver) return;

            // Player movement
            if (keys['KeyA']) player.angle -= player.rotateSpeed;
            if (keys['KeyD']) player.angle += player.rotateSpeed;
            if (keys['KeyW']) player.speed = player.maxSpeed;
            else if (keys['KeyS']) player.speed = -player.maxSpeed / 2;
            else player.speed *= player.friction;

            player.x += Math.cos(player.angle - Math.PI/2) * player.speed;
            player.y += Math.sin(player.angle - Math.PI/2) * player.speed;

            // Bounds
            player.x = Math.max(10, Math.min(canvas.width - 10, player.x));
            player.y = Math.max(10, Math.min(canvas.height - 10, player.y));

            // Shooting
            if (keys['Space'] && player.bullets.length < 3) {
                player.bullets.push({
                    x: player.x, y: player.y,
                    vx: Math.cos(player.angle - Math.PI/2) * 7,
                    vy: Math.sin(player.angle - Math.PI/2) * 7,
                    life: 60
                });
                keys['Space'] = false; // Semi-auto
            }

            // Update bullets
            player.bullets.forEach((b, i) => {
                b.x += b.vx;
                b.y += b.vy;
                b.life--;
                if (b.life <= 0) player.bullets.splice(i, 1);
            });

            // Update enemies
            enemies.forEach((e, i) => {
                e.y += e.speed;
                if (e.y > canvas.height + 20) enemies.splice(i, 1);

                // Collision with player
                const dx = e.x - player.x;
                const dy = e.y - player.y;
                if (Math.sqrt(dx*dx + dy*dy) < 20) {
                    enemies.splice(i, 1);
                    lives--;
                    livesEl.textContent = lives;
                    createExplosion(player.x, player.y, '#f00');
                    if (lives <= 0) gameOver = true;
                }

                // Collision with bullets
                player.bullets.forEach((b, bi) => {
                    const bdx = e.x - b.x;
                    const bdy = e.y - b.y;
                    if (Math.sqrt(bdx*bdx + bdy*bdy) < 15) {
                        enemies.splice(i, 1);
                        player.bullets.splice(bi, 1);
                        score += 100;
                        scoreEl.textContent = score.toString().padStart(4, '0');
                        createExplosion(e.x, e.y, '#0f0');
                    }
                });
            });

            // Update particles
            particles.forEach((p, i) => {
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.02;
                if (p.life <= 0) particles.splice(i, 1);
            });

            if (Math.random() < 0.02) spawnEnemy();
        }

        function draw() {
            ctx.fillStyle = '#050505';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = '#111';
            for(let i=0; i<canvas.width; i+=40) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i,canvas.height); ctx.stroke(); }
            for(let i=0; i<canvas.height; i+=40) { ctx.beginPath(); ctx.moveTo(0,i); ctx.lineTo(canvas.width,i); ctx.stroke(); }

            // Draw player
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            ctx.fillStyle = '#0f0';
            ctx.fillRect(-10, -10, 20, 20);
            ctx.fillStyle = '#0a0';
            ctx.fillRect(-2, -15, 4, 15);
            ctx.restore();

            // Draw bullets
            ctx.fillStyle = '#fff';
            player.bullets.forEach(b => ctx.fillRect(b.x-2, b.y-2, 4, 4));

            // Draw enemies
            ctx.fillStyle = '#f00';
            enemies.forEach(e => {
                ctx.fillRect(e.x-10, e.y-10, 20, 20);
                ctx.fillStyle = '#800';
                ctx.fillRect(e.x-2, e.y, 4, 10);
                ctx.fillStyle = '#f00';
            });

            // Draw particles
            particles.forEach(p => {
                ctx.globalAlpha = p.life;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x-1, p.y-1, 2, 2);
            });
            ctx.globalAlpha = 1;

            if (gameOver) {
                ctx.fillStyle = 'rgba(0,0,0,0.7)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = '#f00';
                ctx.font = '30px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText('SYSTEM HALTED', 300, 200);
                ctx.font = '15px Courier New';
                ctx.fillText('PRESS R TO REBOOT', 300, 230);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        window.addEventListener('keydown', e => {
            if (e.code === 'KeyR' && gameOver) {
                score = 0;
                lives = 3;
                gameOver = false;
                scoreEl.textContent = '0000';
                livesEl.textContent = '3';
                enemies.length = 0;
                player.x = 300; player.y = 350;
            }
        });

        loop();
    </script>
</body>
</html>
