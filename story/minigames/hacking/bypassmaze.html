<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MAZE_RUNNER // BUFFER OVERFLOW</title>
    <style>
        body { margin: 0; background: #000; color: #0f0; font-family: 'Courier New', Courier, monospace; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        canvas { border: 2px solid #0f0; box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); }
        .ui { margin-bottom: 10px; font-size: 14px; text-transform: uppercase; letter-spacing: 2px; }
        .timer { color: #f00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="ui">ACCESSING_KERNEL_MEMORY... <span id="timer" class="timer">30.00</span>s</div>
    <canvas id="mazeCanvas" width="400" height="400"></canvas>
    <div class="ui" style="margin-top:10px; font-size:10px; color:#444">ARROW KEYS TO MANEUVER // ESCAPE THE BUFFER</div>

    <script>
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');
        const timerEl = document.getElementById('timer');

        const cols = 20, rows = 20, size = 20;
        let grid = [];
        let current;
        let stack = [];
        let player = { x: 0, y: 0 };
        let goal = { x: 19, y: 19 };
        let timeLeft = 30;
        let gameActive = true;

        class Cell {
            constructor(r, c) {
                this.r = r; this.c = c;
                this.walls = [true, true, true, true]; // top, right, bottom, left
                this.visited = false;
            }
            show() {
                let x = this.c * size, y = this.r * size;
                ctx.strokeStyle = '#0f0';
                ctx.lineWidth = 2;
                if (this.walls[0]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + size, y); ctx.stroke(); }
                if (this.walls[1]) { ctx.beginPath(); ctx.moveTo(x + size, y); ctx.lineTo(x + size, y + size); ctx.stroke(); }
                if (this.walls[2]) { ctx.beginPath(); ctx.moveTo(x + size, y + size); ctx.lineTo(x, y + size); ctx.stroke(); }
                if (this.walls[3]) { ctx.beginPath(); ctx.moveTo(x, y + size); ctx.lineTo(x, y); ctx.stroke(); }
            }
        }

        function initMaze() {
            grid = [];
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    grid.push(new Cell(r, c));
                }
            }
            current = grid[0];
            generateMaze();
        }

        function generateMaze() {
            while (true) {
                current.visited = true;
                let next = getNeighbor(current);
                if (next) {
                    next.visited = true;
                    stack.push(current);
                    removeWalls(current, next);
                    current = next;
                } else if (stack.length > 0) {
                    current = stack.pop();
                } else {
                    break;
                }
            }
        }

        function getNeighbor(cell) {
            let neighbors = [];
            let r = cell.r, c = cell.c;
            let top = grid[index(r - 1, c)], right = grid[index(r, c + 1)], bottom = grid[index(r + 1, c)], left = grid[index(r, c - 1)];
            if (top && !top.visited) neighbors.push(top);
            if (right && !right.visited) neighbors.push(right);
            if (bottom && !bottom.visited) neighbors.push(bottom);
            if (left && !left.visited) neighbors.push(left);
            return neighbors.length > 0 ? neighbors[Math.floor(Math.random() * neighbors.length)] : undefined;
        }

        function index(r, c) {
            if (r < 0 || c < 0 || r > rows - 1 || c > cols - 1) return -1;
            return c + r * cols;
        }

        function removeWalls(a, b) {
            let x = a.c - b.c;
            if (x === 1) { a.walls[3] = false; b.walls[1] = false; }
            else if (x === -1) { a.walls[1] = false; b.walls[3] = false; }
            let y = a.r - b.r;
            if (y === 1) { a.walls[0] = false; b.walls[2] = false; }
            else if (y === -1) { a.walls[2] = false; b.walls[0] = false; }
        }

        function draw() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            grid.forEach(c => c.show());

            // Goal
            ctx.fillStyle = '#f00';
            ctx.fillRect(goal.x * size + 4, goal.y * size + 4, size - 8, size - 8);

            // Player
            ctx.fillStyle = '#fff';
            ctx.shadowBlur = 10; ctx.shadowColor = '#fff';
            ctx.beginPath();
            ctx.arc(player.x * size + size / 2, player.y * size + size / 2, size / 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
        }

        window.addEventListener('keydown', e => {
            if (!gameActive) return;
            let cell = grid[index(player.y, player.x)];
            if (e.key === 'ArrowUp' && !cell.walls[0]) player.y--;
            if (e.key === 'ArrowRight' && !cell.walls[1]) player.x++;
            if (e.key === 'ArrowDown' && !cell.walls[2]) player.y++;
            if (e.key === 'ArrowLeft' && !cell.walls[3]) player.x--;

            if (player.x === goal.x && player.y === goal.y) {
                gameActive = false;
                alert('ACCESS GRANTED // KERNEL EXFILTRATED');
                location.reload();
            }
            draw();
        });

        function updateTimer() {
            if (!gameActive) return;
            timeLeft -= 0.01;
            timerEl.textContent = timeLeft.toFixed(2);
            if (timeLeft <= 0) {
                gameActive = false;
                alert('CONNECTION RESET // TRACE DETECTED');
                location.reload();
            }
            setTimeout(updateTimer, 10);
        }

        initMaze();
        draw();
        updateTimer();
    </script>
</body>
</html>
