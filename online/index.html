                key: 'energy_max',
                label: 'Max Energy',
                note: 'More energy = more jobs before you have to wait for regen.',
                get: function () { return gVal('energyMax') || 100; },
                set: function (v) { setG('energyMax', Math.max(1, Math.floor(v))); }
            },
            {
                key: 'stamina_max',
                label: 'Max Stamina',
                note: 'More stamina = more fights before you have to rest.',
                get: function () { return gVal('staminaMax') || 100; },
                set: function (v) { setG('staminaMax', Math.max(1, Math.floor(v))); }
            }
        ];

        function buySkillPoint(statKey) {
            var stat = null;
            for (var i = 0; i < SPENDABLE_STATS.length; i++) {
                if (SPENDABLE_STATS[i].key === statKey) stat = SPENDABLE_STATS[i];
            }
            if (!stat) return false;
            if (skillPointsAvailable() < 1) {
                if (typeof addLog === 'function') addLog('No skill points available.', 'bad');
                if (typeof renderSkills === 'function') renderSkills();
                return false;
            }
            stat.set(stat.get() + 1);
            setG('skillPointsSpent', skillPointsSpent() + 1);
            if (typeof addLog === 'function') addLog(stat.label + ' raised to ' + stat.get() + '.', 'good');
            /* player-caused change: persist now rather than waiting on drift */
            if (typeof queueSave === 'function') queueSave();
            if (typeof renderSynced === 'function') renderSynced();
            if (typeof renderSkills === 'function') renderSkills();
            return true;
        }

        /* ── ENERGY ─────────────────────────────────────────────────
           Energy is derived, never stored outright. The real value is
           (energy + time elapsed since energyTs), so energyTs has to travel
           with it or offline regen is lost on reload. Re-derived lazily on
           every read, so it keeps ticking with the tab closed and needs no
           timer. Defined here, at top level, because the synced-field layer
           and renderHome both read it. */
        var ENERGY_MS = 60000;   /* one point of energy a minute */

        function playerEnergy() {
            var max = gVal('energyMax') || 100;
            var now = Date.now();
            var e = gVal('energy');
            if (e == null) { setG('energy', max); setG('energyTs', now); return max; }
            if (!gVal('energyTs')) setG('energyTs', now);
            e = e + (now - gVal('energyTs')) / ENERGY_MS;
            if (e >= max) { e = max; setG('energyTs', now); }
            setG('energy', e);
            return e;
        }

        /* Every fight costs the same, by design — one point, always. Easier to
           reason about than per-target costs, and it keeps the HUD honest. */
        var FIGHT_STAMINA_COST = 1;

        /* ── STAMINA ────────────────────────────────────────────────
           Combat resource only. Energy pays for jobs; stamina pays for
           fighting (PvP, NPC fighters, servers) and heists. Boss-tier jobs
           like Cold Storage stay on energy, so the two never compete.

           Same derivation shape as energy — value plus the moment it was
           measured — but five times slower to regenerate, which is what
           keeps the two bars feeling like different resources. */
        var STAMINA_MS = 300000;   /* one point of stamina every 5 minutes */

        function playerStamina() {
            var max = gVal('staminaMax') || 100;
            var now = Date.now();
            var s = gVal('stamina');
            if (s == null) { setG('stamina', max); setG('staminaTs', now); return max; }
            if (!gVal('staminaTs')) setG('staminaTs', now);
            s = s + (now - gVal('staminaTs')) / STAMINA_MS;
            if (s >= max) { s = max; setG('staminaTs', now); }
            setG('stamina', s);
            return s;
        }

        /* Returns false (and logs) when there isn't enough, so every combat
           entry point can bail the same way. Spending is player-caused, so
           it queues a save rather than waiting for the drift check. */
        function staminaSpend(n) {
            n = Math.max(0, Math.floor(n || 0));
            if (n === 0) return true;
            if (playerStamina() - n < 0) {
                if (typeof addLog === 'function') {
                    var mins = Math.ceil((n - playerStamina()) * STAMINA_MS / 60000);
                    addLog('Too exhausted to fight. Stamina returns in about ' + mins + ' min.', 'bad');
                }
                return false;
            }
            setG('stamina', Math.max(0, playerStamina() - n));
            setG('staminaTs', Date.now());
            if (typeof queueSave === 'function') queueSave();
            return true;
        }

        /* player-editable text goes through this before landing in markup */
        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }
        /* attribute values are escaped the same way; the quotes matter most */
        function escapeAttr(s) { return escapeHtml(s); }

        var NAME_MIN = 3, NAME_MAX = 24;

        function cleanName(raw) {
            /* control characters become spaces so words don't fuse together,
               then collapse runs of whitespace and trim */
            return String(raw == null ? '' : raw)
                .replace(/[\x00-\x1f\x7f]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim()
                .slice(0, NAME_MAX);
        }

        /* Apply the stored audio preferences before the first paint, so the mute
               button and slider positions are right the moment Settings opens
               rather than only after the user drags something. */
        loadAudio();

        function saveDisplayName() {
            var input = document.getElementById('name-input');
            if (!input) { closePopup(); return; }
            var name = cleanName(input.value);
            if (name.length < NAME_MIN) {
                alert('Your name needs at least ' + NAME_MIN + ' characters.');
                input.focus();
                return;
            }
            FIELDS.display_name.set(name);
            /* repaint everywhere the name appears, then queue the write */
            renderSynced();
            snapshotShown();
            queueSave();
            closePopup();
        }

        function gVal(k) {
            var g = (typeof TRAP !== 'undefined' && TRAP.G) ? TRAP.G : null;
            return g ? g[k] : 0;
        }

        function setG(k, v) {
            var g = (typeof TRAP !== 'undefined' && TRAP.G) ? TRAP.G : null;
            if (g) g[k] = v;
        }

        /* Paints the synced values. Driven off the clock tick so every
           mutation site is picked up without editing them one by one. */
        function renderSynced() {
            SYNCED.forEach(function (k) {
                if (FIELDS[k].noMirror) return;
                var txt = (FIELDS[k].fmt || money)(FIELDS[k].get());
                (MIRROR[k] || []).forEach(function (sel) {
                    var el = document.querySelector(sel);
                    if (el) el.textContent = txt;
                });
            });
            renderEnergyBar();
            paintStaminaBar();
            paintHealthBar();
            paintXpBar();
            paintAvatar();
            paintFrame();
            paintPockets();
            paintNavCrew();
            /* the device list lives in the side bar now, not behind a tab, so
               it is repainted on the same tick as everything else */
            if (typeof renderDevices === 'function') renderDevices();
        }

        /* Pockets counter. Kept out of the MIRROR table on purpose - that path
           formats the raw field, and max_capacity is the ceiling, not the
           count. Painted here so it still updates on the clock tick the way
           the mirror used to, and reads as "carried / max". */
        function paintPockets() {
            var el = document.getElementById('inv-slots');
            if (!el) return;
            /* Reads G directly rather than calling totalDrugs(): that helper
               lives inside the game IIFE, and renderSynced() is outside it, so
               the call threw ReferenceError on every clock tick. */
            var inv = TRAP.G.inventory || [];
            var carried = inv.reduce(function (a, b) { return a + b; }, 0);
            var txt = carried + ' / ' + TRAP.G.maxCapacity;
            if (el.textContent !== txt) el.textContent = txt;
        }

        /* The hero picture lives inside the hero button's innerHTML and is not
           one of the mirrored text nodes, so avatar is noMirror and never gets
           painted by the loop above. Rewrite the src directly instead: without
           this, a load that restores a different avatar leaves the old picture
           on screen until something else re-renders the hero. */
        function paintAvatar() {
            var url = avatarUrl(loadAvatar());
            /* :not(.pfp-frame) matters now that the frame is a second <img>
               inside the same button - a bare descendant selector would pick
               the frame and overwrite the frame's src with the portrait */
            var img = document.querySelector('#stats-hero .hero-pfp img:not(.pfp-frame)');
            if (img && img.getAttribute('src') !== url) img.setAttribute('src', url);
            /* the nav pfp is a second copy of the same picture - it has no mirrored
               text node either, so it needs the same explicit rewrite */
            var navImg = document.getElementById('nav-pfp-img');
            if (navImg && navImg.getAttribute('src') !== url) navImg.setAttribute('src', url);
            /* the frame rides along so a synced change repaints with the picture */
            paintFrame();
        }

        /* The energy bar reads "current / max" and its fill is a percentage,
           so both halves have to be written together — mirroring the fields
           one at a time would leave "98 / 100" next to a full bar. */
        function renderEnergyBar() {
            var cur = playerEnergy(), max = gVal('energyMax') || 100;
            paintPairBar('bar-energy', cur, max);
            paintNavVital('nav-energy', cur, max);
        }

        /* the nav vitals are compact bars with no readout, so only the fill
           width is written. Same sources as the Overview bars, which the
           per-stat painters below already call. */
        function paintNavVital(id, cur, max) {
            var el = document.getElementById(id);
            if (!el) return;
            var now = Math.floor(cur || 0);
            var cap = max || 0;
            var pct = cap > 0 ? Math.min(100, Math.round(now / cap * 100)) : 0;
            el.style.width = pct + '%';
            /* the bar carries no readout, so the exact figures live in the
               hover title - "Energy 100 / 100" */
            var wrap = el.closest ? el.closest('.nav-vital') : null;
            if (wrap) {
                var name = wrap.getAttribute('data-name') || '';
                var txt = (name ? name + ' ' : '') + fmtNum(now) + ' / ' + fmtNum(cap);
                if (wrap.getAttribute('title') !== txt) wrap.setAttribute('title', txt);
            }
        }

        /* A bar showing "current / max" plus a fill width can't be mirrored
           field-by-field — the two halves would disagree. Both halves are
           written together here. */
        function paintPairBar(rowId, cur, max) {
            var row = document.getElementById(rowId);
            if (!row) return;
            cur = Math.floor(cur || 0);
            max = max || 0;
            var val = row.querySelector('.bar-val');
            var fill = row.querySelector('.bar-fill');
            if (val) val.textContent = fmtNum(cur) + ' / ' + fmtNum(max);
            if (!fill) return;
            var pct = max > 0 ? Math.min(100, Math.round(cur / max * 100)) : 0;
            fill.style.width = pct + '%';
            var low = parseInt(row.getAttribute('data-low'), 10) || 0;
            if (pct <= low) fill.classList.add('low'); else fill.classList.remove('low');
        }

        /* Health has no timestamp math — it's a plain stored value that only
           moves when you take damage or heal, so it drifts normally and saves
           like any other tracked field. */
        function paintHealthBar() {
            var cur = gVal('hp'), max = gVal('maxHp') || 100;
            paintPairBar('bar-health', cur, max);
            paintNavVital('nav-health', cur, max);
        }

        /* stamina is the combat resource; regenerated, so painted not mirrored */
        function paintStaminaBar() {
            var cur = playerStamina(), max = gVal('staminaMax') || 100;
            paintPairBar('bar-stamina', cur, max);
            paintNavVital('nav-stamina', cur, max);
        }

        /* the XP bar tracks progress toward the next player level. The nav ring and
           level badge are painted FIRST and unconditionally: they used to sit
           after an early return on the home tab's XP row, so removing that row
           silently froze both. */
        function paintXpBar() {
            var pr = playerLevelProgress();

            /* the same progress, wrapped around the nav pfp */
            var arc = document.getElementById('nav-pfp-arc');
            if (arc) arc.style.strokeDashoffset = String(100 - pr.pct);

            /* bare level number under the name - the player_level mirror
               formats as "Level 12", which is not what the nav wants */
            var lvl = document.getElementById('nav-level');
            if (lvl) lvl.textContent = fmtNum(pr.level);

            var row = document.getElementById('bar-xp');
            if (!row) return;
            var val = row.querySelector('.bar-val');
            if (val) {
                val.textContent = pr.level >= XP_LEVEL_CAP
                    ? 'MAX'
                    : fmtNum(pr.into) + ' / ' + fmtNum(pr.need);
            }
            var fill = row.querySelector('.bar-fill');
            if (fill) fill.style.width = pr.pct + '%';
        }

        /* crew line under the nav name. "solo" when nobody has claimed the
           player, matching the hero's "No crew" wording. */
        function paintNavCrew() {
            var el = document.getElementById('nav-crew');
            if (!el) return;
            var name = playerCrewName();
            var txt = name || 'solo';
            if (el.textContent !== txt) el.textContent = txt;
        }

        /* Stamina gates every fight button. Called from renderFight so the
           rows grey out the moment stamina is spent, not just on the next
           tick. */
        function fightButtonsEnabled() {
            return gVal('stamina') == null || playerStamina() >= FIGHT_STAMINA_COST;
        }

        /* true when any tracked value has drifted since the last look.
           Passive fields are skipped: energy regenerates on its own, so
           treating that as a change would write on every single tick. */
        function syncedDrift() {
            return SYNCED.some(function (k) {
                if (FIELDS[k].passive) return false;
                return sync.shown[k] !== FIELDS[k].get();
            });
        }

        function snapshotShown() {
            SYNCED.forEach(function (k) { sync.shown[k] = FIELDS[k].get(); });
        }

        function sessionUser(c) {
            return c.auth.getSession().then(function (s) {
                var d = s && s.data && s.data.session;
                return (d && d.user && d.user.id) || null;
            });
        }

        function queueSave() {
            if (!sync.enabled || sync.failed) return;
            if (sync.timer) clearTimeout(sync.timer);
            sync.timer = setTimeout(saveSynced, 1200);
        }

        function saveSynced() {
            sync.timer = null;
            var c = dbClient();
            if (!c) return;
            var row = patchRow();
            sessionUser(c).then(function (uid) {
                if (!uid) return;
                row.id = uid;
                return c.from(DB_CONFIG.table).upsert(row);
            }).then(function () {
                SYNCED.forEach(function (k) { sync.loaded[k] = FIELDS[k].get(); });
            }).catch(function (e) {
                sync.failed = true;
                console.warn('[sync] save failed, staying local', e);
            });
        }

        function loadSynced() {
            var c = dbClient();
            if (!c) return;
            sessionUser(c).then(function (uid) {
                if (!uid) return null;
                return c.from(DB_CONFIG.table).select(SYNCED.join(',')).eq('id', uid).maybeSingle()
                    .then(function (res) {
                        /* a stored row wins over the local starting values */
                        var row = res && res.data;
                        if (!row) return;
                        /* Load order matters in three ways:
                             1. caps first - energy/health/stamina setters clamp
                                against their cap, so loading them the other way
                                round would clip a legitimately-full bar to the
                                local starting value
                             2. `day` and `current_city` before `market_key` -
                                the key is "day:city", so both must already be
                                restored before the stale-market check below
                             3. everything else in declaration order */
                        var LOAD_FIRST = ['energy_max', 'health_max', 'stamina_max', 'armor_max', 'hq', 'hq_crates', 'hq_containers', 'day', 'current_city', 'crew'];
                        var ordered = SYNCED.filter(function (k) { return LOAD_FIRST.indexOf(k) !== -1; })
                            .concat(SYNCED.filter(function (k) { return LOAD_FIRST.indexOf(k) === -1; }));
                        ordered.forEach(function (k) {
                            /* market_key is only read by the staleness check,
                               never assigned from the row */
                            if (k === 'market_key') return;
                            var v = row[k];
                            if (v == null || !FIELDS[k].valid(v)) return;
                            /* the setter does any conversion and fallback */
                            FIELDS[k].set(v);
                            sync.loaded[k] = v;
                            sync.shown[k] = FIELDS[k].get();
                        });

                        /* With an HQ, capacity is a DERIVED value: hqCapacity() works it out from
                           the HQ size plus crates (+10 each) and containers
                           (+40 each). Loading a stored max_capacity on top
                           could contradict the HQ state, so recompute using
                           the game's own function rather than repeating the
                           formula here. Without an HQ, capacity stays the
                           bag-derived number the loop above loaded. */
                        if (gVal('hq') && typeof TRAP !== 'undefined' && TRAP.hqCapacity) {
                            setG('maxCapacity', TRAP.hqCapacity());
                            sync.shown.max_capacity = gVal('maxCapacity');
                        }

                        /* Prices and cityLocks are re-rolled per city per day.
                           If the stored row was written on a different day or
                           in a different city, its numbers describe a market
                           that no longer exists, so discard them and roll
                           fresh rather than silently restoring stale data. */
                        var expected = gVal('day') + ':' + gVal('city');
                        if (row.market_key !== expected) {
                            if (typeof TRAP !== 'undefined' && TRAP.rollCityPrices) TRAP.rollCityPrices();
                            setG('marketKey', expected);
                        }

                        renderSynced();
                    });
            }).catch(function (e) {
                sync.failed = true;
                console.warn('[sync] load failed, staying local', e);
            });
        }

        var deviceFiles = {
            phone: 'online/devices/phone/phone.html',
            server: 'online/devices/server/server.html'
        };

        /* ── DEVICE OWNERSHIP ─────────────────────────────────
           The player starts with no handset and no desktop rig.
           Both cards stay locked until a device of that type is
           bought, and the open handlers refuse as well so the
           panels cannot be summoned another way. */
        function ownedDevice(type) {
            var devices = (window.TRAP && TRAP.G && TRAP.G.devices) || [];
            if (type === 'server') {
                /* The server is not a catalogue device, it is a thing you own
                   once a rack is running. Racks are counted, not listed, so it
                   has to read G.servers rather than searching G.devices. */
                return ((window.TRAP && TRAP.G && TRAP.G.servers) || 0) > 0
                    ? { type: 'server', name: 'Server' } : null;
            }
            return devices.find(function (d) { return d.type === type; }) || null;
        }

        function renderDevices() {
            /* Devices are icon-only, so the state has to live somewhere the
               markup can show it: colour and border on the icon, and the full
               text in the hover tooltip. aria-label carries the same string
               for anyone not using a mouse. The tooltip is written as
               innerHTML because the model name and the state are separate
               spans - a textContent write would flatten them onto one line,
               which is the thing this change exists to stop doing. */
            var DEVICES = [
                { key: 'phone', id: 'device-phone-btn', label: 'Phone', blurb: 'Personal handset' },
                { key: 'pc', id: 'device-pc-btn', label: 'PC', blurb: 'Desktop rig' },
                { key: 'server', id: 'device-server-btn', label: 'Server', blurb: 'Remote machine · crew can share it' }
            ];
            DEVICES.forEach(function (d) {
                var btn = document.getElementById(d.id);
                if (!btn) return;
                var owned = ownedDevice(d.key);
                var winId = d.key === 'phone' ? 'device-phone-panel' : (d.key === 'pc' ? 'pc-window' : 'server-window');
                var win = document.getElementById(winId);
                var isOpen = !!(win && win.classList.contains('open'));
                var tip = btn.querySelector('.device-tip');

                btn.classList.toggle('is-open', !!owned && isOpen);
                btn.classList.toggle('is-locked', !owned);
                /* travel-locked is set by applyTravelLocks() and is a separate
                   concern from ownership, so it is deliberately left alone */
                btn.disabled = !owned;

                var state, stateCls;
                if (!owned) {
                    state = 'Not owned · buy one in the Shop or Trap';
                    stateCls = 'off';
                } else if (isOpen) {
                    state = 'Open · click to close';
                    stateCls = '';
                } else {
                    state = 'Click to open';
                    stateCls = 'off';
                }
var line = '<b>' + d.label + '</b>';
                /* a server's owned name is just "Server", so don't print
                   "Server · Server" */
                if (owned && owned.name && owned.name !== d.label) line += ' · ' + owned.name;
                line += '<br>' + d.blurb + '<br><span class="st ' + stateCls + '">' + state + '</span>';
                if (tip) tip.innerHTML = line;
                btn.setAttribute('aria-label',
                    d.label + (owned ? ', ' + owned.name + ', ' + (isOpen ? 'open' : 'closed') : ', not owned'));
            });
        }

        function updateDeviceStatus() {
renderDevices();
        /* crew tabs ship locked in the markup; refresh the state so an account
           that already paid for a crew does not sit there looking locked */
        TRAP.renderCrewLocks();
            var on = [];
            if (document.getElementById('device-phone-panel').classList.contains('open')) on.push('Phone');
            var pcSrc = document.getElementById('pc-frame').getAttribute('src');
            if (pcSrc && pcSrc !== 'about:blank') on.push('PC');
            document.getElementById('device-status').textContent = on.length ? on.join(' + ') : 'None';
        }

        function toggleDevicePC(force) {
            var win = document.getElementById('pc-window');
            var frame = document.getElementById('pc-frame');
            var want = typeof force === 'boolean' ? force : !win.classList.contains('open');
            /* closing is always allowed; opening is refused on the road */
            if (want && TRAP.traveling()) {
                TRAP.addLog("The PC stays behind while you travel. Only your phone works until you arrive.", "bad");
                return;
            }
            /* closing is always allowed; opening needs a desktop rig */
            if (want && !ownedDevice('pc')) {
                TRAP.addLog("You do not own a PC yet. Buy one from the Shop or the Trap.", "bad");
                return;
            }
            if (want) {
                var s = frame.getAttribute('src');
                if (!s || s === 'about:blank') frame.src = 'onlinepc.html';
                win.classList.add('open');
            } else {
                if (win.classList.contains('fullscreen')) maximizePC();
                win.classList.remove('open');
            }
            /* the button is an icon now: renderDevices() owns its open/locked
               state, its tooltip and its label. Writing button text here would
               wipe the icon and the tooltip out of the button. */
            updateDeviceStatus();
        }

        function minimizePC() {
            var win = document.getElementById('pc-window');
            win.classList.remove('open');
            /* nothing else refreshes the icon on this path */
            updateDeviceStatus();
        }

        /* ── SERVER ────────────────────────────────────────────
           PenanceOS, as its own device rather than an app installed onto the PC.
           It is NOT travel-locked: a server is somewhere else, which is the
           whole point of owning one, so it stays reachable from the road. */
        function toggleDeviceServer(force) {
            var win = document.getElementById('server-window');
            var frame = document.getElementById('server-frame');
            if (!win || !frame) return;
            var want = typeof force === 'boolean' ? force : !win.classList.contains('open');
            if (want && !ownedDevice('server')) {
                TRAP.addLog("You do not own a server yet. Buy a rack from the Trap once you have an HQ.", "bad");
                return;
            }
            if (want) {
                var s = frame.getAttribute('src');
                if (!s || s === 'about:blank') frame.src = deviceFiles.server;
                win.classList.add('open');
            } else {
                if (win.classList.contains('fullscreen')) maximizeServer();
                win.classList.remove('open');
            }
            updateDeviceStatus();
        }

        function minimizeServer() {
            var win = document.getElementById('server-window');
            win.classList.remove('open');
            /* nothing else refreshes the icon on this path */
            updateDeviceStatus();
        }

        /* Shares maximizePC's save/restore dance rather than duplicating it. */
        function maximizeServer() {
            var win = document.getElementById('server-window');
            var maxBtn = document.getElementById('server-max-btn');
            if (win.classList.contains('fullscreen')) {
                win.classList.remove('fullscreen');
                maxBtn.innerHTML = '&#9633;';
                maxBtn.title = 'Fullscreen';
                if (win._savedPos) {
                    win.style.left = win._savedPos.left;
                    win.style.top = win._savedPos.top;
                    win.style.transform = win._savedPos.transform;
                    win._savedPos = null;
                }
            } else {
                win._savedPos = {
                    left: win.style.left,
                    top: win.style.top,
                    transform: win.style.transform
                };
                win.style.left = '';
                win.style.top = '';
                win.style.transform = '';
                win.classList.add('fullscreen');
                maxBtn.innerHTML = '&#9647;';
                maxBtn.title = 'Restore';
            }
        }

        /* ── SERVER STATE BRIDGE ───────────────────────────────
           PenanceOS polls with REQUEST_SYNC every 3s and expects a SYNC_STATE
           reply shaped like core.js handleGameSync() reads it. This is the

            function worldSvg(list) {
                var shown = {};
                list.forEach(function (o) { shown[o.i] = 1; });
                var land = '<path class="world-land" d="' + WORLD_LAND_PATH + '"></path>';
                var grat = '';
                for (var lat = -60; lat <= 60; lat += 30) {
                    var a = project(lat, -180), b = project(lat, 180);
                    grat += '<line class="world-graticule" x1="' + a.x + '" y1="' + a.y + '" x2="' + b.x + '" y2="' + b.y + '"></line>';
                }
                for (var lon = -150; lon <= 150; lon += 30) {
                    var c1 = project(85, lon), d1 = project(-85, lon);
                    grat += '<line class="world-graticule" x1="' + c1.x + '" y1="' + c1.y + '" x2="' + d1.x + '" y2="' + d1.y + '"></line>';
                }
                var pins = CITIES.map(function (city, i) {
                    if (!shown[i]) return '';
                    var q = project(city.lat, city.lon);
                    var here = i === G.city;
                    var sel = i === worldState.sel;
                    /* cheapest-drug multiplier drives the fill, so the map
                       itself carries the same signal as the cards */
                    var fill = city.d[cheapestDrugIdx(city)] <= 0.9 ? '#4ade80' : (city.d[cheapestDrugIdx(city)] >= 1.1 ? '#ff6b6b' : '#00ff88');
                    return '<g class="world-city' + (here ? ' here' : '') + (sel ? ' sel' : '') + '" data-city="' + i + '">' +
                        '<title>' + escapeHtml(city.name) + (here ? ' (you are here)' : '') + '</title>' +
                        '<circle cx="' + q.x + '" cy="' + q.y + '" r="' + (here || sel ? 8 : 5) + '" fill="' + fill + '"></circle>' +
                        '<text x="' + (q.x + 11) + '" y="' + (q.y + 3) + '">' + escapeHtml(city.name) + '</text>' +
                        '</g>';
                }).join('');
                return '<svg viewBox="0 0 ' + WORLD_W + ' ' + WORLD_H + '" role="img" aria-label="World map of ' + CITIES.length + ' cities">' +
                    '<rect width="' + WORLD_W + '" height="' + WORLD_H + '" fill="#0b0d14"></rect>' + land + grat + pins + '</svg>';
            }

            /* The search box lives outside the re-rendered region so typing doesn't
               destroy and recreate the input mid-keystroke, which would drop
               focus and the caret position on every character.

               The filter itself moved to the left sidebar - one search box now
               drives both the city list and the map, instead of the map having
               its own copy next to an identical one. */
            function renderWorld() {
                var c = document.getElementById("world-app");
                if (!c) return;
                c.innerHTML =
                    '<div class="world-map-wrap" id="world-map"></div>' +
                    '<div class="map-legend"><span id="world-count"></span>' +
                    '<span><i style="background:#00ff88"></i>Typical</span>' +
                    '<span><i style="background:#4ade80"></i>Cheap</span>' +
                    '<span><i style="background:#ff6b6b"></i>Dear</span>' +
                    '<span style="color:#4ade80">Click a city to open its city map</span></div>';
                paintWorld();
            }

            /* The world map is navigation only - it shows where cities are,
               nothing about what is in them. City stats live on the city map,
               grouped by category, so there is exactly one place to read them. */
            function paintWorld() {
                var list = worldFiltered();
                var map = document.getElementById("world-map");
                if (map) { map.innerHTML = worldSvg(list); bindWorldPins(); }
                var count = document.getElementById("world-count");
                if (count) count.textContent = list.length + ' of ' + CITIES.length + ' cities';
                paintCityNav();
            }

            /* Selecting on the world map hands off to the existing per-city
               SVG map rather than duplicating it.

               Pins are bound with addEventListener, not inline onclick —
               an inline handler would resolve worldSelect against window, but
               this lives inside the TRAP closure and is not global, so the
               click would throw "worldSelect is not defined". This matches how
               renderMapPins binds its circles. */
            function worldSelect(idx) {
                worldState.sel = idx;
                var city = CITIES[idx];
                if (!city) return;
                G.viewCity = idx;
                /* flag the hand-off so renderSubtab does not reset viewCity
                   back to the city you're standing in */
                TRAP.worldPendingCity = true;
                var sub = document.querySelector('[data-subtab="world-city"]');
                if (sub) sub.click();
                else showSubtab('world', 'world-city', null);
            }

            /* ── WHERE YOU ARE STANDING ────────────────────────────────────
               The new-save start. New York County Jail appears TWICE in
               locations.json under the same id: once in `gov` at a real
               position, once in `infrastructure` at 0,0 with the note
               "Auto-added jail entry." The cat pins to 'gov' and
               findPlacedBuilding skips the 0,0 stub, so this resolves to
               the jail on the map rather than the top-left corner. */
            var START_PLACE = { city: 0, cat: 'gov', id: 'new_york_jail', name: 'New York County Jail', type: 'Government', x: 1800, y: 700 };

            /* Resolve an id to its record, preferring a placed entry over the
               auto-added 0,0 duplicates. Returns null until locations.json
               has loaded, which is why G.at also carries a name fallback. */
            function findPlacedBuilding(cityIdx, catKey, id) {
                var city = CITIES[cityIdx];
                var data = mapState.locations && city ? mapState.locations[city.name] : null;
                if (!data || !Array.isArray(data[catKey])) return null;
                var first = null;
                for (var i = 0; i < data[catKey].length; i++) {
                    var o = data[catKey][i];
                    if (!o || o.id !== id) continue;
                    if (!first) first = o;
                    if (typeof o.x === 'number' && typeof o.y === 'number' &&
                        o.x > 0 && o.y > 0 && o.x <= MAP_W && o.y <= MAP_H) return o;
                }
                return first;
            }

            /* The building you are at, merged with locations.json when it is
               available so a rename in the data shows up immediately, and
               falling back to the snapshot on G.at before that - otherwise
               the place card reads "Building" with no coordinates for the
               second or two before the JSON lands. */
            function currentPlace() {
                var at = G.at;
                if (!at) return null;
                var e = findPlacedBuilding(at.city, at.cat, at.id);
                return {
                    city: at.city,
                    cat: at.cat,
                    id: at.id,
                    name: (e && (e.name || e.id)) || at.name || 'Unknown',
                    type: (e && e.type) || at.type || '',
                    x: e ? e.x : (typeof at.x === 'number' ? at.x : null),
                    y: e ? e.y : (typeof at.y === 'number' ? at.y : null),
                    entry: e || null
                };
            }

            function atThisBuilding(catKey, id) {
                return !!(G.at && G.at.city === G.city && G.at.cat === catKey && G.at.id === id);
            }

            /* Walk or drive to a building in the city you are standing in.
               Instant on purpose: no timer, no animation, no travel time yet.
               Addressing is by category + index, the same way the sidebar rows
               and the map pins already point at a record.

               Guards, in the order they are reported:
                 on the road      - you are between cities, not on a street
                 wrong city       - the sidebar can show a city you are not in
                 unknown record   - data not loaded, or index no longer valid
                 already here     - nothing to do
                 no vehicle       - drive needs G.playerCar, walk does not */
            function travelToBuilding(catKey, idx, mode) {
                if (G.travel) {
                    addLog('You are on the road. Not while travelling.', 'bad');
                    return false;
                }
                if (G.viewCity !== G.city) {
                    addLog('You are in ' + CITIES[G.city].name + '. Travel there before walking to its buildings.', 'bad');
                    return false;
                }
                var city = CITIES[G.city];
                var data = mapState.locations && city ? mapState.locations[city.name] : null;
                if (!data || !Array.isArray(data[catKey])) {
                    addLog('Building data for ' + city.name + ' has not loaded yet.', 'bad');
                    return false;
                }
                var entry = data[catKey][idx];
                if (!entry) { addLog('That building is not here.', 'bad'); return false; }
                var placed = typeof entry.x === 'number' && typeof entry.y === 'number' &&
                    entry.x >= 0 && entry.y >= 0 && entry.x <= MAP_W && entry.y <= MAP_H;
                if (!placed) { addLog('That building has no position on the map yet.', 'bad'); return false; }

                var id = entry.id || (entry.name || '');
                var name = entry.name || id;
                if (atThisBuilding(catKey, id)) { addLog('You are already at ' + name + '.', 'bad'); return false; }
                if (mode === 'drive' && !G.playerCar) {
                    addLog('No vehicle. Walk to ' + name + ' instead.', 'bad');
                    return false;
                }

                G.at = { city: G.city, cat: catKey, id: id, name: name, type: entry.type || '' };
                /* Arriving selects where you arrived. Without this the record
                   below the map keeps showing whatever was selected before, so
                   you can be standing in one building reading another one's
                   details - and a bank you just walked to would not open. */
                var label = catLabel(catKey);
                mapState.selected = { entry: entry, category: label, catKey: catKey, cityIdx: G.city };
                addLog((mode === 'drive' ? 'Drove to ' : 'Walked to ') + name + '.', 'good');

                /* Everything that reads the position repaints from one place:
                   footer, the city list, the building record, the map pin
                   highlight and the strip. */
                renderSafehouseCard();
                renderCityTravel();
                renderBuilding();
                refreshHerePin();
                paintBuildingNav();
                return true;
            }

            /* ── BANK SERVICES ────────────────────────────────────────────
               The phone has a bank tab, but the phone is a separate
               economy - phone.html keeps its own G with its own cash and
               bank, and the main site only ever pushes it city and clock.
               So a player with no phone had no way to reach the MAIN
               balance at all, which is the one that actually earns the 5%
               daily interest in dayPass().

               This is that door: walk into a bank and the counter opens.
               Same four actions as the phone's bank tab, same rules, on
               the main G. The feature set is the phone's; the ledger is
               the real one.

               What counts as a bank is the name or the type saying "bank".
               Type alone is too loose - "Financial Center" also covers
               towers and plazas that are not banks. Across the loaded
               city data that is Offchain Bank HQ (New York), Multimark
               Bank HQ (London), Sterling Union Bank (Singapore). */
            function isBankPlace(o) {
                if (!o) return false;
                return /bank/i.test(String(o.name || '')) || /bank/i.test(String(o.type || ''));
            }

            function bankServicesHtml() {
                return '<div class="trap-info-box" style="border-color:#4ade80">' +
                        'Cash: $' + G.cash.toLocaleString() +
                        '<br>Bank Balance: $' + G.bank.toLocaleString() +
                        '<br>Interest: 5% per day on deposits</div>' +
                        '<div class="trap-bank-row"><span>Deposit:</span>' +
                        '<input class="trap-drug-input" type="number" min="0" id="bankDep" style="width:120px" placeholder="Amount">' +
                        '<button class="trap-menu-btn" style="width:auto;padding:4px 12px" onclick="TRAP.doBank(\'deposit\')">DEPOSIT</button>' +
                        '<button class="trap-menu-btn" style="width:auto;padding:4px 12px" onclick="TRAP.doBank(\'depositAll\')">ALL</button></div>' +
                        '<div class="trap-bank-row"><span>Withdraw:</span>' +
                        '<input class="trap-drug-input" type="number" min="0" id="bankWit" style="width:120px" placeholder="Amount">' +
                        '<button class="trap-menu-btn" style="width:auto;padding:4px 12px" onclick="TRAP.doBank(\'withdraw\')">WITHDRAW</button>' +
                        '<button class="trap-menu-btn" style="width:auto;padding:4px 12px" onclick="TRAP.doBank(\'withdrawAll\')">ALL</button></div>';
            }

            /* Mirrors the phone's doBank() exactly, including its two silent
               no-ops: ALL with an empty side does nothing and says nothing.
               Kept identical on purpose so the two counters behave the same
               way rather than one being the "fixed" version. */
            function doBank(mode) {
                if (mode === "deposit") {
                    var amt = parseInt(document.getElementById("bankDep").value, 10) || 0;
                    if (amt <= 0 || amt > G.cash) { addLog("Invalid amount.", "bad"); renderBuilding(); return; }
                    G.cash -= amt;
                    G.bank += amt;
                    addLog("Deposited $" + amt.toLocaleString() + " in bank.", "good");
                } else if (mode === "depositAll") {
                    if (G.cash <= 0) return;
                    G.bank += G.cash;
                    addLog("Deposited $" + G.cash.toLocaleString() + " in bank.", "good");
                    G.cash = 0;
                } else if (mode === "withdraw") {
                    var amt2 = parseInt(document.getElementById("bankWit").value, 10) || 0;
                    if (amt2 <= 0 || amt2 > G.bank) { addLog("Invalid amount.", "bad"); renderBuilding(); return; }
                    G.bank -= amt2;
                    G.cash += amt2;
                    addLog("Withdrew $" + amt2.toLocaleString() + " from bank.", "good");
                } else if (mode === "withdrawAll") {
                    if (G.bank <= 0) return;
                    G.cash += G.bank;
                    addLog("Withdrew $" + G.bank.toLocaleString() + " from bank.", "good");
                    G.bank = 0;
                } else {
                    return;
                }
                /* the balance lives in three places - footer, stats bar and
                   the nav's cash readout - so all three repaint */
                refreshStats();
                renderSafehouseCard();
                if (typeof renderSynced === 'function') renderSynced();
                queueSave();
                renderBuilding();
            }

            /* ── RECORD ACTIONS: go here, and put my own place back ────
               Two small controls the record itself owns.

               goHereHtml() puts WALK / DRIVE directly in the panel, so
               inspecting a building is enough to move there without going
               back to the city list. It addresses the entry by INDEX in its
               category array - the same addressing travelToBuilding() takes -
               so it stays correct even if two buildings share an id. */
            function entryIndex(cityIdx, catKey, entry) {
                var city = CITIES[cityIdx];
                var data = mapState.locations && city ? mapState.locations[city.name] : null;
                if (!data || !Array.isArray(data[catKey]) || !entry) return -1;
                return data[catKey].indexOf(entry);
            }

            function goHereHtml(catKey, entry) {
                var idx = entryIndex(G.city, catKey, entry);
                if (idx < 0) return '';
                var hasCar = !!G.playerCar;
                return '<div class="bld-go">' +
                    '<button data-go-walk="' + escapeAttr(catKey) + '" data-go-idx="' + idx + '">WALK HERE</button>' +
                    (hasCar
                        ? '<button class="drive" data-go-drive="' + escapeAttr(catKey) + '" data-go-idx="' + idx + '">DRIVE HERE</button>'
                        : '<button class="drive" disabled title="You do not own a vehicle">NO CAR</button>') +
                    '</div>';
            }

            function bindGoHere(host) {
                host.querySelectorAll('[data-go-walk]').forEach(function (b) {
                    b.addEventListener('click', function () {
                        travelToBuilding(b.dataset.goWalk, parseInt(b.dataset.goIdx, 10), 'walk');
                    });
                });
                host.querySelectorAll('[data-go-drive]').forEach(function (b) {
                    b.addEventListener('click', function () {
                        travelToBuilding(b.dataset.goDrive, parseInt(b.dataset.goIdx, 10), 'drive');
                    });
                });
            }

            /* The dismiss control only earns a place while you are looking at
               somewhere else, so it is hidden whenever the record IS your
               current building. Bound once: the element outlives every repaint. */
            var _backBound = false;
            function setBackButton(on) {
                var b = document.getElementById('bld-back');
                if (!b) return;
                if (!_backBound) {
                    _backBound = true;
                    b.addEventListener('click', function () { backToHere(); });
                }
                b.hidden = !on;
            }

            /* Put the player's own place back on screen, and on the map. */
            function backToHere() {
                var cp = currentPlace();
                if (cp && cp.entry && cp.cat) {
                    mapState.selected = {
                        entry: cp.entry,
                        category: catLabel(cp.cat),
                        catKey: cp.cat,
                        cityIdx: cp.city
                    };
                    if (typeof cp.x === 'number' && typeof cp.y === 'number') focusMapPin(cp.x, cp.y);
                } else {
                    /* not at a building - there is nothing to go back to */
                    mapState.selected = null;
                }
                renderBuilding();
                paintBuildingNav();
            }

            /* Move the "you are here" ring to the pin for the current building.

               Pins are only rebuilt when the map loads or the city changes, so
               without this the highlight stayed on whichever building you were
               standing at when the map drew - walking to the bank left the ring
               on the jail. Toggling the class on the existing circles costs
               nothing and keeps the pin markup, listeners and z-order intact,
               which rebuilding all ~40 circles would not. */
            function refreshHerePin() {
                var g = document.getElementById('map-locations');
                if (!g) return;
                var cp = currentPlace();
                var want = cp ? (cp.id || '') : '';
                g.querySelectorAll('circle.pin').forEach(function (c) {
                    /* id AND position. locations.json carries duplicate ids for
                       the same building - New York County Jail exists once in
                       `gov` at 1800,700 and once in `infrastructure` at 0,0 as
                       an auto-added stub - so matching on id alone ringed both. */
                    var sameId = !!want && c.dataset.bid === want;
                    var sameSpot = !sameId || cp.x == null ||
                        (Number(c.dataset.px) === cp.x && Number(c.dataset.py) === cp.y);
                    var is = sameId && sameSpot;
                    c.classList.toggle('pin-here', is);
                    if (is) {
                        c.setAttribute('r', 19);
                        c.setAttribute('stroke', '#00ff88');
                        c.setAttribute('stroke-width', '4');
                    } else {
                        c.setAttribute('r', 15);
                        c.setAttribute('stroke', '#000');
                        c.setAttribute('stroke-width', '2');
                    }
                });
            }

            /* ── CITY MAP TRAVEL STRIP ──────────────────────────────────
               The top of a city map answers "can I go here". Looking
               at Tokyo and having to go back to the world map to find
               the ROAD button is the same problem the sidebar was
               solving one level up, so the strip sits directly above
               the map for the city being viewed.

               Repainted by renderTravel(), which already runs on travel
               start, on arrival and once a second while on the road, so
               the HERE / ON THE ROAD / ROAD+FLY states cannot go stale. */
            function renderCityTravel() {
                var host = document.getElementById('city-travel');
                if (!host) return;
                var i = G.viewCity;
                var city = CITIES[i];
                if (!city) { host.innerHTML = ''; return; }

                var here = i === G.city;
                var roadHrs = here ? null : travelHoursTo(i);
                var air = !here && canFlyTo(i);
                var fare = air ? airFareTo(G.city, i) : null;
                var airHrs = air ? airHoursTo(G.city, i) : null;
                var sea = !here && crossesOcean(G.city, i);
                var cheapest = 0, dearest = 0;
                for (var k = 1; k < city.d.length; k++) {
                    if (city.d[k] < city.d[cheapest]) cheapest = k;
                    if (city.d[k] > city.d[dearest]) dearest = k;
                }

                var cls = 'city-travel', tag = '', note = '', acts = '';

                if (G.travel) {
                    cls += ' is-road';
                    var dest = CITIES[G.travel.to];
                    tag = 'ON THE ROAD';
                    note = 'Arriving in <b>' + fmtLeft(travelLeftMs()) + '</b> (' +
                        fmtHours(G.travel.hours || 24) + ') &middot; heading to <b>' +
                        escapeHtml(dest.name) + '</b>. Only your phone works until then.';
                    acts = '<button disabled>ROAD</button>';
                } else if (here) {
                    cls += ' is-here';
                    tag = 'YOU ARE HERE';
                    note = 'Cheapest <b>' + escapeHtml(DRUGS[cheapest].name) + '</b> &middot; priciest <b>' +
                        escapeHtml(DRUGS[dearest].name) + '</b> &middot; ' + escapeHtml(city.note || '');
                    acts = '<button disabled>HERE</button>';
                } else {
                    tag = 'TRAVEL';
                    note = 'From <b>' + escapeHtml(CITIES[G.city].name) + '</b> &middot; <b>' +
                        fmtHours(roadHrs) + '</b> by road' + (sea ? ' &middot; crosses open water' : '') +
                        ' &middot; cheap <b>' + escapeHtml(DRUGS[cheapest].name) + '</b> &middot; dear <b>' +
                        escapeHtml(DRUGS[dearest].name) + '</b>';
                    acts = '<button data-ct-road="' + i + '">ROAD</button>' +
                        (air
                            ? '<button data-ct-fly="' + i + '" title="' + fmtHours(airHrs) + ' flight">FLY $' + fare.toLocaleString() + '</button>'
                            : '<button disabled title="No flight from ' + escapeHtml(CITIES[G.city].name) + '">NO AIR</button>');
                }

                host.className = cls;
                host.innerHTML =
                    '<span class="ct-name">' + escapeHtml(city.name) +
                    (tag ? '<span class="ct-tag">' + tag + '</span>' : '') + '</span>' +
                    '<span class="ct-note">' + note + '</span>' +
                    '<span class="ct-acts">' + acts + '</span>';

                var roadBtn = host.querySelector('[data-ct-road]');
                if (roadBtn) roadBtn.addEventListener('click', function () { TRAP.doTravel(i); });
                var flyBtn = host.querySelector('[data-ct-fly]');
                if (flyBtn) flyBtn.addEventListener('click', function () { TRAP.doTravel(i, 'air'); });
            }

            /* Bind every pin in the freshly drawn map. Called after the SVG
               is in the document, since querySelectorAll needs it there. */
            function bindWorldPins() {
                var svg = document.getElementById("world-map");
                if (!svg) return;
                svg.querySelectorAll(".world-city").forEach(function (g) {
                    g.addEventListener("click", function () {
                        worldSelect(parseInt(g.dataset.city, 10));
                    });
                });
            }

            /* ── MAP LEFT NAV ─────────────────────────────────────────
               One sidebar, two jobs, decided by which map is open:

               world map -> every city, grouped by region, with the road
                            and flight buttons that used to live in the
                            Travel tab
               city map  -> every building placed in the city being
                            looked at, grouped by the same PIN_CATS the
                            map pins use

               Selecting a row is the drill-down: city -> switches to the
               city map, building -> records the selection the building
               record reads, and centres the map on that pin.

               The query box is bound once and lives in .map-nav-head, so
               repainting only the list below it never steals focus
               mid-keystroke - same reason renderWorld used to guard its
               search input. */
            var mapNav = { mode: null, query: '', bound: false, entries: [] };

            function mapNavShow(mode) {
                mapNav.mode = mode;
                var nav = document.getElementById('map-nav');
                if (!nav) return;
                nav.hidden = !mode;
                var main = document.querySelector('.main-content');
                if (main) {
                    /* margin, like syncNavRight, so the content column's
                       scrollbar parks against the sidebar instead of under it */
                    main.style.marginLeft = mode ? '260px' : '';
                }
                if (mode) {
                    mapNavBind();
                    renderMapNav();
                }
            }

            function mapNavHide() {
                mapNavShow(null);
            }

            function mapNavBind() {
                if (mapNav.bound) return;
                mapNav.bound = true;
                var q = document.getElementById('map-nav-q');
                var sel = document.getElementById('map-nav-region');
                if (q) {
                    q.addEventListener('input', function () {
                        mapNav.query = q.value;
                        if (mapNav.mode === 'world') {
                            worldState.search = q.value;
                            paintWorld();
                        } else if (mapNav.mode === 'city') {
                            paintBuildingNav();
                        }
                    });
                }
                if (sel) {
                    sel.addEventListener('change', function () {
                        worldState.region = sel.value;
                        paintWorld();
                    });
                }
            }

            function renderMapNav() {
                var q = document.getElementById('map-nav-q');
                var sel = document.getElementById('map-nav-region');
                var title = document.getElementById('map-nav-title');
                if (mapNav.mode === 'world') {
                    if (title) title.textContent = 'CITIES';
                    if (q) { q.placeholder = 'Filter cities...'; q.value = worldState.search; }
                    if (sel) {
                        var regions = [];
                        CITIES.forEach(function (city) {
                            var r = cityRegion(city);
                            if (regions.indexOf(r) === -1) regions.push(r);
                        });
                        sel.innerHTML = ['all'].concat(regions).map(function (r) {
                            return '<option value="' + r + '">' + (r === 'all' ? 'All regions' : r) + '</option>';
                        }).join('');
                        sel.value = worldState.region;
                        sel.style.display = '';
                    }
                    paintCityNav();
                } else if (mapNav.mode === 'city') {
                    if (title) title.textContent = 'BUILDINGS';
                    if (q) { q.placeholder = 'Filter buildings...'; q.value = mapNav.query; }
                    if (sel) sel.style.display = 'none';
                    paintBuildingNav();
                }
            }

            /* Cities, grouped by region. worldFiltered() is the single
               filter - the map and this list cannot disagree about which
               cities are showing, because they read the same array. */
            function paintCityNav() {
                var list = document.getElementById('map-nav-list');
                if (!list) return;
                var shown = worldFiltered();
                var byRegion = {};
                var order = [];
                shown.forEach(function (o) {
                    var r = cityRegion(o.c);
                    if (!byRegion[r]) { byRegion[r] = []; order.push(r); }
                    byRegion[r].push(o);
                });
                if (!order.length) {
                    list.innerHTML = '<div class="map-nav-empty">No cities match that filter.</div>';
                    return;
                }
                var html = '';
                order.forEach(function (r) {
                    html += '<div class="map-nav-group">' + r + ' &middot; ' + byRegion[r].length + '</div>';
                    byRegion[r].forEach(function (o) { html += cityNavRow(o.c, o.i); });
                });
                list.innerHTML = html;

                list.querySelectorAll('[data-goto]').forEach(function (el) {
                    el.addEventListener('click', function (ev) {
                        ev.stopPropagation();
                        worldSelect(parseInt(el.dataset.goto, 10));
                    });
                });
                list.querySelectorAll('[data-road]').forEach(function (el) {
                    el.addEventListener('click', function (ev) {
                        ev.stopPropagation();
                        TRAP.doTravel(parseInt(el.dataset.road, 10));
                    });
                });
                list.querySelectorAll('[data-fly]').forEach(function (el) {
                    el.addEventListener('click', function (ev) {
                        ev.stopPropagation();
                        TRAP.doTravel(parseInt(el.dataset.fly, 10), 'air');
                    });
                });
            }

            function cityNavRow(city, i) {
                var here = i === G.city;
                var sel = i === worldState.sel;
                var mult = city.d[cheapestDrugIdx(city)];
                var fill = mult <= 0.9 ? '#4ade80' : (mult >= 1.1 ? '#ff6b6b' : '#00ff88');
                var cheapest = 0, dearest = 0;
                for (var k = 1; k < city.d.length; k++) {
                    if (city.d[k] < city.d[cheapest]) cheapest = k;
                    if (city.d[k] > city.d[dearest]) dearest = k;
                }
                var hrs = travelHoursTo(i);
                var home = i === G.homeCity ? ' &middot; HOME' : '';
                var roadBtn, flyBtn;
                if (here) {
                    roadBtn = '<button disabled>HERE</button>';
                    flyBtn = '';
                } else if (G.travel) {
                    roadBtn = '<button disabled>ON ROAD</button>';
                    flyBtn = '';
                } else {
                    roadBtn = '<button data-road="' + i + '">ROAD ' + Math.round(hrs) + 'h</button>';
                    flyBtn = canFlyTo(i)
                        ? '<button data-fly="' + i + '">FLY $' + airFareTo(G.city, i).toLocaleString() + '</button>'
                        : '<button disabled>NO AIR</button>';
                }
                return '<div class="map-nav-row' + (here ? ' here' : '') + (sel ? ' sel' : '') + '">' +
                    '<div class="nm" data-goto="' + i + '" style="cursor:pointer"><i class="dot" style="background:' + fill + '"></i>' +
                    '<span>' + escapeHtml(city.name) + '</span></div>' +
                    '<span class="sub">' + escapeHtml(DRUGS[cheapest].name) + ' &middot; ' + escapeHtml(DRUGS[dearest].name) + home + '</span>' +
                    '<span class="acts">' + roadBtn + flyBtn + '</span>' +
                    '</div>';
            }

            /* Buildings placed in the city being viewed, grouped by the same
               categories the pins come from. Only entries with numeric x/y
               inside the map bounds are listed, matching renderMapPins - a row
               you can click has to be a pin you can see. */
            function paintBuildingNav() {
                var list = document.getElementById('map-nav-list');
                if (!list) return;
                var cityIdx = G.viewCity;
                var city = CITIES[cityIdx];
                var data = mapState.locations && city ? mapState.locations[city.name] : null;
                mapNav.entries = [];
                if (!city || !data) {
                    list.innerHTML = '<div class="map-nav-empty">' +
                        (mapState.locations ? 'No building data for ' + escapeHtml(city ? city.name : '?') + '.' : 'Loading building data&hellip;') +
                        '</div>';
                    return;
                }
                var q = mapNav.query.trim().toLowerCase();
                /* movement is only offered for the city the player is actually
                   standing in; the sidebar can be showing a city you are
                   visiting, and those buttons have to say so rather than fail */
                var sameCity = cityIdx === G.city;
                var hasCar = !!G.playerCar;
                var groups = [];
                var total = 0;
                PIN_CATS.forEach(function (cat) {
                    var arr = data[cat.key];
                    if (!Array.isArray(arr)) return;
                    var items = [];
                    arr.forEach(function (o, i) {
                        if (!o || typeof o.x !== 'number' || typeof o.y !== 'number') return;
                        if (o.x < 0 || o.y < 0 || o.x > MAP_W || o.y > MAP_H) return;
                        if (q) {
                            var hay = ((o.name || '') + ' ' + (o.type || '') + ' ' + (o.id || '') + ' ' + (o.address || '')).toLowerCase();
                            if (hay.indexOf(q) === -1) return;
                        }
                        items.push({ entry: o, idx: i });
                        mapNav.entries.push({ catKey: cat.key, idx: i, entry: o, label: cat.label });
                    });
                    if (items.length) { groups.push({ cat: cat, items: items }); total += items.length; }
                });
                if (!total) {
                    list.innerHTML = '<div class="map-nav-empty">' +
                        (q ? 'Nothing matches that filter.' : 'No buildings placed in this city.') + '</div>';
                    return;
                }
                var sel = mapState.selected;
                var html = '';
                groups.forEach(function (g) {
                    html += '<div class="map-nav-group">' + escapeHtml(g.cat.label) + ' &middot; ' + g.items.length + '</div>';
                    g.items.forEach(function (it) {
                        var o = it.entry;
                        var oid = o.id || (o.name || '');
                        var isHere = atThisBuilding(g.cat.key, oid);
                        var isSel = !!(sel && sel.cityIdx === cityIdx &&
                            sel.entry && (sel.entry.id || sel.entry.name) === oid &&
                            sel.category === g.cat.label);
                        var color = PIN_TYPES[o.type] || '#94a3b8';
                        var where = o.address || (typeof o.x === 'number' ? o.x + ', ' + o.y : '');
                        html += '<div class="map-nav-row' + (isSel ? ' sel' : '') + (isHere ? ' here' : '') + '" data-cat="' + escapeAttr(g.cat.key) + '" data-idx="' + it.idx + '">' +
                            '<div class="nm"><i class="dot" style="background:' + color + '"></i><span>' +
                            escapeHtml(o.name || o.id || 'Unnamed') + '</span>' +
                            (isBankPlace(o) ? '<span class="map-nav-bank">BANK</span>' : '') +
                            '</div>' +
                            '<span class="sub">' + escapeHtml(o.type || g.cat.label) + (where ? ' &middot; ' + escapeHtml(where) : '') + '</span>' +
                            '<span class="acts">' + placeActs(g.cat.key, it.idx, isHere, sameCity, hasCar) + '</span>' +
                            '</div>';
                    });
                });
                list.innerHTML = html;
                list.querySelectorAll('[data-cat]').forEach(function (el) {
                    el.addEventListener('click', function () {
                        mapNavSelectBuilding(el.dataset.cat, parseInt(el.dataset.idx, 10));
                    });
                });
                list.querySelectorAll('[data-walk-cat]').forEach(function (el) {
                    el.addEventListener('click', function (ev) {
                        ev.stopPropagation();
                        travelToBuilding(el.dataset.walkCat, parseInt(el.dataset.walkIdx, 10), 'walk');
                    });
                });
                list.querySelectorAll('[data-drive-cat]').forEach(function (el) {
                    el.addEventListener('click', function (ev) {
                        ev.stopPropagation();
                        travelToBuilding(el.dataset.driveCat, parseInt(el.dataset.driveIdx, 10), 'drive');
                    });
                });
            }

            /* WALK / DRIVE for one row. Every state is a real button with the
               reason attached, so a disabled control always explains itself:
               you are there, you are in another city, or you have no car. */
            function placeActs(catKey, idx, isHere, sameCity, hasCar) {
                if (G.travel) return '<button disabled>ON THE ROAD</button>';
                if (isHere) return '<button disabled>YOU ARE HERE</button>';
                if (!sameCity) {
                    return '<button disabled title="You are in ' + escapeAttr(CITIES[G.city].name) +
                        '. Travel to this city first.">TRAVEL HERE FIRST</button>';
                }
                return '<button data-walk-cat="' + escapeAttr(catKey) + '" data-walk-idx="' + idx + '">WALK</button>' +
                    (hasCar
                        ? '<button data-drive-cat="' + escapeAttr(catKey) + '" data-drive-idx="' + idx + '">DRIVE</button>'
                        : '<button disabled title="You do not own a vehicle">NO CAR</button>');
            }

            /* The drill-down for a building: same two things a pin click does,
               minus the popup - the record below the map is the detail view
               now, so a second floating copy would just repeat it. */
            function mapNavSelectBuilding(catKey, idx) {
                var cityIdx = G.viewCity;
                var city = CITIES[cityIdx];
                var data = mapState.locations && city ? mapState.locations[city.name] : null;
                if (!data || !Array.isArray(data[catKey])) return;
                var o = data[catKey][idx];
                if (!o) return;
                var label = catLabel(catKey);
                mapState.selected = { entry: o, category: label, catKey: catKey, cityIdx: cityIdx };
                renderBuilding();
                paintBuildingNav();
                if (typeof o.x === 'number' && typeof o.y === 'number') focusMapPin(o.x, o.y);
                /* the record is in the right side bar now, so scrolling the
                   page to it meant nothing - scroll the bar itself instead */
                var bar = document.getElementById('nav-side-bar');
                var panel = document.getElementById('side-building-panel');
                if (bar && panel && bar.scrollHeight > bar.clientHeight) {
                    var top = panel.offsetTop;
                    if (top < bar.scrollTop) bar.scrollTo({ top: top, behavior: 'smooth' });
                }
            }

            /* Centre the city map on a pin. userZoomed is set so fitStage()
               leaves the new scale alone - otherwise the next render snaps
               straight back to the whole-city fit and the jump is invisible. */
            function focusMapPin(x, y) {
                var vp = document.getElementById('map-vp');
                if (!vp) return;
                var k = mapState.baseScale || mapState.scale;
                if (!mapState.userZoomed) mapState.scale = Math.max(mapState.scale, k * 1.8);
                mapState.userZoomed = true;
                mapState.x = vp.clientWidth / 2 - x * mapState.scale;
                mapState.y = vp.clientHeight / 2 - y * mapState.scale;
                clampPan();
                applyTransform();
            }

            var PROPERTIES = [
                { id: "stash", name: "Stash House", desc: "Hides 20 units. Small, safe, cheap.", cost: 8000, city: "New York", cap: 20 },
                { id: "locker", name: "Private Locker", desc: "Hides 50 units. Climate controlled.", cost: 22000, city: "London", cap: 50 },
                { id: "garage", name: "Garage", desc: "Hides 90 units and a car. Blocks vehicle theft.", cost: 55000, city: "Detroit", cap: 90 },
                { id: "safehouse", name: "Safehouse", desc: "Hides 160 units and 2 crew recover slots.", cost: 140000, city: "Tampa", cap: 160 },
                { id: "depot", name: "Distribution Depot", desc: "Hides 300 units. Adds +8% drug resale.", cost: 320000, city: "Mexico City", cap: 300 },
{ id: "warehouse", name: "Warehouse", desc: "Hides 600 units. Heavy security, heavy price.", cost: 700000, city: "Sao Paulo", cap: 600 }
];
/* HQ is bought here alongside the properties, since an HQ is a place you own
               rather than something carried. `slots` is the flat storage it
               grants on its own; crates and containers bought later add +10 and
               +40 on top, capped by hqCrateCapFor(). Costs step against the
               property ladder so an HQ lands between the Safehouse and Depot
               rather than beside the $8,000 Stash House. */
            var HQ_BUY = [
                { id: "hq_small", name: "Small HQ", desc: "100 units of storage. Unlocks grade C operations and the trunk lot.", cost: 40000, slots: 100, crates: 4 },
                { id: "hq_medium", name: "Medium HQ", desc: "220 units. Unlocks grade B operations.", cost: 160000, slots: 220, crates: 8 },
                { id: "hq_large", name: "Large HQ", desc: "500 units. Unlocks grade S operations.", cost: 480000, slots: 500, crates: 15 }
            ];
            function propDef(id) { return PROPERTIES.find(function (p) { return p.id === id; }); }
            function propStash(id) {
                if (!G.propStash) G.propStash = {};
                if (!Array.isArray(G.propStash[id])) G.propStash[id] = new Array(DRUGS.length).fill(0);
                return G.propStash[id];
            }
            function propUsed(id) { return propStash(id).reduce(function (s, q) { return s + q; }, 0); }
            function propCap(id) { var p = propDef(id); return p ? p.cap : 0; }
            function propSpace(id) { return Math.max(0, propCap(id) - propUsed(id)); }
            function propertyStashTotal() {
                return G.properties.reduce(function (s, id) { return s + propCap(id); }, 0);
            }
            function propertyStashUsed() {
                return G.properties.reduce(function (s, id) { return s + propUsed(id); }, 0);
            }
            function hasProperty(id) { return G.properties.indexOf(id) >= 0; }
            function resaleBonus() { return hasProperty("depot") ? 0.08 : 0; }
            function recoverSlots() { return hasProperty("safehouse") ? 2 : 1; }
            function activeInjuries() {
                if (!G.crewStatus) return [];
                return Object.keys(G.crewStatus).filter(function (n) { return G.crewStatus[n].inj > 0; });
            }
            function renderProperties() {
                var c = document.getElementById("properties-app");
                if (!c) return;
                var rows = PROPERTIES.map(function (p, i) {
                    var owned = hasProperty(p.id);
                    var inCity = p.city === CITIES[G.city].name;
                    var used = owned ? propUsed(p.id) : 0;
                    return '<div class="trap-file-row">' +
                        '<span class="trap-file-name">' + p.name + '</span>' +
                        '<span class="trap-file-desc">' + p.desc + ' · ' + p.city +
                        (owned ? ' · <strong style="color:#00ff88">' + used + '/' + p.cap + '</strong> stored' : '') + '</span>' +

var to = G.travel.to, hrs = G.travel.hours;

            function totalDrugs() { return G.inventory.reduce(function (a, b) { return a + b; }, 0); }
