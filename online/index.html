                        } else if (isGun || isDevice) {
                            btn = '<button class="trap-menu-btn" style="width:auto;padding:2px 8px;margin:0;font-size:10px" onclick="TRAP.buyGear(' + idx + ')">' + (isDevice ? (isUpgrade ? "UPGRADE" : (ownedSameType ? "STASH" : "BUY")) : "BUY") + '</button>';
                        } else {
                            btn = '<button class="trap-menu-btn" style="width:auto;padding:2px 8px;margin:0;font-size:10px;' + (owned ? 'opacity:0.3' : '') + '" ' + (owned ? 'disabled' : '') + ' onclick="TRAP.buyGear(' + idx + ')">' + (owned ? "EQUIPPED" : (isBag && G.bag ? "UPGRADE" : "BUY")) + '</button>';
                        }
                        var reason = !available ? ' · <span style="color:#ff3b30">not in stock</span>'
                            : (!gearInCity(g) ? ' · <span style="color:#ff3b30">not sold here</span>' : '');
                        return '<div class="trap-file-row"' + (available ? '' : ' style="opacity:0.4"') + '>' +
                            itemIcon(g) +
                            '<span class="trap-file-name">' + g.name + tierTag(g) + (available && qty > 1 ? ' <span style="color:#ffcc00;font-size:9px">x' + qty + '</span>' : '') + '</span>' +
                            '<span class="trap-file-desc">' + g.desc + reason + '</span>' +
                            '<span class="trap-file-price">$' + cost.toLocaleString() + (discount ? ' <span style="color:#00ff41;font-size:9px">SALE</span>' : '') + '</span>' +
                            btn + '</div>';
                    }).join("")
                    : '<div style="color:#888;font-size:11px;padding:6px">Trunk is empty today.</div>';
                var crateText = G.hq ? ' Crates: ' + (G.hqCrates || 0) + ' (+10ea) · Containers: ' + (G.hqContainers || 0) + ' (+40ea) · Slots: ' + hqUnits() + '/' + hqCrateCap() + '.' : "";
                var lot = (G.hq && G.crew.length > 0) || showAll ? '<div class="trap-title">LOT' + ((G.hq && G.crew.length > 0) ? '' : ' <span style="color:#ffcc00">(dev view — no HQ)</span>') + '</div>' + renderLotRows() : "";
                c.innerHTML =
                    '<div class="trap-stats" style="display:flex;gap:12px;flex-wrap:wrap;padding:8px 0;font-size:12px;font-family:var(--trap-mono)"></div>' +
                    renderTrapHeader() +
                    '<div class="trap-title">TRAP</div>' +
                    '<button class="trap-menu-btn" onclick="TRAP.renderDrugMenu(\'buy\')">BUY DRUGS</button>' +
                    '<button class="trap-menu-btn" onclick="TRAP.renderDrugMenu(\'sell\')">SELL DRUGS</button>' +
/* Always listed, even when you're square with the shark. He has nothing to
                       collect from a player who owes nothing, but hiding him
                       would throw the whole mechanic away — the button marks
                       the feature as present-but-dormant until you borrow. */
                    (G.city === G.homeCity
                        ? '<button class="trap-menu-btn" onclick="TRAP.renderLoanShark()">LOAN SHARK' +
                          (G.debt > 0 ? '' : ' <span style="color:#4ade80">(clear)</span>') + '</button>'
                        : '<span title="The loan shark only operates in your hometown - go to ' + CITIES[G.homeCity].name + '."><button class="trap-menu-btn" disabled style="opacity:0.35;cursor:not-allowed">LOAN SHARK - ' + CITIES[G.homeCity].name + ' ONLY</button></span>') +
                    '<button class="trap-menu-btn" onclick="TRAP.doTrain()">TRAIN (-5hp, +fitness/str XP)</button>' +
                    (G.wanted ? '<button class="trap-menu-btn" style="border-color:#ff4444;color:#ff4444" onclick="TRAP.layLow()">LAY LOW — sleep 2 days ($300)</button>' : '') +
                    '<div class="trap-title">TRUNK — GEAR</div>' +
                    '<label class="shop-toggle"><input type="checkbox"' + (showAll ? ' checked' : '') + ' onchange="TRAP.toggleTrapAll()"> ' +
                        'Show all gear and cars in ' + CITIES[G.city].name + ', including what is out of stock</label>' +
                    '<div class="trap-info-box">' + (G.hq ? 'HQ capacity: ' + hqCapacity() + ' slots. ' + crateText : "Get an HQ to unlock the expanded trunk.") + ' ' + (G.bag ? 'Bag: ' + G.bag.name : "No bag equipped") + '.</div>' +
                    trunkRows + lot;
                refreshStats();
            }
            function renderLotRows() {
                var showAll = !!G.showAllTrunk;
                var order = CARS.map(function (car, i) { return i; });
                if (showAll) {
                    /* cars present in the lot first, the rest greyed out after */
                    order.sort(function (a, b) {
                        var av = lotAvailable(a) ? 0 : 1, bv = lotAvailable(b) ? 0 : 1;
                        if (av !== bv) return av - bv;
                        return CARS[a].cost - CARS[b].cost;
                    });
                }
                return order.map(function (i) {
                    var car = CARS[i];
                    var owned = G.playerCar && G.playerCar.name === car.name;
                    var available = lotAvailable(i);
                    /* Loot-only cars are named outright so the player knows they exist and what
                       they're chasing, but there is no buy button and no price
                       to pay. Cars still awaiting real stats say so instead of
                       showing placeholder numbers that would read as balance
                       decisions nobody made. */
                    if (car.lotExcluded) {
                        var stats = car.statsPending
                            ? '<span style="color:#666">stats TBD</span>'
                            : car.seats + ' seats | ' + car.gearSlots + ' gear | -' + Math.round(car.travelReduction * 100) + '% travel';
                        var tag = car.rare ? ' <span style="color:#ef4444">· RARE</span>' : '';
                        var perk = car.serverSlots
                            ? ' <span style="color:#38bdf8">· +' + car.serverSlots + ' server slot' + (car.serverSlots === 1 ? '' : 's') + ' (unwired)</span>'
                            : '';
                        return '<div class="trap-file-row">' +
                            itemIcon(car) +
                            '<span class="trap-file-name">' + escapeHtml(car.name) + '</span>' +
                            '<span class="trap-file-desc">' + escapeHtml(car.desc) + ' | ' + stats + tag + perk +
                            (owned ? ' <span style="color:#4ade80">· OWNED</span>' : ' <span style="color:#f59e0b">· LOOT ONLY</span>') + '</span>' +
                            '<span class="trap-file-price">' + (car.statsPending ? '—' : '$' + car.cost.toLocaleString()) + '</span></div>';
                    }
                    if (!available) {
                        if (!showAll) {
                            return '<div class="trap-file-row"><span style="color:#666">LOT #' + (i + 1) + '</span><span style="flex:1;color:#666">EMPTY</span></div>';
                        }
                        return '<div class="trap-file-row" style="opacity:0.4">' +
                            itemIcon(car) +
                            '<span class="trap-file-name">' + car.name + '</span>' +
                            '<span class="trap-file-desc">' + car.desc + ' | ' + car.seats + ' seats | ' + car.gearSlots + ' gear | -' + Math.round(car.travelReduction * 100) + '% travel · <span style="color:#ff3b30">not in stock</span></span>' +
                            '<span class="trap-file-price">$' + car.cost.toLocaleString() + '</span>' +
                            '<button class="trap-menu-btn" style="width:auto;padding:2px 7px;margin:0;font-size:9px;opacity:0.3" disabled>OUT</button></div>';
                    }
                    return '<div class="trap-file-row">' +
                        itemIcon(car) +
                        '<span class="trap-file-name">' + car.name + '</span>' +
                        '<span class="trap-file-desc">' + car.desc + ' | ' + car.seats + ' seats | ' + car.gearSlots + ' gear | -' + Math.round(car.travelReduction * 100) + '% travel</span>' +
                        '<span class="trap-file-price">$' + car.cost.toLocaleString() + '</span>' +
                        '<button class="trap-menu-btn" style="width:auto;padding:2px 7px;margin:0;font-size:9px" onclick="TRAP.buyCar(' + i + ')">' + (owned ? "SELECTED" : "BUY / ASSIGN") + '</button></div>';
                }).join("") + '<div style="color:#888;font-size:10px;padding:6px">Crew members need a car for missions.</div>';
            }
            function buyGear(idx) {
                var g = TRUNK_GEAR[idx];
                if (!trunkAvailable(g)) { addLog("That item is not in the trunk today.", "bad"); renderTrap(); return; }
                if (g.requiresHQ && !G.hq) { addLog("You need an HQ for that item.", "bad"); renderTrap(); return; }
                var discount = G.eventDiscounts.trunk || 0;
                var cost = Math.round(g.cost * (1 - discount));
                if (G.cash < cost) { addLog("Not enough cash!", "bad"); renderTrap(); return; }
                if (g.crate) {
                    if (hqUnits() >= hqCrateCap()) { addLog("Your HQ has reached its crate limit.", "bad"); renderTrap(); return; }
                    G.cash -= cost; takeTrunkStock(g.name, 1);
                    if (g.container) G.hqContainers = (G.hqContainers || 0) + 1;
                    else G.hqCrates = (G.hqCrates || 0) + 1;
                    G.maxCapacity = hqCapacity();
                    addLog("Bought " + g.name + " for $" + cost.toLocaleString() + ".", "good");
                    refreshStats(); renderTrap(); return;
                }
                if (g.device) {
                    if (!Array.isArray(G.devices)) G.devices = [];
                    if (!Array.isArray(G.spareDevices)) G.spareDevices = [];
                    var cur = G.devices.find(function (d) { return d.type === g.device; });
                    var entry = { name: g.name, type: g.device, tech: g.tech, queueBonus: g.queueBonus, cost: g.cost };
                    G.cash -= cost; takeTrunkStock(g.name, 1);
                    if (!cur) {
                        G.devices.push(entry);
                        addLog("Bought " + g.name + " for $" + cost.toLocaleString() + ".", "good");
                    } else if ((g.queueBonus || 0) > (cur.queueBonus || 0)) {
                        G.devices = G.devices.filter(function (d) { return d.type !== g.device; });
                        G.devices.push(entry);
                        G.spareDevices.push({ name: cur.name, type: cur.type, tech: cur.tech, queueBonus: cur.queueBonus, cost: cur.cost });
                        addLog("Upgraded " + cur.name + " to " + g.name + ".", "good");
                    } else {
                        G.spareDevices.push(entry);
                        addLog("Stashed " + g.name + " as a spare.", "good");
                    }
                    if (typeof renderDevices === 'function') renderDevices();
                    refreshStats(); renderTrap(); return;
                }
                if (g.bagSlots) {
                    if (G.bag && G.bag.name === g.name) { addLog("Already equipped!", "bad"); renderTrap(); return; }
                    var newCap = 100 + g.bagSlots;
                    if (newCap < totalDrugs()) { addLog("Too much in current bag to downgrade.", "bad"); renderTrap(); return; }
                    G.cash -= cost; takeTrunkStock(g.name, 1);
                    G.bag = { name: g.name, slots: g.bagSlots };
                    G.maxCapacity = G.hq ? hqCapacity() : newCap;
                    addLog("Equipped " + g.name + ". Capacity: " + G.maxCapacity + ".", "good");
                    refreshStats(); renderTrap(); return;
                }
                if (g.damage) {
                    G.cash -= cost; takeTrunkStock(g.name, 1);
                    var status = g.stolenOnly ? "stolen" : (Math.random() < 0.5 ? "stolen" : "new");
                    var gun = { name: g.name, desc: g.desc, damage: g.damage, status: status, assignedTo: null };
                    G.guns.push(gun);
                    var gunIdx = G.guns.length - 1;
                    addLog("Bought " + gunLabel(gun) + " for $" + cost.toLocaleString() + ".", "good");
                    if (!G.guns.some(function (x) { return x.assignedTo === "player"; })) {
                        gun.assignedTo = "player";
                        addLog(gunLabel(gun) + " equipped.", "neutral");
                    } else {
                        gun.assignedTo = "pocket";
                        addLog(gunLabel(gun) + " stashed in pockets.", "neutral");
                    }
                    queueSave();
                    refreshStats(); renderTrap(); return;
                }
                if (g.armor) {
                    G.cash -= cost; takeTrunkStock(g.name, 1);
                    G.gear = G.gear.filter(function (x) { return !x.armor; });
                    G.gear.push({ name: g.name, desc: g.desc, armor: g.armor });
                    /* vest adds to the 1 base rather than replacing it. Armor no longer
                       depletes, so there is nothing to restore - swapping sets
                       the stat to the new ceiling. */
                    G.maxArmor = 1 + g.armor;
                    G.armor = G.maxArmor;
                    queueSave();
                    addLog("Equipped " + g.name + " (+" + g.armor + " armor, " + G.maxArmor + " total — " + armorReduction() + "% less damage taken).", "good");
                    refreshStats(); renderTrap(); return;
                }
                if (g.mask) {
                    if (G.gear.some(function (x) { return x.mask; })) { addLog("Already equipped a mask.", "bad"); renderTrap(); return; }
                    G.cash -= cost; takeTrunkStock(g.name, 1);
                    G.gear.push({ name: g.name, desc: g.desc, mask: true, escapeBonus: g.escapeBonus });
                    addLog("Equipped " + g.name + ".", "good");
                    refreshStats(); renderTrap(); return;
                }
                if (G.gear.some(function (x) { return x.name === g.name; })) { addLog("Already owned!", "bad"); renderTrap(); return; }
                G.cash -= cost; takeTrunkStock(g.name, 1);
                G.gear.push({ name: g.name, desc: g.desc });
                addLog("Bought " + g.name + " for $" + cost.toLocaleString() + ".", "good");
                refreshStats(); renderTrap();
            }
            function buyCar(idx) {
                var car = CARS[idx];
                if (!car) return;
                /* loot-only cars can't be bought, whatever the roll says */
                if (car.lotExcluded) { addLog(car.name + " isn't for sale. You'd have to find one.", "bad"); renderTrap(); return; }
                if (!G.showAllTrunk && (!G.hq || G.crew.length < 1)) { addLog("You need an HQ and crew.", "bad"); renderTrap(); return; }
                if (!lotAvailable(idx)) { addLog("That lot is empty today.", "bad"); renderTrap(); return; }
                if (G.cash < car.cost) { addLog("Not enough cash!", "bad"); renderTrap(); return; }
                var c = document.getElementById("trap-app");
                var choices = ["player"].concat(G.crew);
                c.innerHTML = '<div class="trap-title">BUY ' + car.name + '</div><div class="trap-info-box">Choose who gets this car.</div>' +
                    choices.map(function (target) {
                        var q = target === "player" ? G.playerCar : getCrewGear(target).car;
                        return '<button class="trap-menu-btn" ' + (q ? 'disabled style="opacity:0.35"' : '') + ' onclick="TRAP.confirmCarPurchase(' + idx + ',\'' + target.replace(/'/g, "\\'") + '\')">' + (target === "player" ? "YOU" : target.toUpperCase()) + (q ? ' — HAS ' + q.name : '') + '</button>';
                    }).join("") + '<button class="trap-menu-btn trap-back" onclick="TRAP.renderTrap()">BACK</button>';
            }
            function confirmCarPurchase(idx, target) {
                var car = CARS[idx];
                if (!car || car.lotExcluded) { addLog("That lot is empty today.", "bad"); renderTrap(); return; }
                if (G.cash < car.cost) { addLog("Not enough cash!", "bad"); renderTrap(); return; }
                if (target === "player" ? G.playerCar : getCrewGear(target).car) { addLog("That person already has a car.", "bad"); renderTrap(); return; }
                G.cash -= car.cost;
                var carObj = Object.assign({}, car);
                if (target === "player") {
                    G.playerCar = carObj;
                    /* Small Van and Bank Truck carry server
                       racks. Grant them on acquisition, so the racks come with
                       the vehicle instead of needing a second purchase. */
                    if (car.serverSlots) {
                        G.servers = serverCount() + car.serverSlots;
                        addLog("+ " + car.serverSlots + " server slot" + (car.serverSlots === 1 ? "" : "s") + " from the " + car.name + ".", "good");
                    }
                }
                else getCrewGear(target).car = carObj;
                queueSave();
                addLog(car.name + " bought and assigned to " + (target === "player" ? "you" : target) + ".", "good");
                refreshStats(); renderTrap();
            }
            function doTrain() {
                if (G.hp <= 5) { addLog("Too weak to train!", "bad"); renderTrap(); return; }
                G.hp -= 5;
                var stat = Math.random() < 0.5 ? "fitness" : "strength";
                grantXp(stat, 1);
                addLog("Trained. -5 HP. +1 " + stat + " XP.", "neutral");
                refreshStats(); renderTrap();
            }
            function layLow() {
                if (!G.wanted) { addLog("No heat on you.", "neutral"); renderTrap(); return; }
                if (G.cash < 300) { addLog("Not enough cash ($300).", "bad"); renderTrap(); return; }
                G.cash -= 300;
                addLog("Laying low for 2 days...", "neutral");
                G.day += 2;
                G.wanted = false;
                addLog("Heat cleared.", "good");
                refreshStats(); renderTrap();
            }
            function renderLoanShark() {
                var c = document.getElementById("trap-app");
                if (!c) return;
                if (G.city !== G.homeCity) {
                    addLog("The loan shark is in " + CITIES[G.homeCity].name + ". Deal with him there.", "bad");
                    renderTrap();
                    return;
                }
                var interest = Math.round(G.debt * 0.10);
                var owing = G.debt > 0;
                c.innerHTML = '<div class="trap-title">LOAN SHARK</div>' +
                    (owing
                        ? '<div class="trap-info-box" style="border-color:#ff4444"><span style="color:#ff4444">You owe: $' + G.debt.toLocaleString() + '</span><br>Interest: 10% per day (+$' + interest.toLocaleString() + ')</div>' +
                          '<div class="trap-bank-row"><span>Pay:</span><input class="trap-drug-input" type="number" min="0" id="loanPay" style="width:120px" placeholder="Amount"><button class="trap-menu-btn" style="width:auto;padding:4px 12px" onclick="TRAP.doLoanPay()">PAY</button><button class="trap-menu-btn" style="width:auto;padding:4px 12px" onclick="TRAP.doLoanPayAll()">PAY ALL</button></div>'
                        : '<div class="trap-info-box" style="border-color:#4ade80"><span style="color:#4ade80">You owe nothing.</span><br>Clean slate - no interest running.</div>') +
                    '<div class="trap-info-box">Cash: $' + G.cash.toLocaleString() + '</div>' +
                    '<button class="trap-menu-btn trap-back" onclick="TRAP.renderTrap()">BACK</button>';
            }
            function doLoanPayAll() {
                if (G.city !== G.homeCity) { addLog("The loan shark is in " + CITIES[G.homeCity].name + ".", "bad"); renderTrap(); return; }
                var amt = Math.min(G.cash, G.debt);
                if (amt <= 0) { addLog("No cash to pay!", "bad"); renderLoanShark(); return; }
                G.cash -= amt; G.debt -= amt;
                if (G.debt <= 0) { G.debt = 0; addLog("DEBT PAID OFF!", "good"); }
                else addLog("Paid $" + amt.toLocaleString() + ".", "good");
                renderLoanShark();
            }
            function doLoanPay() {
                if (G.city !== G.homeCity) { addLog("The loan shark is in " + CITIES[G.homeCity].name + ".", "bad"); renderTrap(); return; }
                var amt = parseInt(document.getElementById("loanPay").value) || 0;
                if (amt <= 0 || amt > G.cash) { addLog("Invalid amount.", "bad"); renderLoanShark(); return; }
                G.cash -= amt; G.debt -= amt;
                if (G.debt <= 0) { G.debt = 0; addLog("DEBT PAID OFF!", "good"); }
                else addLog("Paid $" + amt.toLocaleString() + ".", "good");
                renderLoanShark();
            }
            function renderDrugMenu(mode) {
                var c = document.getElementById("trap-app");
                var isBuy = mode === "buy";
                var atHome = G.city === G.homeCity;
                var rows = DRUGS.map(function (d, i) {
                    var price = priceAt(i);
                    var buyPrice = atHome ? Math.round(price * 0.9) : price;
                    var sellPrice = Math.round(price * (atHome ? 1.1 : 1) * (1 + resaleBonus()));
                    var owned = G.inventory[i];
                    if (!(price > 0)) {
                        return '<div class="trap-drug-row" style="opacity:0.4">' + itemIcon(d, 38, 'drug-icon') + '<span class="trap-drug-name">' + d.name + '</span><span class="trap-drug-price" style="color:#666">N/A</span><span class="trap-drug-owned">' + owned + '</span><span style="color:#666">-</span></div>';
                    }
                    if (!isBuy && G.boughtToday[i] && G.city === G.homeCity) {
                        return '<div class="trap-drug-row" style="opacity:0.3;pointer-events:none">' + itemIcon(d, 38, 'drug-icon') + '<span class="trap-drug-name">' + d.name + ' <span style="color:#ff4444;font-size:9px">LOCKED</span></span><span class="trap-drug-price" style="color:#666">$' + sellPrice.toLocaleString() + '</span><span class="trap-drug-owned">x' + owned + '</span><span style="color:#666">-</span></div>';
                    }
                    return '<div class="trap-drug-row">' +
                        itemIcon(d, 38, 'drug-icon') +
                        '<span class="trap-drug-name">' + d.name + (atHome ? ' <span style="color:#4fc3f7;font-size:9px">' + (isBuy ? '-10%' : '+10%') + '</span>' : '') + '</span>' +
                        '<span class="trap-drug-price">$' + (isBuy ? buyPrice : sellPrice).toLocaleString() + (isBuy ? '/ea' : '') + '</span>' +
                        '<span class="trap-drug-owned">x' + owned + '</span>' +
                        '<input class="trap-drug-input" type="number" min="0" value="0" id="qty' + i + '" max="999">' +
                        '<button class="trap-menu-btn" style="width:auto;padding:4px 10px;margin:0" onclick="TRAP.doTrade(\'' + mode + '\',' + i + ')">' + (isBuy ? "BUY" : "SELL") + '</button>' +
                        '<button class="trap-menu-btn" style="width:auto;padding:4px 6px;margin:0 0 0 4px;font-size:9px" onclick="TRAP.maxTrade(\'' + mode + '\',' + i + ')">MAX</button></div>';
                }).join("");
                c.innerHTML = '<div class="trap-title" style="display:flex;align-items:center;justify-content:space-between"><span>' + (isBuy ? "BUY DRUGS" : "SELL DRUGS") + ' - ' + CITIES[G.city].name + '</span><button class="trap-menu-btn" style="width:auto;padding:2px 8px;margin:0;font-size:10px" onclick="TRAP.renderDrugMenu(\'' + (isBuy ? "sell" : "buy") + '\')">GO TO ' + (isBuy ? "SELL" : "BUY") + '</button></div>' +                    '<div class="trap-drug-row" style="border:none;background:none;color:#888;font-size:11px"><span class="trap-drug-name">Drug</span><span class="trap-drug-price">Price</span><span class="trap-drug-owned">Own</span><span>Qty</span><span style="width:104px"></span></div>' +
                    rows +
                    (isBuy ? '<div class="trap-info-box">Cash: $' + G.cash.toLocaleString() + ' | Pockets: ' + totalDrugs() + '/' + G.maxCapacity + '</div>' : '') +
                    (atHome ? '<div style="font-size:9px;color:#4fc3f7;margin-bottom:4px">*hometown discount</div>' : '') +
                    '<button class="trap-menu-btn trap-back" onclick="TRAP.renderTrap()">BACK</button>';
            }
            function doTrade(mode, drugIdx) {
                var qtyInput = document.getElementById("qty" + drugIdx);
                var qty = parseInt(qtyInput.value) || 0;
                if (qty <= 0) return;
                if (mode === "buy") {
                    var atHome = G.city === G.homeCity;
                    if (!(priceAt(drugIdx) > 0)) { addLog("No supply of that here right now.", "bad"); renderDrugMenu(mode); return; }
                    var price = atHome ? Math.round(priceAt(drugIdx) * 0.9) : priceAt(drugIdx);
                    var cost = qty * price;
                    if (cost > G.cash) { addLog("Not enough cash!", "bad"); renderDrugMenu(mode); return; }
                    if (totalDrugs() + qty > G.maxCapacity) { addLog("Not enough pocket space!", "bad"); renderDrugMenu(mode); return; }
                    G.cash -= cost;
                    G.inventory[drugIdx] += qty;
                    if (atHome) G.boughtToday[drugIdx] = true;
                    addLog("Bought " + qty + " " + DRUGS[drugIdx].name + " for $" + cost.toLocaleString() + ".", "good");
                } else {
                    if (qty > G.inventory[drugIdx]) { addLog("You don't have that many!", "bad"); renderDrugMenu(mode); return; }
                    if (G.boughtToday[drugIdx] && G.city === G.homeCity) { addLog("Can't sell today.", "bad"); renderDrugMenu(mode); return; }

            /* The single cash<->bank mover. Both the HQ buttons and the PC

            function bankMove(direction, amount) {
                var amt = Math.floor(Number(amount));
                if (!isFinite(amt) || amt <= 0) { addLog("Enter an amount first.", "bad"); renderHQ(); return 0; }
                var cash = Math.max(0, Math.floor(Number(G.cash) || 0));
                var bank = Math.max(0, Math.floor(Number(G.bank) || 0));
                var moved = 0;
                if (direction === 'deposit') {
                    moved = Math.min(amt, cash);
                    if (moved <= 0) { addLog("No cash to deposit.", "bad"); renderHQ(); return 0; }
                    G.cash = cash - moved;
                    G.bank = bank + moved;
                    addLog("Deposited $" + moved.toLocaleString() + " to the bank.", "good");
                } else if (direction === 'withdraw') {
                    moved = Math.min(amt, bank);
                    if (moved <= 0) { addLog("Nothing in the bank to withdraw.", "bad"); renderHQ(); return 0; }
                    G.bank = bank - moved;
                    G.cash = cash + moved;
                    addLog("Withdrew $" + moved.toLocaleString() + " from the bank.", "good");
                } else {
                    return 0;
                }
                queueSave();
                renderHQ();
                return moved;
            }

            function crewMemberDies(name) {
                var q = getCrewGear(name), bits = [];
                if (q.gun) { q.gun.assignedTo = "pocket"; bits.push("gun kept"); }
                if (q.car) { if (!G.playerCar) { G.playerCar = q.car; bits.push("car kept"); } else bits.push("car lost"); }
                if (q.bag) { if (!G.bag) { G.bag = q.bag; bits.push("bag kept"); } else bits.push("bag lost"); }
                if (q.device) { G.spareDevices.push(q.device); bits.push("tech kept"); }
                delete G.crewGear[name];
                G.crew = G.crew.filter(function (n) { return n !== name; });
                if (G.crewStatus) delete G.crewStatus[name];
                /* a crew member just died: gear may have transferred to the

                queueSave();

            function resolveDeployment(d) {
                var def = jobDef(d.key);
                var ok = Math.random() * 100 < missionSuccessPct(d.power, d.grade);
                if (ok) {
                    var got = [], r = (def && def.reward) || {};
                    if (r.cash) { var n = r.cash[0] + Math.floor(Math.random() * (r.cash[1] - r.cash[0] + 1)); G.cash += n; got.push("$" + n.toLocaleString()); }
                    (r.drugs || []).forEach(function (x) {
                        var qn = x[1] + Math.floor(Math.random() * (x[2] - x[1] + 1));
                        var lost = grantDeployDrugs(x[0], qn);
                        got.push((qn - lost) + " " + DRUGS[x[0]].name + (lost > 0 ? " (" + lost + " lost, no room)" : ""));
                    });

            function jobReqOk(req) {
                if (!req) return { ok: true, why: "" };
                if (Array.isArray(req)) {

            /* Gear ADDS to your base damage rather than replacing it, so the 1 you
               start with always counts: 1 base + gun + strength. Strength
               still contributes so training stays worth something in a
               fight - if you want it dropped, it's the one term to remove. */
            function playerDmg() {
                var base = G.damage || 1;
                var gun = G.guns.find(function (g) { return g.assignedTo === "player"; });
                return base + (gun ? (gun.damage || 0) : 0) + (G.stats.strength || 0);
            }
            /* ── ARMOR AS DEFENCE ─────────────────────────────────────────
               Armor is a damage-reduction stat, not a pool of extra HP. It
               used to absorb hits and deplete, so a couple of fights walked it
               to zero and the player was left naked for the rest of the day
               with no way back except buying another vest.

               Now it never depletes. The curve is diminishing - reduction% =
               armor / (armor + 100) - so a +50 vest is a real step up from
               nothing while a +150 one is not immunity. The base 1 is bare
               skin and counts as 0%, and the cap keeps fights always losable. */
            function armorReduction() {
                var a = Math.max(0, (G.armor || 1) - 1);

            function damageAfterArmor(raw) {

            }
            function renderFightTarget() {

            }
            function fightLogLine(msg, type) { G.fightLog.unshift([Date.now(), msg, type || "neutral"]); if (G.fightLog.length > 20) G.fightLog.pop(); }
            function hit(times) {

               Members is the exception: it is where the player buys the
               crew, so it has to stay reachable to unlock the rest. */
            if (group === 'crews' && sub !== 'crew-members' && TRAP.hasCrew && !TRAP.hasCrew()) {
                if (TRAP.addLog) TRAP.addLog("You have not started a crew yet. Start one from Crews > Members first.", "bad");
                return;
            }
            var groupEl = document.getElementById('panel-' + group);
            if (!groupEl) return;
            groupEl.querySelectorAll('.subtab-btn').forEach(function (b) { b.classList.remove('active'); });
            if (btn) btn.classList.add('active');
            groupEl.querySelectorAll('.subtab-panel').forEach(function (p) { p.style.display = 'none'; });
            var el = document.getElementById('subtab-' + sub);
            if (el) el.style.display = 'block';
            renderSubtab(sub);
        }
            function renderSubtab(sub) {
                if (sub === 'world-properties') { TRAP.renderProperties(); TRAP.mapNavHide(); }
                else if (sub === 'world-map') {
                    /* Travel lives under the world map: the list of places you
                       can go is the same list the map shows, so the sidebar
                       carries the buttons and this panel carries the detail. */
                    TRAP.renderWorld();
                    TRAP.renderTravel();
                    TRAP.mapNavShow('world');
                }
                else if (sub === 'world-city') {
                    /* Only default to the city you're standing in when
                       arriving here directly. Arriving via the world map
                       sets G.viewCity first and switches the tab itself, so
                       overwriting it here would discard that choice. */
                    if (!TRAP.worldPendingCity) TRAP.G.viewCity = TRAP.G.city;
                    TRAP.worldPendingCity = false;
                    TRAP.renderMap(); TRAP.loadMapLocations();
                    /* The building record sits under its own city map, and the
                       sidebar lists that city's buildings. */
                    TRAP.renderBuilding();
                    TRAP.mapNavShow('city');
                    TRAP.renderCityTravel();
                }
                else if (sub === 'crew-operations') TRAP.renderOperations();
                else if (sub === 'crew-blackmarket') TRAP.renderBlackmarket();
                else if (sub === 'crew-members') TRAP.renderCrew();
                else if (sub === 'crew-officers') TRAP.renderOfficers();
                else if (sub === 'crew-heist') TRAP.renderHeist();
                else if (sub === 'crew-intel') TRAP.renderIntel();
                /* skills stay fresh on either Home subtab — the grid lives in a
                   hidden panel, so refreshing it costs nothing while on Overview */
                else if (sub === 'home-skills' || sub === 'home-overview') TRAP.renderSkills();
                else if (sub === 'home-inventory') TRAP.renderInventory();
                /* Jobs Done / win rate etc. were the hamburger Stats popup; they
                   live here now, and it is the same builder so the numbers
                   cannot disagree with what the popup used to show */
                else if (sub === 'home-stats') {
                    var grid = document.getElementById('home-stats-grid');
                    if (grid) grid.innerHTML = popupStatsBody();
                    if (typeof renderSynced === 'function') renderSynced();
                }
            }
        function renderVisibleSubtab(group) {
            var groupEl = document.getElementById('panel-' + group);
            if (!groupEl) return;
            var shown = groupEl.querySelector('.subtab-panel[style*="block"], .subtab-panel.active');
            if (shown && shown.id) { renderSubtab(shown.id.replace('subtab-', '')); return; }
            var firstBtn = groupEl.querySelector('.subtab-btn');
            if (firstBtn) showSubtab(group, firstBtn.dataset.subtab, firstBtn);
        }
        TRAP.startClock();
        TRAP.renderSkills();
        TRAP.renderSafehouseCard();
        renderDevices();
        loadSynced();
    </script>
</body>
</html>
