<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MISSION: MAINFRAME - SINGULARITY OS</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #050505; --glass: rgba(10, 20, 15, 0.9); --border: #00ff41; --text: #00ff41;
            --alert: #ff003c; --warn: #fcee0a; --dim: #003b00; --accent: #00f3ff;
            --scanline: rgba(0, 255, 65, 0.05);
        }
        * { box-sizing: border-box; outline: none; scrollbar-width: none; }
        body { 
            background: #000; color: var(--text); font-family: 'Courier New', monospace;
            margin: 0; height: 100vh; overflow: hidden; font-size: 14px;
            text-shadow: 0 0 4px var(--dim);
        }
        #root { display: flex; height: 100%; flex-direction: column; background: radial-gradient(circle, #0a150a 0%, #000 100%); }

        /* --- CRT EFFECT --- */
        .crt::after {
            content: " "; position: fixed; inset: 0; pointer-events: none; z-index: 999;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
        }

        /* --- LAYOUT --- */
        .os-bar { height: 30px; background: #001100; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 10px; font-weight: bold; }
        .desktop { flex: 1; display: grid; grid-template-columns: 250px 1fr 350px; grid-template-rows: 1fr 200px; gap: 10px; padding: 10px; }
        
        /* --- WINDOWS --- */
        .window { background: var(--bg); border: 1px solid var(--border); display: flex; flex-direction: column; position: relative; box-shadow: 0 0 15px var(--dim); }
        .win-title { background: var(--border); color: #000; padding: 2px 8px; font-weight: bold; display: flex; justify-content: space-between; cursor: default; }
        .win-content { flex: 1; overflow-y: auto; padding: 10px; font-size: 12px; }

        /* --- TERMINAL --- */
        .terminal { background: #000; color: #ccc; font-family: 'Consolas', monospace; padding: 5px; }
        .term-line { margin-bottom: 2px; word-break: break-all; }
        .term-input-line { display: flex; color: var(--text); }
        .term-input { background: transparent; border: none; color: var(--text); flex: 1; font-family: inherit; font-size: inherit; margin-left: 5px; }
        
        /* --- VISUALIZER --- */
        .network-vis { position: relative; background: #000500; overflow: hidden; }
        .node-icon { 
            position: absolute; width: 40px; height: 40px; border: 2px solid var(--border); border-radius: 50%;
            display: flex; align-items: center; justify-content: center; font-size: 1.2rem; cursor: pointer; 
            transition: 0.3s; background: #000; z-index: 10;
        }
        .node-icon:hover { box-shadow: 0 0 20px var(--text); transform: scale(1.1); }
        .node-icon.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 20px var(--accent); }
        .node-icon.locked { border-color: var(--alert); color: var(--alert); }
        
        /* --- HUD --- */
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 5px; border-bottom: 1px dashed var(--dim); padding-bottom: 2px; }
        .bar-wrap { height: 10px; background: #111; border: 1px solid var(--dim); width: 100px; }
        .bar-fill { height: 100%; transition: width 0.2s; }
        
        .file-item { padding: 4px; cursor: pointer; display: flex; gap: 10px; color: #aaa; }
        .file-item:hover { background: var(--dim); color: #fff; }
        .file-item.selected { background: var(--text); color: #000; }

        /* --- MODAL --- */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 200; display: flex; align-items: center; justify-content: center; }
        .modal-box { width: 600px; border: 2px solid var(--text); background: #000; padding: 20px; box-shadow: 0 0 50px var(--text); }
        
        /* --- ANIMATIONS --- */
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
        .alert-text { color: var(--alert); animation: pulse 0.5s infinite; font-weight: bold; }
    </style>
</head>
<body class="crt">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        // ==========================================
        // GAME DATABASE (Procedural Gen)
        // ==========================================
        const COMPANIES = ['Arasaka', 'Militech', 'Biotechnica', 'Kang Tao', 'OrbitalAir'];
        const FILE_TYPES = ['log', 'dat', 'txt', 'enc', 'exe'];
        
        const SOFTWARE = {
            'brute.exe': { name: 'BruteForce', ram: 4, type: 'ATK', effect: 'Cracks passwords', cost: 500 },
            'mask.v1': { name: 'Masking', ram: 2, type: 'DEF', effect: 'Slows trace by 30%', cost: 300 },
            'leech.dll': { name: 'DataLeech', ram: 3, type: 'UTIL', effect: 'Downloads files 2x speed', cost: 800 },
            'kill.sys': { name: 'TraceKill', ram: 8, type: 'ATK', effect: '-20% Active Trace', cost: 1500 },
            'nuke.bat': { name: 'LogicBomb', ram: 16, type: 'ULT', effect: 'Crashes Node Security', cost: 5000 }
        };

        const JOBS = [
            { id: 1, title: 'Clean Slate', payout: 1500, diff: 1, target: 'Police DB', goal: 'Delete file: record_492.dat' },
            { id: 2, title: 'Corporate Espionage', payout: 3000, diff: 3, target: 'Biotech R&D', goal: 'Download: prototype_x.enc' },
            { id: 3, title: 'The Blackmail', payout: 800, diff: 1, target: 'Personal Server', goal: 'Download: emails.db' }
        ];

        // ==========================================
        // OS ENGINE
        // ==========================================
        const App = () => {
            // --- OS STATE ---
            const [view, setView] = useState('DESKTOP'); // DESKTOP, LOGIN, BOOT
            const [credits, setCredits] = useState(500);
            const [reputation, setReputation] = useState(1);
            
            // --- DECK HARDWARE ---
            const [deck, setDeck] = useState({
                cpu: 2, // Actions per tick
                ram: 16, // Max active software cost
                storage: 100, // File capacity
                cooling: 100 // Thermal headroom
            });
            const [activePrograms, setActivePrograms] = useState([]);
            
            // --- HACKING SESSION ---
            const [session, setSession] = useState(null); // Null or Object { target, trace, connectedNode, ... }
            const [nodes, setNodes] = useState([]);
            const [files, setFiles] = useState([]); // Local files
            const [remoteFiles, setRemoteFiles] = useState([]); // Files on connected node
            const [terminalHistory, setTerminalHistory] = useState([
                { type: 'sys', msg: 'SingularityOS v9.0.1 Loaded...' },
                { type: 'sys', msg: 'Gateway Interface: ONLINE' }
            ]);
            
            // --- REFS ---
            const termInputRef = useRef();
            const scrollRef = useRef();

            // --- COMMAND PARSER ---
            const execCommand = (cmdStr) => {
                const parts = cmdStr.split(' ');
                const cmd = parts[0].toLowerCase();
                const args = parts.slice(1);
                
                addLog(`root@deck:~$ ${cmdStr}`, 'user');

                if (cmd === 'help') {
                    addLog('COMMANDS: connect, scan, ls, cat, rm, download, run, disconnect, jobs', 'sys');
                } 
                else if (cmd === 'jobs') {
                    addLog('AVAILABLE CONTRACTS:', 'sys');
                    JOBS.forEach(j => addLog(`[${j.id}] ${j.title} (${j.payout}¥) - Target: ${j.target}`, 'sys'));
                }
                else if (cmd === 'connect') {
                    if (args[0]) {
                        // Hacky way to start mission via ID
                        const job = JOBS.find(j => j.id === parseInt(args[0]));
                        if (job) startMission(job);
                        else addLog('Error: Invalid Job ID', 'err');
                    } else {
                        addLog('Usage: connect [job_id]', 'err');
                    }
                }
                else if (cmd === 'disconnect') {
                    if (session) {
                        addLog('Disengaging from system link...', 'warn');
                        setSession(null);
                        setNodes([]);
                        setRemoteFiles([]);
                    } else {
                        addLog('No active connection.', 'err');
                    }
                }
                else if (cmd === 'ls') {
                    if (!session) {
                        // Local files
                        addLog('LOCAL STORAGE:', 'sys');
                        files.forEach(f => addLog(`${f.name} [${f.size}MB]`, 'info'));
                    } else {
                        // Remote files
                        const node = nodes.find(n => n.id === session.connectedNode);
                        if (node && node.status === 'ROOT') {
                            addLog(`REMOTE FILES [${node.ip}]:`, 'sys');
                            node.files.forEach(f => addLog(`${f.name} [${f.type}]`, 'info'));
                        } else {
                            addLog('Error: Access Denied. Root privileges required.', 'err');
                        }
                    }
                }
                else if (cmd === 'run') {
                    const prog = SOFTWARE[args[0]];
                    if (!prog) return addLog('Error: Program not found.', 'err');
                    if (usedRam() + prog.ram > deck.ram) return addLog('Error: Insufficient RAM.', 'err');
                    
                    setActivePrograms(p => [...p, { ...prog, id: Date.now() }]);
                    addLog(`Executed ${prog.name}. RAM usage increased.`, 'success');
                    applyProgramEffect(prog);
                }
                else if (cmd === 'scan') {
                    if (!session) return addLog('No connection.', 'err');
                    addLog('Scanning network topology...', 'sys');
                    // Reveal neighbors
                    const current = nodes.find(n => n.id === session.connectedNode);
                    addLog(`Node ${current.id} connected to: ${current.links.join(', ')}`, 'info');
                }
                else {
                    addLog(`Command not found: ${cmd}`, 'err');
                }
            };

            const addLog = (msg, type='info') => {
                setTerminalHistory(prev => [...prev, { type, msg }].slice(-50));
            };

            // --- GAMEPLAY LOGIC ---
            const startMission = (job) => {
                addLog(`Initializing connection to ${job.target}...`, 'sys');
                // Generate Network
                const newNodes = [];
                // Gateway
                newNodes.push({ id: 0, type: 'GATEWAY', ip: '192.168.0.1', status: 'ROOT', links: [1, 2], files: [], x: 50, y: 90 });
                // Layer 1
                newNodes.push({ id: 1, type: 'NODE', ip: '10.0.4.2', status: 'LOCKED', security: 2, links: [0, 3], files: generateFiles(2), x: 30, y: 60 });
                newNodes.push({ id: 2, type: 'NODE', ip: '10.0.4.3', status: 'LOCKED', security: 3, links: [0, 4], files: generateFiles(2), x: 70, y: 60 });
                // Layer 2
                newNodes.push({ id: 3, type: 'DB', ip: '10.0.8.1', status: 'LOCKED', security: 5, links: [1, 5], files: generateFiles(5), x: 20, y: 30 });
                newNodes.push({ id: 4, type: 'AUTH', ip: '10.0.8.9', status: 'LOCKED', security: 4, links: [2, 5], files: [], x: 80, y: 30 });
                // Core
                newNodes.push({ id: 5, type: 'CORE', ip: 'ROOT', status: 'LOCKED', security: 10, links: [3, 4], files: [{name: job.goal.split(' ')[2], type:'DAT', size: 50}], x: 50, y: 10 });

                setNodes(newNodes);
                setSession({ 
                    job, 
                    connectedNode: 0, 
                    trace: 0, 
                    integrity: 100 
                });
                addLog('Connection Established via Gateway.', 'success');
            };

            const generateFiles = (count) => {
                const files = [];
                for(let i=0; i<count; i++) {
                    files.push({
                        name: `file_${Math.floor(Math.random()*999)}.${FILE_TYPES[Math.floor(Math.random()*FILE_TYPES.length)]}`,
                        size: Math.floor(Math.random()*20) + 1,
                        content: 'Encrypted Data...'
                    });
                }
                return files;
            };

            const usedRam = () => activePrograms.reduce((a, b) => a + b.ram, 0);

            const applyProgramEffect = (prog) => {
                if (!session) return;
                
                if (prog.type === 'ATK') {
                    // Attack current node
                    const node = nodes.find(n => n.id === session.connectedNode);
                    if (node.status !== 'ROOT') {
                        // Simplified hacking mechanic
                        addLog(`Attacking ${node.ip} firewall...`, 'warn');
                        // In a real tick loop, this would reduce security over time
                        // For MVP, instant check with RNG
                        if (Math.random() > 0.3) {
                            node.status = 'ROOT';
                            addLog(`Access Granted to ${node.ip}`, 'success');
                            setNodes([...nodes]); // trigger update
                        } else {
                            addLog('Attack Failed. Trace increased.', 'err');
                            setSession(s => ({ ...s, trace: s.trace + 15 }));
                        }
                    } else {
                        addLog('Target already rooted.', 'info');
                    }
                }
                if (prog.type === 'DEF') {
                    addLog('Masking protocols active.', 'info');
                }
                // Remove one-off programs
                if (prog.type !== 'DEF') {
                    setTimeout(() => {
                        setActivePrograms(prev => prev.filter(p => p.id !== prog.id));
                    }, 2000);
                }
            };

            // --- GAME TICK LOOP ---
            useEffect(() => {
                if (!session) return;
                
                const timer = setInterval(() => {
                    setSession(prev => {
                        if (prev.trace >= 100) {
                            clearInterval(timer);
                            addLog('CRITICAL FAILURE: LOCATION TRACED.', 'err');
                            setSession(null);
                            setNodes([]);
                            return null;
                        }
                        
                        // Trace calculation
                        let traceDelta = 0.5;
                        if (activePrograms.find(p => p.name === 'Masking')) traceDelta = 0.1;
                        
                        return { ...prev, trace: prev.trace + traceDelta };
                    });
                }, 500);
                
                return () => clearInterval(timer);
            }, [session, activePrograms]);

            // --- UI HANDLERS ---
            const handleNodeClick = (node) => {
                if (!session) return;
                const current = nodes.find(n => n.id === session.connectedNode);
                
                // Can only move to connected nodes
                if (current.links.includes(node.id)) {
                    setSession(s => ({ ...s, connectedNode: node.id }));
                    addLog(`Routing to ${node.ip}...`, 'sys');
                    if (node.status === 'LOCKED') {
                        addLog('Warning: Node is locked. Deploy ICE-Breakers.', 'warn');
                    } else {
                        addLog('Node accessed. File system available.', 'success');
                        setRemoteFiles(node.files);
                    }
                }
            };

            // --- RENDER ---
            return (
                <div id="root">
                    <div className="os-bar">
                        <span>SINGULARITY OS v12.4</span>
                        <span>CREDITS: {credits}¥</span>
                        <span>NET: {session ? 'CONNECTED' : 'OFFLINE'}</span>
                    </div>

                    <div className="desktop">
                        {/* LEFT: DECK STATS */}
                        <div className="window">
                            <div className="win-title">CYBERDECK STATS</div>
                            <div className="win-content">
                                <div className="stat-row">
                                    <span>RAM USAGE</span>
                                    <span>{usedRam()} / {deck.ram} GB</span>
                                </div>
                                <div className="bar-wrap" style={{width:'100%'}}><div className="bar-fill" style={{width:`${(usedRam()/deck.ram)*100}%`, background:'var(--accent)'}}></div></div>
                                
                                <div className="stat-row" style={{marginTop:10}}>
                                    <span>THERMAL</span>
                                    <span>34°C</span>
                                </div>
                                <div className="bar-wrap" style={{width:'100%'}}><div className="bar-fill" style={{width:'34%', background:'var(--text)'}}></div></div>

                                <h4 style={{borderBottom:'1px solid var(--border)', marginTop:20}}>ACTIVE PROCESSES</h4>
                                {activePrograms.map(p => (
                                    <div key={p.id} style={{fontSize:'10px', display:'flex', justifyContent:'space-between', color:'var(--warn)'}}>
                                        <span>{p.name}</span>
                                        <span>-{p.ram}GB</span>
                                    </div>
                                ))}
                                {activePrograms.length === 0 && <div style={{color:'#666'}}>No active software.</div>}
                            </div>
                        </div>

                        {/* CENTER: VISUALIZER */}
                        <div className="window" style={{gridColumn:'2 / 3', gridRow:'1 / 3'}}>
                            <div className="win-title">
                                <span>NET_TOPOLOGY_VISUALIZER</span>
                                {session && <span className={session.trace>80?'alert-text':''} style={{color: session.trace>50?'var(--alert)':'var(--text)'}}>TRACE: {session.trace.toFixed(1)}%</span>}
                            </div>
                            <div className="win-content network-vis" style={{padding:0}}>
                                {session ? (
                                    <>
                                        {/* CONNECTIONS */}
                                        <svg style={{position:'absolute', width:'100%', height:'100%', pointerEvents:'none'}}>
                                            {nodes.map(n => n.links.map(targetId => {
                                                const t = nodes.find(x => x.id === targetId);
                                                if(!t || t.id < n.id) return null;
                                                return <line key={`${n.id}-${t.id}`} x1={n.x+'%'} y1={n.y+'%'} x2={t.x+'%'} y2={t.y+'%'} stroke="var(--dim)" strokeWidth="2" />
                                            }))}
                                        </svg>
                                        {/* NODES */}
                                        {nodes.map(n => (
                                            <div key={n.id} 
                                                className={`node-icon ${n.status==='LOCKED'?'locked':''} ${session.connectedNode===n.id?'active':''}`}
                                                style={{left:`${n.x}%`, top:`${n.y}%`, transform:'translate(-50%, -50%)'}}
                                                onClick={() => handleNodeClick(n)}
                                            >
                                                <i className={`fas ${n.type==='GATEWAY'?'fa-globe':n.type==='DB'?'fa-database':n.type==='CORE'?'fa-microchip':'fa-server'}`}></i>
                                            </div>
                                        ))}
                                    </>
                                ) : (
                                    <div style={{display:'flex', alignItems:'center', justifyContent:'center', height:'100%', color:'var(--dim)', fontSize:'2rem'}}>
                                        NO CARRIER SIGNAL
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* RIGHT: SOFTWARE LIBRARY */}
                        <div className="window">
                            <div className="win-title">SOFTWARE LIBRARY</div>
                            <div className="win-content">
                                {Object.entries(SOFTWARE).map(([key, prog]) => (
                                    <div key={key} className="file-item" onClick={() => {
                                        termInputRef.current.value = `run ${key}`;
                                        termInputRef.current.focus();
                                    }}>
                                        <i className="fas fa-compact-disc"></i>
                                        <div>
                                            <div>{prog.name} ({prog.ram}GB)</div>
                                            <div style={{fontSize:'10px', color:'#666'}}>{prog.effect}</div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* BOTTOM LEFT: FILE SYSTEM */}
                        <div className="window" style={{gridRow:'2 / 3'}}>
                            <div className="win-title">FILE MANAGER</div>
                            <div className="win-content">
                                {session ? (
                                    <>
                                        <div style={{color:'var(--accent)', marginBottom:5}}>REMOTE: {nodes.find(n=>n.id===session.connectedNode)?.ip}</div>
                                        {remoteFiles.length === 0 ? <div style={{color:'#666'}}>[EMPTY]</div> : 
                                            remoteFiles.map((f, i) => (
                                                <div key={i} className="file-item">
                                                    <i className="fas fa-file-code"></i> {f.name} <span style={{marginLeft:'auto'}}>{f.size}MB</span>
                                                </div>
                                            ))
                                        }
                                    </>
                                ) : (
                                    <div style={{color:'#666'}}>LOCAL STORAGE MOUNTED</div>
                                )}
                            </div>
                        </div>

                        {/* BOTTOM RIGHT: TERMINAL */}
                        <div className="window" style={{gridColumn:'3 / 4', gridRow:'2 / 3'}}>
                            <div className="win-title">SHELL</div>
                            <div className="win-content terminal" ref={scrollRef}>
                                {terminalHistory.map((l, i) => (
                                    <div key={i} className="term-line" style={{color: l.type==='err'?'var(--alert)':l.type==='warn'?'var(--warn)':'var(--text)'}}>
                                        {l.type==='user'?'> ':''}{l.msg}
                                    </div>
                                ))}
                                <div ref={(el) => { if(el) el.scrollIntoView() }}></div>
                            </div>
                            <div className="term-input-line" style={{padding:'0 5px 5px 5px'}}>
                                <span>$</span>
                                <input ref={termInputRef} className="term-input" type="text" autoFocus onKeyDown={(e) => {
                                    if(e.key === 'Enter') {
                                        execCommand(e.target.value);
                                        e.target.value = '';
                                    }
                                }} />
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
